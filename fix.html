<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fix Permiso</title>
<style>body{margin:0;background:#000;color:#fff;font-family:sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:15px;padding:20px;text-align:center}button{padding:20px 30px;background:#ff7800;border:none;border-radius:30px;font-size:20px;font-weight:bold;color:#fff;width:90%}video{width:100%;height:60vh;object-fit:cover;background:#111;border-radius:15px}</style>
</head>
<body>
<h2>Prueba de permiso Chrome</h2>
<video id="v" autoplay playsinline muted></video>
<button id="btn" onclick="prender()">📷 TOCA AQUÍ PARA DAR PERMISO</button>
<p id="msg" style="font-size:12px;color:#0f0"></p>
<script>
async function prender(){
  let v=document.getElementById('v'), msg=document.getElementById('msg'), btn=document.getElementById('btn');
  msg.innerText='Pidiendo permiso...';
  try{
    let s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}, audio:false});
    v.srcObject=s; await v.play();
    msg.innerText='✅ PERMISO DADO - Lente: '+s.getVideoTracks()[0].label; btn.innerText='✅ Ya quedó, ahora abre la otra app';
    // guarda que ya tiene permiso
    setTimeout(()=>{ msg.innerText='Ya puedes cerrar esta pestaña y abrir la app limpia, ya va a jalar'; },2000);
  }catch(e){
    msg.innerText='❌ ERROR: '+e.name+' - '+e.message+'\n\n'+'Si dice NotAllowed: Ve a candadito > Configuración > Cámara > Permitir, luego recarga';
    console.error(e);
    if(e.name==='NotAllowedError'){
      alert('Chrome lo tiene bloqueado. Toca el candado 🔒 arriba > Configuración del sitio > Cámara > Permitir > Recargar');
    }
  }
}
</script>
</body>
</html>
