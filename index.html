<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cam IA Real</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:sans-serif}
#v{width:100%;height:100vh;object-fit:cover;background:#111}
#ctrl{position:fixed;bottom:0;left:0;right:0;background:#000;display:flex;justify-content:space-around;padding:15px;z-index:10}
button{padding:12px 18px;border-radius:10px;border:none;font-weight:bold}
#foto{background:#fff;color:#000;font-size:18px}
#msg{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:#000c;padding:8px 15px;border-radius:20px;z-index:10}
#res{position:fixed;inset:0;background:#000;display:none;flex-direction:column;z-index:20}
#res img{width:100%;flex:1;object-fit:contain}
</style>
</head>
<body>
<div id="msg">Tocá la pantalla para enfocar</div>
<video id="v" autoplay playsinline></video>
<div id="ctrl">
  <button onclick="cambiar()">Cambiar Cámara</button>
  <button id="foto" onclick="tomar()">Tomar Foto IA</button>
</div>
<div id="res"><img id="out"><button onclick="this.parentElement.style.display='none'" style="padding:15px;background:#ff7800;color:#fff">Cerrar</button><a id="down" download="pastel-ia.jpg" style="padding:15px;background:#fff;color:#000;text-align:center;margin:10px;border-radius:10px;text-decoration:none">Guardar Foto HD</a></div>

<script>
let video=document.getElementById('v'), stream, facing='environment', track;
async function iniciar(){
  if(stream) stream.getTracks().forEach(t=>t.stop());
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing}});
    video.srcObject=stream; await video.play();
    track=stream.getVideoTracks()[0];
    document.getElementById('msg').innerText='Cámara lista - Toca para enfocar';
  }catch(e){
    document.getElementById('msg').innerText='Error: Dale permiso a la cámara y usa HTTPS';
  }
}
iniciar();
function cambiar(){ facing=facing=='environment'?'user':'environment'; iniciar(); }
video.onclick=async(e)=>{
  const x=e.clientX/window.innerWidth, y=e.clientY/window.innerHeight;
  document.getElementById('msg').innerText='Enfocando...';
  try{ await track.applyConstraints({advanced:[{focusMode:'manual', pointsOfInterest:[{x,y}]}]}); }catch{}
  setTimeout(()=>document.getElementById('msg').innerText='Cámara lista',800);
}
async function tomar(){
  let c=document.createElement('canvas'); c.width=video.videoWidth; c.height=video.videoHeight;
  c.getContext('2d').drawImage(video,0,0);
  let base64=c.toDataURL('image/jpeg',0.9);
  document.getElementById('msg').innerText='Subiendo a IA Real-ESRGAN... 5 seg';
  try{
    let r=await fetch('/api/upscale',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:base64})});
    let data=await r.json();
    if(!data.url) throw new Error(JSON.stringify(data));
    document.getElementById('out').src=data.url;
    document.getElementById('down').href=data.url;
    document.getElementById('res').style.display='flex';
    document.getElementById('msg').innerText='¡Foto mejorada con IA!';
  }catch(err){
    document.getElementById('msg').innerText='Error IA, guardando normal';
    let a=document.createElement('a'); a.href=base64; a.download='foto-normal.jpg'; a.click();
  }
}
</script>
</body>
</html>
