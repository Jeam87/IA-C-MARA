<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>AI Camara Pro Max</title>
<link rel="manifest" href="manifest.json" />
<style>
  body{margin:0;background:#000;overflow:hidden;font-family:sans-serif;touch-action:none}
  #cam{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;display:none}
  #out{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}
  #focusBox{display:none;position:fixed;width:70px;height:70px;border:2px solid #ffeb3b;border-radius:8px;pointer-events:none;z-index:10;transition:all 0.2s}
  #ui{position:fixed;bottom:0;left:0;right:0;padding:15px;display:flex;flex-direction:column;gap:10px;background:linear-gradient(transparent, #000e);z-index:5}
  #controls{display:flex;align-items:center;justify-content:space-around}
  #shutter{width:80px;height:80px;border-radius:50%;background:#fff;border:4px solid #fff8}
  #flip{width:52px;height:52px;border-radius:50%;background:#222;color:#fff;border:2px solid #fff;font-size:22px}
  label{color:#fff;font-size:13px}
  input{width:100%}
</style>
</head>
<body>
<video id="cam" autoplay playsinline muted></video>
<canvas id="out"></canvas>
<div id="focusBox"></div>
<div id="ui">
  <label>Belleza IA: <span id="val">50</span>% <input type="range" id="beauty" min="0" max="100" value="50"></label>
  <div id="zoomRow" style="display:none"><label>Zoom: <span id="zVal">1x</span> <input type="range" id="zoom" min="1" max="5" step="0.1" value="1"></label></div>
  <div id="controls">
    <button id="flip">↻</button>
    <button id="shutter"></button>
    <div style="width:52px"></div>
  </div>
  <p style="color:#aaa;font-size:11px;text-align:center;margin:0">Toca la pantalla para enfocar • Pellizca para zoom</p>
</div>
<script>
const video = document.getElementById('cam');
const canvas = document.getElementById('out');
const ctx = canvas.getContext('2d');
const slider = document.getElementById('beauty');
const val = document.getElementById('val');
const zoomSlider = document.getElementById('zoom');
const zVal = document.getElementById('zVal');
const focusBox = document.getElementById('focusBox');
let facing = 'user', stream, track, zoomLevel = 1;

async function start(){
  if(stream){ stream.getTracks().forEach(t=>t.stop()); }
  try{
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:facing}, audio:false});
    video.srcObject = stream;
    track = stream.getVideoTracks()[0];
    const caps = track.getCapabilities();
    if(caps.zoom){
      document.getElementById('zoomRow').style.display = 'block';
      zoomSlider.min = caps.zoom.min; zoomSlider.max = caps.zoom.max; zoomSlider.step = caps.zoom.step || 0.1;
    }
    await video.play();
    canvas.width = video.videoWidth; canvas.height = video.videoHeight;
    requestAnimationFrame(draw);
  }catch(e){ alert('Permite la cámara: ' + e.message); }
}
function draw(){
  const level = slider.value / 100;
  const blur = (level * 1.2).toFixed(1);
  ctx.filter = `contrast(${1 + level*0.1}) saturate(${1 + level*0.3}) brightness(${1 + level*0.12}) blur(${blur*0.2}px)`;
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  ctx.globalAlpha = level * 0.35;
  ctx.filter = `blur(${blur}px) brightness(1.1)`;
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  ctx.globalAlpha = 1; ctx.filter = 'none';
  requestAnimationFrame(draw);
}
slider.oninput = ()=> val.textContent = slider.value;
zoomSlider.oninput = async (e)=>{
  zoomLevel = parseFloat(e.target.value); zVal.textContent = zoomLevel.toFixed(1)+'x';
  if(track?.getCapabilities().zoom){ try{ await track.applyConstraints({advanced:[{zoom:zoomLevel}]}); }catch{} }
};
document.getElementById('flip').onclick = ()=>{ facing = facing==='user'?'environment':'user'; start(); };

// TOQUE PARA ENFOCAR
canvas.addEventListener('click', async (e)=>{
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) / rect.width;
  const y = (e.clientY - rect.top) / rect.height;
  focusBox.style.left = (e.clientX-35)+'px'; focusBox.style.top = (e.clientY-35)+'px';
  focusBox.style.display='block'; setTimeout(()=>focusBox.style.display='none',1200);
  if(track){
    try{ await track.applyConstraints({advanced:[{focusMode:'continuous', pointsOfInterest:[{x,y}]}]}); }catch{
      try{ await track.applyConstraints({advanced:[{focusMode:'auto'}]}); }catch{}
    }
  }
});

// FOTO CON AUTO-MEJORA
document.getElementById('shutter').onclick = ()=>{
  const c = document.createElement('canvas'); c.width = canvas.width; c.height = canvas.height;
  const f = c.getContext('2d');
  f.filter = 'contrast(1.28) saturate(1.4) brightness(1.08)';
  f.drawImage(canvas,0,0);
  f.globalCompositeOperation='overlay'; f.globalAlpha=0.22; f.drawImage(canvas,0,0);
  const a = document.createElement('a'); a.download=`AI-PRO-${Date.now()}.jpg`; a.href=c.toDataURL('image/jpeg',0.95); a.click();
};
start();
</script>
</body>
</html>
