<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Cam Pasteles PRO Full HD</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:sans-serif;overflow:hidden}
#v{width:100vw;height:100vh;object-fit:cover;background:#111}
#msg{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#000d;padding:8px 14px;border-radius:20px;z-index:10;font-size:13px;text-align:center;max-width:90%}
#focus{position:fixed;width:80px;height:80px;border:2px solid #ff0;border-radius:50%;display:none;pointer-events:none;transform:translate(-50%,-50%);box-shadow:0 0 10px #ff0}
#ctrl{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(transparent,#000f);padding:10px;z-index:10;display:flex;flex-direction:column;gap:8px}
#row{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
#row button{background:#222;color:#fff;border:1px solid #444;padding:9px 12px;border-radius:10px;font-size:12px}
#row button.active{background:#ff7800;color:#000;font-weight:bold}
#shutterRow{display:flex;align-items:center;justify-content:center;gap:24px;margin-top:6px}
#btnVideo{width:56px;height:56px;border-radius:50%;background:#222;border:3px solid #fff;font-size:22px;color:#fff}
#foto{width:82px;height:82px;border-radius:50%;background:#fff;border:5px solid #ff7800;color:#000;font-size:32px;font-weight:bold}
#timer{text-align:center;color:#ff2a2a;font-weight:bold;display:none;font-size:18px;letter-spacing:1px}
#config{position:fixed;top:60px;right:10px;background:#000e;padding:12px;border-radius:12px;display:none;z-index:15;border:1px solid #333}
#config input{width:150px;margin:4px 0;padding:8px;border-radius:6px;border:none;display:block}
#res{position:fixed;inset:0;background:#000;z-index:20;display:none;flex-direction:column}
#res img,#res video{flex:1;width:100%;object-fit:contain;background:#000}
</style>
</head>
<body>
<video id="v" autoplay playsinline muted></video>
<div id="focus"></div>
<div id="msg">PRO listo - 2448x3264 foto HD - Toca para enfocar</div>

<div id="ctrl">
  <div id="row">
    <button id="bLejos" onclick="setModo('lejos')">Lejos</button>
    <button id="bMacro" class="active" onclick="setModo('macro')">📸 Macro</button>
    <button id="bPastel" onclick="setModo('pastel')">🎂 Pastel</button>
    <button onclick="cambiarLente()">↻ Cámara</button>
    <button onclick="toggleConfig()">⚙️ Texto</button>
  </div>
  <div id="shutterRow">
    <button id="btnVideo" onclick="toggleVideo()">🎥</button>
    <button id="foto" onclick="tomarPro()">📸</button>
    <div style="width:56px"></div>
  </div>
  <div id="timer">● 00:00</div>
</div>

<div id="config">
  <input id="inpNombre" placeholder="Nombre pastel">
  <input id="inpPrecio" placeholder="Precio $">
  <input id="inpUbi" placeholder="Ubicación">
  <button onclick="toggleConfig()" style="width:100%;margin-top:6px;background:#ff7800;border:none;padding:8px;border-radius:6px;font-weight:bold">Listo</button>
</div>

<div id="res">
  <img id="outImg" style="display:none">
  <video id="outVid" style="display:none" controls playsinline></video>
  <div style="display:flex;gap:10px;padding:12px">
    <a id="down" download="pastel-PRO.jpg" style="flex:1;padding:14px;background:#fff;color:#000;border-radius:10px;text-align:center;text-decoration:none;font-weight:bold">Guardar</a>
    <button onclick="cerrarRes()" style="flex:1;padding:14px;background:#333;color:#fff;border:none;border-radius:10px">Cerrar</button>
  </div>
</div>

<script>
let v=document.getElementById('v'), stream, track, imageCapture, devices=[], idx=0, modo='macro';
let grabando=false, recorder, timerInt=null, seg=0;
let cfg=document.getElementById('config'), msg=document.getElementById('msg');

async function iniciar(deviceId=null){
  if(stream) stream.getTracks().forEach(t=>t.stop());
  try{
    let cons={video:{width:{ideal:3840},height:{ideal:2160},facingMode:deviceId?undefined:'environment',focusMode:'continuous'}};
    if(deviceId) cons.video.deviceId={exact:deviceId};
    stream=await navigator.mediaDevices.getUserMedia(cons);
    v.srcObject=stream; await v.play();
    track=stream.getVideoTracks()[0];
    if('ImageCapture' in window) imageCapture=new ImageCapture(track);
    let caps=track.getCapabilities?track.getCapabilities():{};
    msg.innerText='PRO '+(caps.width?.max||3840)+'x'+(caps.height?.max||2160)+' listo ✓ Toca para enfocar';
    listar(); setModo(modo);
  }catch(e){ msg.innerText='Error cámara: '+e.message; }
}
async function listar(){ try{ let all=await navigator.mediaDevices.enumerateDevices(); devices=all.filter(d=>d.kind=='videoinput'); }catch{} }
iniciar();

function cambiarLente(){ if(devices.length<=1) return alert('Solo 1 cámara detectada'); idx=(idx+1)%devices.length; iniciar(devices[idx].deviceId); }
function setModo(m){
  modo=m;
  document.getElementById('bLejos').classList.remove('active');
  document.getElementById('bMacro').classList.remove('active');
  document.getElementById('bPastel').classList.remove('active');
  let btn=document.getElementById('b'+m.charAt(0).toUpperCase()+m.slice(1)); if(btn) btn.classList.add('active');
  try{
    if(m=='macro') track.applyConstraints({advanced:[{focusDistance:0.15}]}).catch(()=>{});
    else if(m=='pastel') track.applyConstraints({advanced:[{focusDistance:0.3}]}).catch(()=>{});
    else track.applyConstraints({advanced:[{focusMode:'continuous'}]}).catch(()=>{});
  }catch{}
}
function toggleConfig(){ cfg.style.display=cfg.style.display=='none'?'block':'none'; }

v.addEventListener('click', async(e)=>{
  let f=document.getElementById('focus'); f.style.left=e.clientX+'px'; f.style.top=e.clientY+'px'; f.style.display='block'; setTimeout(()=>f.style.display='none',1000);
  try{ await track.applyConstraints({advanced:[{pointsOfInterest:[{x:e.clientX/innerWidth,y:e.clientY/innerHeight}],focusMode:'manual'}]}); setTimeout(()=>track.applyConstraints({advanced:[{focusMode:'continuous'}]}),1200); msg.innerText='Enfocado ✓'; }catch{}
});

async function tomarPro(){
  msg.innerText='Tomando foto HD 12MP...';
  try{
    let blob;
    if(imageCapture?.takePhoto) blob=await imageCapture.takePhoto();
    else { let c=document.createElement('canvas'); c.width=v.videoWidth; c.height=v.videoHeight; c.getContext('2d').drawImage(v,0,0); blob=await new Promise(r=>c.toBlob(r,'image/jpeg',0.97)); }
    let bitmap=await createImageBitmap(blob);
    let cFinal=document.createElement('canvas'); cFinal.width=bitmap.width; cFinal.height=bitmap.height;
    let ctx=cFinal.getContext('2d'); ctx.drawImage(bitmap,0,0);
    // Texto precio / nombre / ubicacion
    let nombre=document.getElementById('inpNombre').value, precio=document.getElementById('inpPrecio').value, ubi=document.getElementById('inpUbi').value;
    if(nombre||precio||ubi){
      ctx.fillStyle='#0009'; ctx.fillRect(0,cFinal.height-140,cFinal.width,140);
      ctx.fillStyle='#fff'; ctx.font='bold 50px sans-serif';
      if(nombre) ctx.fillText(nombre,40,cFinal.height-80);
      if(precio){ ctx.fillStyle='#ff7800'; ctx.fillText(precio,40,cFinal.height-20); ctx.fillStyle='#fff'; }
      if(ubi){ ctx.font='26px sans-serif'; let w=ctx.measureText(ubi).width; ctx.fillText(ubi,cFinal.width-w-40,cFinal.height-30); }
    }
    let url=cFinal.toDataURL('image/jpeg',0.92);
    mostrarFoto(url, bitmap.width, bitmap.height);
  }catch(e){ msg.innerText='Error: '+e.message; }
}

function mostrarFoto(url,w,h){
  document.getElementById('outVid').style.display='none';
  let im=document.getElementById('outImg'); im.style.display='block'; im.src=url;
  let d=document.getElementById('down'); d.href=url; d.download='pastel-'+w+'x'+h+'.jpg';
  document.getElementById('res').style.display='flex';
  msg.innerText='PRO '+w+'x'+h+' listo ✓ Supera P30';
}

function toggleVideo(){
  let btn=document.getElementById('btnVideo'), fotoBtn=document.getElementById('foto'), t=document.getElementById('timer');
  if(!grabando){
    track.applyConstraints({width:{ideal:1920},height:{ideal:1080}}).catch(()=>{});
    let chunks=[]; let mime='video/webm;codecs=vp9';
    if(!MediaRecorder.isTypeSupported(mime)) mime='video/webm';
    recorder=new MediaRecorder(stream,{mimeType:mime, videoBitsPerSecond:5000000});
    recorder.ondataavailable=e=>{ if(e.data.size>0) chunks.push(e.data); };
    recorder.onstop=()=>{
      let b=new Blob(chunks,{type:'video/webm'}); let url=URL.createObjectURL(b);
      document.getElementById('outImg').style.display='none';
      let vv=document.getElementById('outVid'); vv.style.display='block'; vv.src=url;
      let d=document.getElementById('down'); d.href=url; d.download='pastel-video-'+Date.now()+'.webm';
      document.getElementById('res').style.display='flex';
      track.applyConstraints({width:{ideal:3840},height:{ideal:2160}}).catch(()=>{});
    };
    recorder.start(100); grabando=true; seg=0;
    t.style.display='block'; fotoBtn.style.opacity='0.3'; fotoBtn.style.pointerEvents='none';
    btn.style.background='#f00'; btn.innerText='■';
    timerInt=setInterval(()=>{ seg++; let m=String(Math.floor(seg/60)).padStart(2,'0'); let s=String(seg%60).padStart(2,'0'); t.innerText='● '+m+':'+s; },1000);
    msg.innerText='Grabando 1080p fluido...';
  } else {
    recorder.stop(); grabando=false; clearInterval(timerInt);
    t.style.display='none'; document.getElementById('foto').style.opacity='1'; document.getElementById('foto').style.pointerEvents='auto';
    btn.style.background='#222'; btn.innerText='🎥';
    msg.innerText='Video guardado ✓';
  }
}
function cerrarRes(){ document.getElementById('res').style.display='none'; let vv=document.getElementById('outVid'); vv.pause(); vv.src=''; }
</script>
</body>
</html>
