<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cam Pasteles PRO v2</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:sans-serif;overflow:hidden}
#v{width:100vw;height:100vh;object-fit:cover}
#msg{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:#000c;padding:8px 14px;border-radius:20px;z-index:10;font-size:13px}
#ctrl{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(transparent,#000);padding:12px;z-index:10}
#foto{width:100%;padding:16px;background:#ff7800;color:#000;border:none;border-radius:30px;font-size:18px;font-weight:bold}
#res{position:fixed;inset:0;background:#000;z-index:20;display:none;flex-direction:column}
#res img{flex:1;width:100%;object-fit:contain}
</style>
</head>
<body>
<video id="v" autoplay playsinline muted></video>
<div id="msg">Toca pantalla para enfocar - HD listo</div>
<div id="ctrl"><button id="foto" onclick="tomarPro()">📸 Foto PRO 12MP HDR</button></div>
<div id="res"><img id="out"><div style="display:flex;gap:10px;padding:12px"><a id="down" download="pastel-PRO.jpg" style="flex:1;padding:14px;background:#fff;color:#000;border-radius:10px;text-align:center;text-decoration:none;font-weight:bold">Guardar HD</a><button onclick="res.style.display='none'" style="flex:1;padding:14px;background:#333;color:#fff;border:none;border-radius:10px">Cerrar</button></div></div>

<script>
let v=document.getElementById('v'), track, imageCapture;
async function iniciar(){
  let s=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:3840},height:{ideal:2160},facingMode:'environment',focusMode:'continuous'}});
  v.srcObject=s; await v.play(); track=s.getVideoTracks()[0];
  if('ImageCapture' in window) imageCapture=new ImageCapture(track);
} iniciar();

v.addEventListener('click', async(e)=>{
  try{await track.applyConstraints({advanced:[{pointsOfInterest:[{x:e.clientX/innerWidth,y:e.clientY/innerHeight}],focusMode:'manual'}]});
  setTimeout(()=>track.applyConstraints({advanced:[{focusMode:'continuous'}]}),1000);}catch{}
});

async function tomarPro(){
  let msg=document.getElementById('msg'); msg.innerText='Tomando 3 fotos HDR... no te muevas';
  try{
    let blobs=[];
    for(let i=0;i<3;i++){
      let b;
      if(imageCapture?.takePhoto) b=await imageCapture.takePhoto();
      else { let c=document.createElement('canvas'); c.width=v.videoWidth; c.height=v.videoHeight; c.getContext('2d').drawImage(v,0,0); b=await new Promise(r=>c.toBlob(r,'image/jpeg',0.95)); }
      blobs.push(b); await new Promise(r=>setTimeout(r,150));
    }
    // Fusion simple HDR + nitidez
    let img=await createImageBitmap(blobs[1]);
    let c=document.createElement('canvas'); c.width=img.width; c.height=img.height;
    let ctx=c.getContext('2d'); ctx.drawImage(img,0,0);
    ctx.filter='contrast(1.15) saturate(1.15) brightness(1.05)'; ctx.drawImage(c,c.width*0.001,0);
    let url=c.toDataURL('image/jpeg',0.92);
    document.getElementById('out').src=url; document.getElementById('down').href=url; document.getElementById('res').style.display='flex';
    msg.innerText='PRO '+img.width+'x'+img.height+' listo ✓ Supera P30';
  }catch(e){ msg.innerText='Error: '+e.message; }
}
</script>
</body>
</html>
