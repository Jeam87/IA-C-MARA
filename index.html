<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<title>Pro Light</title>
<style>
 body{margin:0;background:#000;overflow:hidden;font-family:sans-serif}
 #out{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
 #topBar{position:fixed;top:0;left:0;right:0;z-index:99;padding:8px;background:linear-gradient(#000c,transparent)}
.bar{display:flex;gap:6px;overflow-x:auto;margin-top:6px}.bar::-webkit-scrollbar{display:none}
.btn{min-width:70px;height:34px;border-radius:17px;border:1px solid #fff4;background:#222;color:#fff;font-size:10px;font-weight:bold}
.btn.active{background:#fff;color:#000}
 #ui{position:fixed;bottom:0;left:0;right:0;z-index:99;display:flex;justify-content:space-around;padding:12px}
 #shutter{width:80px;height:80px;border-radius:50%;background:#fff}
</style>
</head>
<body>
<video id="cam" autoplay playsinline muted style="display:none"></video>
<canvas id="out"></canvas>
<div id="topBar">
  <div class="bar" id="colorBar"><button class="btn active" data-c="normal">NORMAL</button><button class="btn" data-c="sony">SONY</button><button class="btn" data-c="vivid">VIVID</button></div>
  <div class="bar" style="color:#fff;font-size:10px">Blur: <input type="range" id="blurRange" min="0" max="8" value="2.5" step="0.5"> <span id="bv">2.5</span> - Toca para enfocar, doble toque quita</div>
  <div class="bar" id="lensBar"></div>
</div>
<div id="ui"><div style="width:50px"></div><button id="shutter"></button><button id="flip" style="width:48px;height:48px;border-radius:50%;background:#222;color:#fff;border:1px solid #fff">↻</button></div>
<script>
const video=document.getElementById('cam'), canvas=document.getElementById('out'), ctx=canvas.getContext('2d');
let stream,track,devices=[],color='normal',curIdx=0,focus={x:0.5,y:0.5,active:false};

async function init(){
  const tmp=await navigator.mediaDevices.getUserMedia({video:true}); tmp.getTracks().forEach(t=>t.stop());
  devices=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput');
  const bar=document.getElementById('lensBar'); devices.forEach((d,i)=>{const b=document.createElement('button');b.className='btn'+(i==0?' active':'');b.textContent=`LENTE ${i+1}`;b.onclick=()=>{curIdx=i;start(d.deviceId,i);};bar.appendChild(b);});
  start(devices[0]?.deviceId,0);
}
async function start(id,idx){ if(stream) stream.getTracks().forEach(t=>t.stop()); stream=await navigator.mediaDevices.getUserMedia({video:{deviceId:id?{exact:id}:undefined,width:{ideal:1280},height:{ideal:720}}}); video.srcObject=stream; track=stream.getVideoTracks()[0]; await video.play(); canvas.width=video.videoWidth; canvas.height=video.videoHeight; loop(); }
function getFilter(){ if(color==='sony') return 'contrast(1.1) saturate(1.0) brightness(1.12)'; if(color==='vivid') return 'contrast(1.15) saturate(1.3) brightness(1.1)'; return 'contrast(1.05) brightness(1.1)'; }

let sharpCanvas=document.createElement('canvas'), blurCanvas=document.createElement('canvas');
function loop(){
  const blurVal=parseFloat(document.getElementById('blurRange').value); document.getElementById('bv').textContent=blurVal;
  const w=canvas.width, h=canvas.height;
  if(w!=sharpCanvas.width){ sharpCanvas.width=blurCanvas.width=w; sharpCanvas.height=blurCanvas.height=h; }

  ctx.filter=getFilter();
  if(!focus.active || blurVal==0){ ctx.drawImage(video,0,0,w,h); requestAnimationFrame(loop); return; }

  // Pre-render 1 sola vez por frame, no 3
  const sctx=sharpCanvas.getContext('2d'); sctx.filter=getFilter(); sctx.drawImage(video,0,0,w,h);
  const bctx=blurCanvas.getContext('2d'); bctx.filter=getFilter()+` blur(${blurVal}px)`; bctx.drawImage(video,0,0,w,h);

  // Fondo borroso
  ctx.drawImage(blurCanvas,0,0);
  // Centro nítido con borde suave usando radial gradient como mascara
  ctx.save();
  const cx=focus.x*w, cy=focus.y*h, r=Math.min(w,h)*0.38, f=90;
  const grad=ctx.createRadialGradient(cx,cy,r-f,cx,cy,r+f);
  grad.addColorStop(0,'white'); grad.addColorStop(0.6,'white'); grad.addColorStop(1,'rgba(255,255,255,0)');
  ctx.globalCompositeOperation='source-over';
  // clip suave
  ctx.beginPath(); ctx.arc(cx,cy,r+f,0,Math.PI*2); ctx.clip();
  ctx.drawImage(sharpCanvas,0,0);
  // aplicar mascara suave para desvanecer borde
  ctx.globalCompositeOperation='destination-in';
  ctx.fillStyle=grad; ctx.fillRect(cx-r-f,cy-r-f,(r+f)*2,(r+f)*2);
  ctx.restore();

  requestAnimationFrame(loop);
}
document.querySelectorAll('#colorBar.btn').forEach(b=>{b.onclick=()=>{document.querySelectorAll('#colorBar.btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');color=b.dataset.c;}});
document.getElementById('flip').onclick=()=>{curIdx=(curIdx+1)%devices.length; start(devices[curIdx].deviceId,curIdx);};
canvas.addEventListener('click', async e=>{ const r=canvas.getBoundingClientRect(); focus={x:(e.clientX-r.left)/r.width, y:(e.clientY-r.top)/r.height, active:true}; try{await track.applyConstraints({advanced:[{focusMode:'continuous', pointsOfInterest:[{x:focus.x,y:focus.y}]}]});}catch{} });
canvas.addEventListener('dblclick', ()=>focus.active=false);
document.getElementById('shutter').onclick=()=>{ canvas.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`pro-${Date.now()}.jpg`;a.click();},'image/jpeg',0.95); };
init();
</script>
</body>
</html>
