<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Cam Pasteles 12MP - 4 Lentes + MAX/HD</title>
<style>
body{margin:0;background:#000;overflow:hidden;font-family:sans-serif;color:#fff}
#v{width:100vw;height:100vh;object-fit:cover;background:#111;position:absolute;top:0;left:0;z-index:1}
#start{position:fixed;inset:0;background:#000;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:15px;padding:20px;text-align:center}
#start button{padding:18px 25px;background:#ff7800;color:#fff;border:none;border-radius:30px;font-size:18px;font-weight:bold;width:90%;cursor:pointer}
#shutter{position:fixed;inset:0;background:#fff;z-index:50;display:none}
#msg{position:fixed;top:8px;left:50%;transform:translateX(-50%);background:#000c;padding:7px 12px;border-radius:20px;z-index:10;font-size:11px;width:92%;text-align:center}
#ctrl{position:fixed;bottom:0;left:0;right:0;background:#000e;padding:8px;z-index:10;display:flex;flex-direction:column;gap:6px}
#row{display:flex;gap:4px}
#row button{background:#222;color:#fff;border:1px solid #555;padding:9px;border-radius:10px;font-weight:bold;flex:1;font-size:11px}
#mainBtns{display:flex;gap:6px}
#mainBtns button{flex:1;padding:14px;border:none;border-radius:25px;font-weight:bold;font-size:14px}
#btnFoto{background:#fff;color:#000}
#btnBlanco{background:#ff7800;color:#fff}
#panel{position:fixed;inset:0;background:#111;z-index:30;display:none;flex-direction:column;padding:12px;overflow:auto}
#panel select,#panel input{width:100%;padding:10px;border-radius:8px;border:none;margin:4px 0;background:#222;color:#fff}
#res{position:fixed;inset:0;background:#000;z-index:20;display:none;flex-direction:column}
#res img{flex:1;width:100%;object-fit:contain;background:#111}
</style>
</head>
<body>
<div id="start">
<h2 style="margin:0">🍰 Cam Pasteles 12MP</h2>
<p style="font-size:12px;color:#0f0" id="status">4 Lentes + MAX 15MB / HD 4MB</p>
<button id="btnPrender" onclick="iniciarReal()">📷 PRENDER CÁMARA</button>
<p id="err" style="font-size:12px;color:#ff5555;word-break:break-all"></p>
</div>
<div id="shutter"></div>
<video id="v" autoplay playsinline muted></video>
<div id="msg">Esperando...</div>
<div id="ctrl">
<div id="row">
<button onclick="abrirPanel()">⚙️ <span id="labelModo">MAX</span></button>
<button onclick="cambiarLente()">↻ Lente <span id="lenteNum"></span></button>
</div>
<div id="mainBtns">
<button id="btnFoto" onclick="tomarPro(false)">📸 Tomar</button>
<button id="btnBlanco" onclick="tomarPro(true)">⬜ Fondo Blanco</button>
</div>
</div>
<div id="panel">
<h3 style="margin:0 0 8px 0">⚙️ Ajustes</h3>
<label style="color:#ff7800;font-weight:bold">Modo guardado:</label>
<select id="modoCalidad">
<option value="max" selected>🖨️ MAX 15MB - Impresión 100%</option>
<option value="hd">📱 HD 4MB - WhatsApp 82%</option>
<option value="lite">⚡ LITE 1.5MB - Rápido</option>
</select>
<p style="font-size:11px;color:#aaa">MAX deja la foto en 3840x5120 al 100%, HD misma resolución pero 4MB, LITE 1920x2560</p>
<hr style="border-color:#333">
<label>Marca de agua:</label>
<input id="wmText" value="Pasteles Jimbo">
<label style="font-size:12px"><input type="checkbox" id="wmOn" checked> Activar marca</label>
<button onclick="guardar()" style="width:100%;padding:12px;background:#ff7800;border:none;border-radius:10px;font-weight:bold;margin-top:12px">Guardar y volver</button>
<button onclick="cerrarPanel()" style="width:100%;padding:10px;background:#333;border:none;border-radius:10px;margin-top:6px;color:#fff">Cerrar</button>
</div>
<div id="res"><img id="outImg"><div style="display:flex;gap:6px;padding:10px"><a id="down" download style="flex:1;padding:12px;background:#fff;color:#000;border-radius:10px;text-align:center;text-decoration:none;font-weight:bold">Guardar HD</a><button onclick="document.getElementById('res').style.display='none'" style="flex:1;padding:12px;background:#333;color:#fff;border:none;border-radius:10px">Cerrar</button></div><div id="infoCal" style="padding:8px;font-size:12px;color:#0f0;text-align:center"></div></div>

<script>
let v=document.getElementById('v'), stream, track, facing='environment', gpsText='Jacona', wm={text:'Pasteles Jimbo', on:true}, devices=[], idx=0;

async function iniciarReal(){
  document.getElementById('err').innerText='Pidiendo permiso...';
  try{
    if(stream) stream.getTracks().forEach(t=>t.stop());

    if(devices.length>0 && devices[idx]){
      // usar el lente ya seleccionado por ID
      stream = await navigator.mediaDevices.getUserMedia({video:{deviceId:{exact:devices[idx].deviceId}}, audio:false});
    }else{
      // primera vez: pide cámara simple para que siempre prenda
      stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:facing}, audio:false});
    }
    v.srcObject=stream; await v.play(); track=stream.getVideoTracks()[0];

    try{
      let all=await navigator.mediaDevices.enumerateDevices();
      devices=all.filter(d=>d.kind==='videoinput');
      if(devices.length>0){
        let curId=track.getSettings().deviceId;
        let f=devices.findIndex(d=>d.deviceId===curId);
        if(f>=0) idx=f;
        document.getElementById('lenteNum').innerText=(idx+1)+'/'+devices.length;
      }
    }catch{}

    document.getElementById('start').style.display='none';
    let st=track.getSettings();
    document.getElementById('msg').innerText='Lente '+(idx+1)+'/'+(devices.length||1)+' - '+st.width+'x'+st.height+' - '+(track.label||'Listo');
    document.getElementById('err').innerText='';
  }catch(e){
    document.getElementById('err').innerText='ERROR: '+e.name+' - '+e.message+' - Da permiso a cámara';
    console.error(e);
  }
}

async function cambiarLente(){
  try{
    if(devices.length===0){
      let all=await navigator.mediaDevices.enumerateDevices();
      devices=all.filter(d=>d.kind==='videoinput');
    }
    if(devices.length>0){
      idx=(idx+1)%devices.length;
      if(stream) stream.getTracks().forEach(t=>t.stop());
      stream=await navigator.mediaDevices.getUserMedia({video:{deviceId:{exact:devices[idx].deviceId}}, audio:false});
      v.srcObject=stream; await v.play(); track=stream.getVideoTracks()[0];
      document.getElementById('lenteNum').innerText=(idx+1)+'/'+devices.length;
      document.getElementById('msg').innerText='Lente '+(idx+1)+'/'+devices.length+' - '+track.label;
    }else{
      facing=facing==='environment'?'user':'environment';
      await iniciarReal();
    }
  }catch(e){
    document.getElementById('msg').innerText='Error cambiando: '+e.message;
    idx=(idx+1)%Math.max(devices.length,2);
    try{ await iniciarReal(); }catch{}
  }
}

function abrirPanel(){ document.getElementById('panel').style.display='flex'; }
function cerrarPanel(){ document.getElementById('panel').style.display='none'; }
function guardar(){
  wm.text=document.getElementById('wmText').value;
  wm.on=document.getElementById('wmOn').checked;
  localStorage.setItem('wm',JSON.stringify(wm));
  localStorage.setItem('modoCalidad',document.getElementById('modoCalidad').value);
  document.getElementById('labelModo').innerText=document.getElementById('modoCalidad').value.toUpperCase();
  cerrarPanel();
}

async function tomarPro(esBlanco){
  let s=document.getElementById('shutter'); s.style.display='block'; setTimeout(()=>s.style.display='none',80);
  let blobFoto=null;
  try{ if(track && window.ImageCapture){ let cap=new ImageCapture(track); blobFoto=await cap.takePhoto(); } }catch(e){}

  let c, ctx;
  if(blobFoto){
    let img=await createImageBitmap(blobFoto);
    c=document.createElement('canvas'); c.width=img.width; c.height=img.height; ctx=c.getContext('2d'); ctx.drawImage(img,0,0);
  }else{
    c=document.createElement('canvas'); c.width=v.videoWidth||1920; c.height=v.videoHeight||1080; ctx=c.getContext('2d'); ctx.drawImage(v,0,0,c.width,c.height);
  }

  let sv=localStorage.getItem('wm'); if(sv) try{ wm=JSON.parse(sv);}catch{}
  if(wm.on){
    ctx.font='bold '+(c.width*0.035)+'px sans-serif'; ctx.fillStyle='#fff'; ctx.shadowColor='#000'; ctx.shadowBlur=8; ctx.textAlign='right';
    ctx.fillText((wm.text||'Pasteles Jimbo')+' • '+new Date().toLocaleDateString(), c.width*0.96, c.height*0.96);
  }
  if(esBlanco){
    let c2=document.createElement('canvas'); c2.width=c.width; c2.height=c.height; let x=c2.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c2.width,c2.height); x.drawImage(c,0,0); c=c2;
  }

  let modo=document.getElementById('modoCalidad').value;
  let url;
  if(modo==='max'){ url=c.toDataURL('image/jpeg',1.0); }
  else if(modo==='hd'){ url=c.toDataURL('image/jpeg',0.82); }
  else { let c2=document.createElement('canvas'); c2.width=c.width*0.5; c2.height=c.height*0.5; c2.getContext('2d').drawImage(c,0,0,c2.width,c2.height); url=c2.toDataURL('image/jpeg',0.8); c=c2; }

  let sizeKB=Math.round(url.length*0.75/1024);
  document.getElementById('outImg').src=url;
  document.getElementById('down').href=url;
  document.getElementById('down').download='Pastel_'+modo.toUpperCase()+'_'+c.width+'x'+c.height+'.jpg';
  document.getElementById('infoCal').innerText=modo.toUpperCase()+' - '+c.width+'x'+c.height+' - '+(sizeKB/1024).toFixed(2)+'MB - Lente '+(idx+1);
  document.getElementById('res').style.display='flex';
}

let mc=localStorage.getItem('modoCalidad'); if(mc){ document.getElementById('modoCalidad').value=mc; document.getElementById('labelModo').innerText=mc.toUpperCase(); }
let sv=localStorage.getItem('wm'); if(sv) try{ wm=JSON.parse(sv); document.getElementById('wmText').value=wm.text; }catch{}
</script>
</body>
</html>
