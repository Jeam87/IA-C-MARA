<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Cam Pasteles PRO REAL IA</title>
<script src="https://cdn.jsdelivr.net/npm/@upscalerjs/upscaler@1.14.0/dist/browser/umd/upscaler.min.js"></script>
<style>
body{margin:0;background:#000;color:#fff;font-family:sans-serif;overflow:hidden}
#v{width:100vw;height:100vh;object-fit:cover;background:#111}
#msg{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#000d;padding:8px 14px;border-radius:20px;z-index:10;font-size:13px;text-align:center;max-width:90%}
#focus{position:fixed;width:80px;height:80px;border:2px solid #ff0;border-radius:50%;display:none;pointer-events:none;transform:translate(-50%,-50%)}
#ctrl{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(transparent,#000f);padding:10px;z-index:10;display:flex;flex-direction:column;gap:8px}
#row{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
#row button{background:#222;color:#fff;border:1px solid #444;padding:9px 12px;border-radius:10px;font-size:12px}
#row button.active{background:#ff7800;color:#000;font-weight:bold}
#shutterRow{display:flex;align-items:center;justify-content:center;gap:24px}
#btnVideo{width:56px;height:56px;border-radius:50%;background:#222;border:3px solid #fff;font-size:22px;color:#fff}
#foto{width:86px;height:86px;border-radius:50%;background:#fff;border:5px solid #ff7800;color:#000;font-size:32px}
#timer{text-align:center;color:#ff2a2a;font-weight:bold;display:none;font-size:18px}
#iaBar{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#000e;padding:20px;border-radius:15px;z-index:30;display:none;text-align:center;border:2px solid #ff7800}
#config{position:fixed;top:60px;right:10px;background:#000e;padding:12px;border-radius:12px;display:none;z-index:15;border:1px solid #333}
#config input{width:150px;margin:4px 0;padding:8px;border-radius:6px;border:none;display:block}
#res{position:fixed;inset:0;background:#000;z-index:20;display:none;flex-direction:column}
#res img,#res video{flex:1;width:100%;object-fit:contain;background:#000}
</style>
</head>
<body>
<video id="v" autoplay playsinline muted></video>
<div id="focus"></div>
<div id="msg">IA REAL lista - Foto pasa de 1.4MB a 6MB</div>
<div id="iaBar"><div style="font-size:40px">🤖</div><div id="iaText">IA REAL-ESRGAN x2<br>0%</div><div style="width:200px;height:6px;background:#333;border-radius:10px;margin:10px auto"><div id="iaProg" style="width:0%;height:100%;background:#ff7800;border-radius:10px"></div></div></div>

<div id="ctrl">
  <div id="row">
    <button id="bLejos" onclick="setModo('lejos')">Lejos</button>
    <button id="bMacro" class="active" onclick="setModo('macro')">📸 Macro</button>
    <button id="bPastel" onclick="setModo('pastel')">🎂 Pastel</button>
    <button onclick="cambiarLente()">↻ Cámara</button>
    <button onclick="toggleConfig()">⚙️ Texto</button>
  </div>
  <div id="shutterRow">
    <button id="btnVideo" onclick="toggleVideo()">🎥</button>
    <button id="foto" onclick="tomarRealIA()">📸</button>
    <div style="width:56px"></div>
  </div>
  <div id="timer">● 00:00</div>
</div>

<div id="config">
  <input id="inpNombre" placeholder="Nombre pastel">
  <input id="inpPrecio" placeholder="Precio $">
  <input id="inpUbi" placeholder="Ubicación">
  <label style="font-size:12px"><input type="checkbox" id="chkIA" checked> IA REAL x2 ON (6MB)</label>
  <button onclick="toggleConfig()" style="width:100%;margin-top:6px;background:#ff7800;border:none;padding:8px;border-radius:6px;font-weight:bold">Listo</button>
</div>

<div id="res">
  <img id="outImg" style="display:none">
  <video id="outVid" style="display:none" controls playsinline></video>
  <div style="display:flex;gap:10px;padding:12px">
    <a id="down" download="pastel-REAL-IA.jpg" style="flex:1;padding:14px;background:#fff;color:#000;border-radius:10px;text-align:center;text-decoration:none;font-weight:bold">Guardar REAL</a>
    <button onclick="cerrarRes()" style="flex:1;padding:14px;background:#333;color:#fff;border:none;border-radius:10px">Cerrar</button>
  </div>
</div>

<script>
let v=document.getElementById('v'), stream, track, imageCapture, devices=[], idx=0, modo='macro', grabando=false, recorder, timerInt, seg=0;
let upscaler = new Upscaler({ model: 'esrgan-medium' }); // REAL ESRGAN

async function iniciar(deviceId=null){
  if(stream) stream.getTracks().forEach(t=>t.stop());
  let cons={video:{width:{ideal:3840},height:{ideal:2160},facingMode:deviceId?undefined:'environment'}, audio:{echoCancellation:false, noiseSuppression:false}};
  if(deviceId) cons.video.deviceId={exact:deviceId};
  stream=await navigator.mediaDevices.getUserMedia(cons);
  v.srcObject=stream; v.muted=true; await v.play();
  track=stream.getVideoTracks()[0];
  if('ImageCapture' in window) imageCapture=new ImageCapture(track);
  document.getElementById('msg').innerText='IA REAL-ESRGAN lista ✓ Foto 2448→4896 (6MB)';
  listar();
}
async function listar(){ try{ let all=await navigator.mediaDevices.enumerateDevices(); devices=all.filter(d=>d.kind=='videoinput'); }catch{} }
iniciar();
function cambiarLente(){ if(devices.length<=1) return alert('Solo 1 cámara'); idx=(idx+1)%devices.length; iniciar(devices[idx].deviceId); }
function setModo(m){ modo=m; document.querySelectorAll('#row button').forEach(b=>b.classList.remove('active')); let el=document.getElementById('b'+m.charAt(0).toUpperCase()+m.slice(1)); if(el) el.classList.add('active'); }
function toggleConfig(){ let c=document.getElementById('config'); c.style.display=c.style.display=='none'?'block':'none'; }
v.addEventListener('click', async(e)=>{
  let f=document.getElementById('focus'); f.style.left=e.clientX+'px'; f.style.top=e.clientY+'px'; f.style.display='block'; setTimeout(()=>f.style.display='none',1000);
  try{ await track.applyConstraints({advanced:[{pointsOfInterest:[{x:e.clientX/innerWidth,y:e.clientY/innerHeight}],focusMode:'manual'}]}); setTimeout(()=>track.applyConstraints({advanced:[{focusMode:'continuous'}]}),1000); }catch{}
});

async function tomarRealIA(){
  let msg=document.getElementById('msg'), bar=document.getElementById('iaBar'), txt=document.getElementById('iaText'), prog=document.getElementById('iaProg');
  let usarIA=document.getElementById('chkIA').checked;
  msg.innerText='Tomando 12MP real...';
  try{
    let blob; if(imageCapture?.takePhoto) blob=await imageCapture.takePhoto(); else { let c=document.createElement('canvas'); c.width=v.videoWidth; c.height=v.videoHeight; c.getContext('2d').drawImage(v,0,0); blob=await new Promise(r=>c.toBlob(r,'image/jpeg',0.97)); }
    let bitmap=await createImageBitmap(blob);
    let canvas=document.createElement('canvas'); canvas.width=bitmap.width; canvas.height=bitmap.height;
    let ctx=canvas.getContext('2d'); ctx.drawImage(bitmap,0,0);

    let finalCanvas=canvas;
    if(usarIA){
      bar.style.display='block'; txt.innerHTML='IA REAL-ESRGAN x2<br>Ampliando 2448→4896...'; prog.style.width='30%';
      try{
        let upscaled = await upscaler.upscale(canvas, { patchSize:64, padding:2, progress:(p)=>{ prog.style.width=(30+p*60)+'%'; txt.innerHTML='IA REAL '+Math.round(p*100)+'%'; } });
        finalCanvas=document.createElement('canvas'); finalCanvas.width=upscaled.width; finalCanvas.height=upscaled.height;
        finalCanvas.getContext('2d').drawImage(upscaled,0,0);
        prog.style.width='100%'; txt.innerHTML='IA REAL 100% ✓';
      }catch(e){
        console.log('IA fallo, usando HD normal',e);
        txt.innerHTML='IA sin internet, usando HD pro';
        finalCanvas=canvas;
      }
      setTimeout(()=>bar.style.display='none',800);
    }

    // Texto precio
    let nombre=document.getElementById('inpNombre').value, precio=document.getElementById('inpPrecio').value, ubi=document.getElementById('inpUbi').value;
    if(nombre||precio||ubi){
      let c2=finalCanvas.getContext('2d');
      c2.fillStyle='#0009'; c2.fillRect(0,finalCanvas.height-160,finalCanvas.width,160);
      c2.fillStyle='#fff'; c2.font='bold '+(finalCanvas.width*0.04)+'px sans-serif';
      if(nombre) c2.fillText(nombre,40,finalCanvas.height-90);
      if(precio){ c2.fillStyle='#ff7800'; c2.fillText(precio,40,finalCanvas.height-30); }
      if(ubi){ c2.fillStyle='#fff'; c2.font=(finalCanvas.width*0.02)+'px sans-serif'; let w=c2.measureText(ubi).width; c2.fillText(ubi,finalCanvas.width-w-40,finalCanvas.height-30); }
    }

    let url=finalCanvas.toDataURL('image/jpeg',0.92);
    document.getElementById('outVid').style.display='none';
    let im=document.getElementById('outImg'); im.style.display='block'; im.src=url;
    let d=document.getElementById('down'); d.href=url; d.download='pastel-REAL-IA-'+finalCanvas.width+'x'+finalCanvas.height+'.jpg';
    document.getElementById('res').style.display='flex';
    let kb=Math.round((url.length*0.75)/1024);
    msg.innerText='REAL IA '+finalCanvas.width+'x'+finalCanvas.height+' - '+(kb/1024).toFixed(2)+'MB ✓ Supera P30 Pro';
  }catch(e){ msg.innerText='Error: '+e.message; document.getElementById('iaBar').style.display='none'; }
}

function toggleVideo(){
  let btn=document.getElementById('btnVideo'), fotoBtn=document.getElementById('foto'), t=document.getElementById('timer');
  if(!grabando){
    track.applyConstraints({width:{ideal:1920},height:{ideal:1080}}).catch(()=>{});
    let chunks=[], mime='video/webm;codecs=vp9,opus'; if(!MediaRecorder.isTypeSupported(mime)) mime='video/webm';
    recorder=new MediaRecorder(stream,{mimeType:mime, videoBitsPerSecond:6000000, audioBitsPerSecond:128000});
    recorder.ondataavailable=e=>{ if(e.data.size>0) chunks.push(e.data); };
    recorder.onstop=()=>{
      let b=new Blob(chunks,{type:mime}); let url=URL.createObjectURL(b);
      document.getElementById('outImg').style.display='none';
      let vv=document.getElementById('outVid'); vv.style.display='block'; vv.src=url; vv.muted=false; vv.autoplay=true; vv.play().catch(()=>{});
      let d=document.getElementById('down'); d.href=url; d.download='pastel-video-'+Date.now()+'.webm';
      document.getElementById('res').style.display='flex';
      track.applyConstraints({width:{ideal:3840},height:{ideal:2160}}).catch(()=>{});
    };
    recorder.start(100); grabando=true; seg=0;
    t.style.display='block'; fotoBtn.style.opacity='0.3'; fotoBtn.style.pointerEvents='none'; btn.style.background='#f00'; btn.innerText='■';
    timerInt=setInterval(()=>{ seg++; let m=String(Math.floor(seg/60)).padStart(2,'0'); let s=String(seg%60).padStart(2,'0'); t.innerText='● '+m+':'+s+' REC'; },1000);
  } else {
    recorder.stop(); grabando=false; clearInterval(timerInt);
    t.style.display='none'; document.getElementById('foto').style.opacity='1'; document.getElementById('foto').style.pointerEvents='auto';
    btn.style.background='#222'; btn.innerText='🎥';
  }
}
function cerrarRes(){ document.getElementById('res').style.display='none'; let vv=document.getElementById('outVid'); vv.pause(); vv.src=''; }
</script>
</body>
</html>
