<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cam Pasteles P30 FIX</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:sans-serif;overflow:hidden}
#v{width:100vw;height:100vh;object-fit:cover;background:#111;display:block}
#msg{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#000d;padding:8px 14px;border-radius:20px;z-index:10;font-size:12px;text-align:center;max-width:85%}
#ctrl{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(transparent,#000f);padding:10px;z-index:10}
#row{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
#row button{background:#222;color:#fff;border:1px solid #444;padding:8px 11px;border-radius:10px;font-size:12px}
#row button.active{background:#ff7800;color:#000;font-weight:bold}
#shutterRow{display:flex;align-items:center;justify-content:center;gap:22px;margin-top:8px}
#btnVideo{width:54px;height:54px;border-radius:50%;background:#222;border:3px solid #fff;color:#fff}
#foto{width:84px;height:84px;border-radius:50%;background:#fff;border:5px solid #ff7800;font-size:30px}
#timer{text-align:center;color:#ff2a2a;display:none;font-weight:bold}
#config{position:fixed;top:60px;right:10px;background:#000e;padding:12px;border-radius:12px;display:none;z-index:15;border:1px solid #333}
#config input{display:block;width:150px;margin:4px 0;padding:8px;border-radius:6px;border:none}
#res{position:fixed;inset:0;background:#000;z-index:20;display:none;flex-direction:column}
#res img,#res video{flex:1;width:100%;object-fit:contain}
#iaBar{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#000f;padding:18px;border-radius:14px;z-index:30;display:none;text-align:center;border:2px solid #ff7800}
</style>
</head>
<body>
<video id="v" autoplay playsinline muted></video>
<div id="msg">Iniciando cámara P30...</div>
<div id="iaBar"><div>🤖 IA REAL</div><div id="iaText">0%</div><div style="width:180px;height:6px;background:#333;border-radius:10px;margin:8px auto"><div id="iaProg" style="width:0%;height:100%;background:#ff7800"></div></div></div>

<div id="ctrl">
  <div id="row">
    <button id="bLejos" onclick="setModo('lejos')">Lejos</button>
    <button id="bMacro" class="active" onclick="setModo('macro')">📸 Macro</button>
    <button id="bPastel" onclick="setModo('pastel')">🎂 Pastel</button>
    <button onclick="cambiarLente()">↻ Cámara (<span id="camCount">1</span>)</button>
    <button onclick="toggleConfig()">⚙️ Texto</button>
  </div>
  <div id="shutterRow">
    <button id="btnVideo" onclick="toggleVideo()">🎥</button>
    <button id="foto" onclick="tomarRealIA()">📸</button>
    <div style="width:54px"></div>
  </div>
  <div id="timer">● 00:00</div>
</div>

<div id="config">
  <input id="inpNombre" placeholder="Nombre pastel">
  <input id="inpPrecio" placeholder="Precio $">
  <input id="inpUbi" placeholder="Ubicación">
  <label style="font-size:12px"><input type="checkbox" id="chkIA" checked> IA REAL x2 (5-7MB)</label>
  <button onclick="toggleConfig()" style="width:100%;margin-top:6px;background:#ff7800;border:none;padding:8px;border-radius:6px;font-weight:bold">Listo</button>
</div>

<div id="res">
  <img id="outImg" style="display:none">
  <video id="outVid" style="display:none" controls playsinline></video>
  <div style="display:flex;gap:10px;padding:12px">
    <a id="down" download style="flex:1;padding:14px;background:#fff;color:#000;border-radius:10px;text-align:center;text-decoration:none;font-weight:bold">Guardar</a>
    <button onclick="cerrarRes()" style="flex:1;padding:14px;background:#333;color:#fff;border:none;border-radius:10px">Cerrar</button>
  </div>
</div>

<script>
let v=document.getElementById('v'), stream, track, imageCapture, devices=[], idx=0, modo='macro';
let grabando=false, recorder, timerInt, seg=0;
let msg=document.getElementById('msg');
let upscaler=null;
try{ upscaler=new Upscaler({model:'esrgan-medium'}); }catch(e){}

// INICIO SEGURO P30 PRO - primero 720p, luego HD
async function iniciar(deviceId=null){
  if(stream) stream.getTracks().forEach(t=>t.stop());
  try{
    let cons={ video:{facingMode:'environment', width:{ideal:1280}, height:{ideal:720}}, audio:true };
    if(deviceId) cons.video={deviceId:{exact:deviceId}, width:{ideal:1920}};
    stream=await navigator.mediaDevices.getUserMedia(cons);
    v.srcObject=stream; v.muted=true; await v.play();
    track=stream.getVideoTracks()[0];
    if(window.ImageCapture) try{ imageCapture=new ImageCapture(track); }catch{}
    msg.innerText='P30 listo ✓ Toca pantalla para enfocar';
    // Listar sin molestar
    try{
      let all=await navigator.mediaDevices.enumerateDevices();
      devices=all.filter(d=>d.kind=='videoinput');
      document.getElementById('camCount').innerText=devices.length;
      if(devices.length==0) devices=[{deviceId:track.getSettings().deviceId}];
    }catch{}
  }catch(e){
    msg.innerText='Error: '+e.message+' - Prueba con HTTPS';
    console.error(e);
  }
}
iniciar();

function cambiarLente(){
  if(devices.length<=1){ msg.innerText='P30 solo expone 1 cámara en navegador (normal)'; setTimeout(()=>msg.innerText='P30 listo ✓',2000); return; }
  idx=(idx+1)%devices.length; iniciar(devices[idx].deviceId);
}
function setModo(m){
  modo=m;
  document.querySelectorAll('#row button').forEach(b=>b.classList.remove('active'));
  let el=document.getElementById('b'+m.charAt(0).toUpperCase()+m.slice(1)); if(el) el.classList.add('active');
}
function toggleConfig(){ let c=document.getElementById('config'); c.style.display=c.style.display=='none'?'block':'none'; }

v.addEventListener('click', async(e)=>{
  try{
    await track.applyConstraints({advanced:[{focusMode:'manual', pointsOfInterest:[{x:e.clientX/window.innerWidth, y:e.clientY/window.innerHeight}]}]});
    msg.innerText='Enfocado ✓';
    setTimeout(()=>track.applyConstraints({advanced:[{focusMode:'continuous'}]}),1000);
  }catch{ msg.innerText='Toque enfoque no soportado en este lente'; }
});

async function tomarRealIA(){
  msg.innerText='Tomando foto HD...';
  let bar=document.getElementById('iaBar'), txt=document.getElementById('iaText'), prog=document.getElementById('iaProg');
  try{
    let blob;
    if(imageCapture?.takePhoto){
      // Foto real 12MP del sensor aunque el preview sea 720p
      blob=await imageCapture.takePhoto();
    } else {
      let c=document.createElement('canvas'); c.width=v.videoWidth; c.height=v.videoHeight;
      c.getContext('2d').drawImage(v,0,0);
      blob=await new Promise(r=>c.toBlob(r,'image/jpeg',0.97));
    }
    let bmp=await createImageBitmap(blob);
    let canvas=document.createElement('canvas'); canvas.width=bmp.width; canvas.height=bmp.height;
    canvas.getContext('2d').drawImage(bmp,0,0);
    let finalCanvas=canvas;
    if(document.getElementById('chkIA').checked && upscaler){
      bar.style.display='block'; prog.style.width='20%'; txt.innerText='IA REAL 20%';
      try{
        let up=await upscaler.upscale(canvas,{patchSize:64, padding:2, progress:(p)=>{ prog.style.width=(20+p*70)+'%'; txt.innerText='IA REAL '+Math.round(p*100)+'%'; }});
        finalCanvas=document.createElement('canvas'); finalCanvas.width=up.width; finalCanvas.height=up.height;
        finalCanvas.getContext('2d').drawImage(up,0,0);
      }catch(e){ console.log('IA error',e); }
      bar.style.display='none';
    }
    // Texto
    let n=document.getElementById('inpNombre').value, pr=document.getElementById('inpPrecio').value, ub=document.getElementById('inpUbi').value;
    if(n||pr||ub){
      let ctx=finalCanvas.getContext('2d'); ctx.fillStyle='#0009'; ctx.fillRect(0,finalCanvas.height-150,finalCanvas.width,150);
      ctx.fillStyle='#fff'; ctx.font='bold '+(finalCanvas.width*0.04)+'px sans-serif';
      if(n) ctx.fillText(n,30,finalCanvas.height-80);
      if(pr){ ctx.fillStyle='#ff7800'; ctx.fillText(pr,30,finalCanvas.height-25); }
    }
    let url=finalCanvas.toDataURL('image/jpeg',0.92);
    document.getElementById('outVid').style.display='none';
    let im=document.getElementById('outImg'); im.style.display='block'; im.src=url;
    document.getElementById('down').href=url; document.getElementById('down').download='pastel-REAL-'+finalCanvas.width+'x'+finalCanvas.height+'.jpg';
    document.getElementById('res').style.display='flex';
    let mb=((url.length*0.75)/1024/1024).toFixed(2);
    msg.innerText='REAL '+finalCanvas.width+'x'+finalCanvas.height+' - '+mb+'MB ✓';
  }catch(e){ msg.innerText='Error foto: '+e.message; bar.style.display='none'; }
}

function toggleVideo(){
  let btn=document.getElementById('btnVideo'), fotoBtn=document.getElementById('foto'), t=document.getElementById('timer');
  if(!grabando){
    let chunks=[]; let mime='video/webm;codecs=vp8,opus'; if(MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus')) mime='video/webm;codecs=vp9,opus';
    recorder=new MediaRecorder(stream,{mimeType:mime});
    recorder.ondataavailable=e=>{ if(e.data.size>0) chunks.push(e.data); };
    recorder.onstop=()=>{
      let b=new Blob(chunks,{type:mime}); let url=URL.createObjectURL(b);
      document.getElementById('outImg').style.display='none';
      let vv=document.getElementById('outVid'); vv.style.display='block'; vv.src=url; vv.muted=false; vv.autoplay=true; vv.play().catch(()=>{});
      let d=document.getElementById('down'); d.href=url; d.download='video-'+Date.now()+'.webm';
      document.getElementById('res').style.display='flex';
    };
    recorder.start(100); grabando=true; seg=0;
    t.style.display='block'; fotoBtn.style.opacity='0.3'; fotoBtn.style.pointerEvents='none'; btn.style.background='#f00'; btn.innerText='■';
    timerInt=setInterval(()=>{ seg++; let m=String(Math.floor(seg/60)).padStart(2,'0'); let s=String(seg%60).padStart(2,'0'); t.innerText='● '+m+':'+s+' REC'; },1000);
  } else {
    recorder.stop(); grabando=false; clearInterval(timerInt);
    t.style.display='none'; document.getElementById('foto').style.opacity='1'; document.getElementById('foto').style.pointerEvents='auto'; btn.style.background='#222'; btn.innerText='🎥';
  }
}
function cerrarRes(){ document.getElementById('res').style.display='none'; let vv=document.getElementById('outVid'); vv.pause(); vv.src=''; }
</script>
<script src="https://cdn.jsdelivr.net/npm/@upscalerjs/upscaler@1.14.0/dist/browser/umd/upscaler.min.js" onerror="console.log('sin IA offline')"></script>
</body>
</html>
