<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Camara Pro - Multi Lente</title>
<style>
 body{margin:0;background:#000;overflow:hidden;font-family:sans-serif}
 #cam{display:none} #out{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}
 #focusBox{display:none;position:fixed;width:70px;height:70px;border:2px solid #ff0;border-radius:10px;z-index:20}
 #ui{position:fixed;bottom:0;left:0;right:0;padding:12px;background:linear-gradient(transparent,#000d);z-index:10}
 #lensBar{display:flex;gap:8px;justify-content:center;margin-bottom:8px;flex-wrap:wrap}
.lens{padding:6px 14px;border-radius:20px;background:#222;color:#fff;border:1px solid #555;font-size:12px}
.lens.active{background:#fff;color:#000}
 #controls{display:flex;align-items:center;justify-content:space-around}
 #shutter{width:78px;height:78px;border-radius:50%;background:#fff;border:4px solid #fff8}
 label{color:#fff;font-size:12px}
 input{width:100%}
</style>
</head>
<body>
<video id="cam" autoplay playsinline muted></video>
<canvas id="out"></canvas>
<div id="focusBox"></div>
<div id="ui">
  <div id="lensBar"></div>
  <label>Belleza <span id="bVal">50</span>% <input type="range" id="beauty" min="0" max="100" value="50"></label>
  <label>Zoom <span id="zVal">1x</span> <input type="range" id="zoom" min="1" max="10" step="0.1" value="1"></label>
  <div id="controls"><div style="width:50px"></div><button id="shutter"></button><button id="flip" style="width:48px;height:48px;border-radius:50%;background:#222;color:#fff;border:2px solid #fff">↻</button></div>
</div>
<script>
const video=document.getElementById('cam'), canvas=document.getElementById('out'), ctx=canvas.getContext('2d');
let stream, track, devices=[], currentId=null, facing='user';

async function getCameras(){
  await navigator.mediaDevices.getUserMedia({video:true}); // pedir permiso primero
  const devs = await navigator.mediaDevices.enumerateDevices();
  devices = devs.filter(d=>d.kind==='videoinput');
  const bar = document.getElementById('lensBar'); bar.innerHTML='';
  devices.forEach((d,i)=>{
    const b=document.createElement('button'); b.className='lens';
    let name = d.label || `Cámara ${i+1}`;
    if(name.toLowerCase().includes('ultra') || name.toLowerCase().includes('wide') && i==0) name='0.5x ULTRA';
    else if(i==1) name='1x PRINCIPAL'; else if(name.toLowerCase().includes('tele')) name='3x TELE';
    else name=`LENTE ${i+1}`;
    b.textContent=name; b.onclick=()=>start(d.deviceId);
    bar.appendChild(b);
  });
}

async function start(deviceId=null){
  if(stream) stream.getTracks().forEach(t=>t.stop());
  const constraints = deviceId? {video:{deviceId:{exact:deviceId}}} : {video:{facingMode:facing}};
  stream = await navigator.mediaDevices.getUserMedia(constraints);
  video.srcObject=stream; track=stream.getVideoTracks()[0];
  currentId=deviceId || track.getSettings().deviceId;
  document.querySelectorAll('.lens').forEach(b=>b.classList.remove('active'));
  [...document.querySelectorAll('.lens')][devices.findIndex(d=>d.deviceId===currentId)]?.classList.add('active');
  const caps=track.getCapabilities(); if(caps.zoom){ zoom.min=caps.zoom.min; zoom.max=Math.min(caps.zoom.max,10); }
  await video.play(); canvas.width=video.videoWidth; canvas.height=video.videoHeight; requestAnimationFrame(draw);
}
function draw(){
  const lv=beauty.value/100;
  ctx.filter=`contrast(${1+lv*0.1}) saturate(${1+lv*0.3}) brightness(${1+lv*0.1})`;
  ctx.drawImage(video,0,0,canvas.width,canvas.height);
  requestAnimationFrame(draw);
}
beauty.oninput=e=>bVal.textContent=e.target.value;
zoom.oninput=async e=>{ zVal.textContent=e.target.value+'x'; if(track?.getCapabilities().zoom){ try{await track.applyConstraints({advanced:[{zoom:parseFloat(e.target.value)}]})}catch{}} };
flip.onclick=()=>{ facing=facing==='user'?'environment':'user'; start(); };
out.onclick=async e=>{
  const r=canvas.getBoundingClientRect(); const x=(e.clientX-r.left)/r.width, y=(e.clientY-r.top)/r.height;
  focusBox.style.left=e.clientX-35+'px'; focusBox.style.top=e.clientY-35+'px'; focusBox.style.display='block'; setTimeout(()=>focusBox.style.display='none',1000);
  try{ await track.applyConstraints({advanced:[{focusMode:'continuous', pointsOfInterest:[{x,y}]}]}); }catch{}
};
shutter.onclick=()=>{
  const c=document.createElement('canvas'); c.width=canvas.width; c.height=canvas.height; const f=c.getContext('2d');
  f.filter='contrast(1.3) saturate(1.45) brightness(1.1)'; f.drawImage(canvas,0,0);
  f.globalCompositeOperation='overlay'; f.globalAlpha=0.25; f.drawImage(canvas,0,0);
  const a=document.createElement('a'); a.download=`AI-PRO-${Date.now()}.jpg`; a.href=c.toDataURL('image/jpeg',0.95); a.click();
};
getCameras().then(()=>start());
</script>
</body>
</html>
