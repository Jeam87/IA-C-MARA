<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>App de Cámara con IA</title>
</head>
<body>
<h1>Tomar foto y mejorar con IA</h1>

<!-- Video para mostrar la cámara -->
<video id="video" width="400" height="300" autoplay></video>
<br>
<!-- Botón para tomar foto -->
<button id="btnCapturar">Tomar Foto</button>
<br><br>
<!-- Canvas para dibujar la foto -->
<canvas id="canvas" width="400" height="300" style="display:none;"></canvas>

<!-- Imagen original -->
<h2>Foto Tomada</h2>
<img id="fotoOriginal" src="" alt="Foto original" width="300" />

<!-- Imagen mejorada -->
<h2>Foto Mejorada</h2>
<img id="fotoMejorada" src="" alt="Foto mejorada" width="300" />

<script>
// Acceder a la cámara
const video = document.getElementById('video');
const btnCapturar = document.getElementById('btnCapturar');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const fotoOriginal = document.getElementById('fotoOriginal');
const fotoMejorada = document.getElementById('fotoMejorada');

// Pedir permisos y acceder a la cámara
navigator.mediaDevices.getUserMedia({ video: true })
.then(stream => {
    video.srcObject = stream;
})
.catch(err => {
    alert("No se pudo acceder a la cámara: " + err);
});

// Cuando se hace clic en "Tomar Foto"
btnCapturar.addEventListener('click', () => {
    // Dibujar la foto en el canvas
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    // Obtener la imagen en base64
    const dataURL = canvas.toDataURL('image/png');
    // Mostrar la foto original
    fotoOriginal.src = dataURL;
    // Aquí debes enviar la imagen a tu backend para procesarla
    // Por ahora, simulamos que la mejora es la misma imagen
    // En un escenario real, envías dataURL y recibes la imagen mejorada
    mejorarFoto(dataURL);
});

// Función para enviar la imagen al backend y recibir la mejorada
function mejorarFoto(dataURL) {
    // Aquí deberías hacer un fetch a tu backend
    // Ejemplo (comenta esto si no tienes backend):
    /*
    fetch('/procesar-imagen', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({ imagen: dataURL })
    })
    .then(res => res.json())
    .then(data => {
        // La respuesta debe ser la URL o base64 de la imagen mejorada
        fotoMejorada.src = data.imagen_mejorada;
    });
    */

    // Para este ejemplo, simplemente copiamos la misma imagen
    // (Quita o comenta esto cuando tengas backend)
    fotoMejorada.src = dataURL;
}
</script>
</body>
</html>
