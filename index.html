<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<title>Pro Focus</title>
<style>
 body{margin:0;background:#000;overflow:hidden;font-family:sans-serif}
 #out{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
 #topBar{position:fixed;top:0;left:0;right:0;z-index:99;padding:10px;background:linear-gradient(#000c,transparent)}
.bar{display:flex;gap:6px;overflow-x:auto;margin-top:8px}.bar::-webkit-scrollbar{display:none}
.btn{min-width:75px;height:36px;border-radius:18px;border:1px solid #fff4;background:#222;color:#fff;font-size:11px;font-weight:bold}
.btn.active{background:#fff;color:#000}
#focusBox{position:fixed;width:70px;height:70px;border:2px solid #ffeb00;border-radius:4px;z-index:100;pointer-events:none;display:none;justify-content:center;align-items:center}
#focusBox::after{content:'';width:6px;height:6px;background:#ffeb00;border-radius:50%;display:block}
#focusBox.focusing{animation: pulse 0.6s infinite}
@keyframes pulse{0%{transform:scale(1.3);opacity:0.6}100%{transform:scale(1);opacity:1}}
 #ui{position:fixed;bottom:0;left:0;right:0;z-index:99;display:flex;justify-content:space-around;padding:15px;background:linear-gradient(transparent,#000a)}
 #shutter{width:78px;height:78px;border-radius:50%;background:#fff;border:4px solid #fff8}
</style>
</head>
<body>
<video id="cam" autoplay playsinline muted style="display:none"></video>
<canvas id="out"></canvas>
<div id="focusBox"></div>
<div id="topBar">
  <div class="bar" id="colorBar"><button class="btn active" data-c="normal">NORMAL</button><button class="btn" data-c="sony">SONY</button><button class="btn" data-c="vivid">VIVID</button></div>
  <div class="bar" id="lensBar"></div>
</div>
<div id="ui"><div style="width:50px"></div><button id="shutter"></button><button id="flip" style="width:48px;height:48px;border-radius:50%;background:#222;color:#fff;border:1px solid #fff">↻</button></div>

<script>
const video=document.getElementById('cam'), canvas=document.getElementById('out'), ctx=canvas.getContext('2d'), focusBox=document.getElementById('focusBox');
let stream,track,devices=[],color='normal',curIdx=0;

async function init(){
  const tmp=await navigator.mediaDevices.getUserMedia({video:true}); tmp.getTracks().forEach(t=>t.stop());
  devices=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput');
  const bar=document.getElementById('lensBar'); bar.innerHTML='';
  devices.forEach((d,i)=>{ const b=document.createElement('button'); b.className='btn'+(i==0?' active':''); b.textContent=d.label.toLowerCase().includes('front')?'FRONTAL':`LENTE ${i+1}`; b.onclick=()=>start(d.deviceId,i); bar.appendChild(b); });
  start(devices[0]?.deviceId,0);
}
async function start(id,idx){
  if(stream) stream.getTracks().forEach(t=>t.stop());
  stream=await navigator.mediaDevices.getUserMedia({video:{deviceId:id?{exact:id}:undefined, width:{ideal:1920}, height:{ideal:1080}}});
  video.srcObject=stream; track=stream.getVideoTracks()[0];
  await video.play(); canvas.width=video.videoWidth; canvas.height=video.videoHeight;
  requestAnimationFrame(loop);
}
function getFilter(){ if(color==='sony') return 'contrast(1.1) saturate(1.05) brightness(1.08)'; if(color==='vivid') return 'contrast(1.18) saturate(1.35) brightness(1.08)'; return 'contrast(1.05) brightness(1.05)'; }
function loop(){ ctx.filter=getFilter(); ctx.drawImage(video,0,0,canvas.width,canvas.height); requestAnimationFrame(loop); }

document.querySelectorAll('#colorBar .btn').forEach(b=>{
  b.onclick=()=>{ document.querySelectorAll('#colorBar .btn').forEach(x=>x.classList.remove('active')); b.classList.add('active'); color=b.dataset.c; }
});
document.getElementById('flip').onclick=()=>{ curIdx=(curIdx+1)%devices.length; start(devices[curIdx].deviceId,curIdx); document.querySelectorAll('#lensBar .btn').forEach((x,i)=>x.classList.toggle('active',i==curIdx)); };

// TAP PARA ENFOCAR - SOLO CUADRITO
canvas.addEventListener('click', async (e)=>{
  const r=canvas.getBoundingClientRect();
  const x=(e.clientX-r.left)/r.width;
  const y=(e.clientY-r.top)/r.height;
  
  focusBox.style.left=(e.clientX-35)+'px';
  focusBox.style.top=(e.clientY-35)+'px';
  focusBox.style.display='flex';
  focusBox.classList.add('focusing');

  try{
    await track.applyConstraints({advanced:[{focusMode:'continuous', pointsOfInterest:[{x,y}]}]});
  }catch(err){ console.log('focus no soportado',err); }

  setTimeout(()=>{ focusBox.classList.remove('focusing'); focusBox.style.borderColor='#2fff00'; }, 600);
  setTimeout(()=>{ focusBox.style.display='none'; focusBox.style.borderColor='#ffeb00'; }, 2000);
});

document.getElementById('shutter').onclick=()=>{
  canvas.toBlob(b=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=`IMG-${Date.now()}.jpg`; a.click(); },'image/jpeg',0.98);
};
init();
</script>
</body>
</html>
