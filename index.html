<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Foto Pro IA TEST</title>
<style>body{margin:0;background:#000;color:#fff;font-family:system-ui;display:flex;flex-direction:column;height:100vh}#v{flex:1;width:100%;object-fit:cover;background:#111}button{padding:20px;margin:10px;border-radius:30px;border:none;font-weight:900;font-size:18px}#b1{background:#ff7800;color:#fff}#b2{background:#222;color:#fff;border:1px solid #555}</style>
</head>
<body>
<video id="v" autoplay playsinline muted></video>
<button id="b1">📷 PRENDER CAMARA TRASERA</button>
<button id="b2">🤳 PRENDER FRONTAL</button>
<p id="msg" style="text-align:center;font-size:12px;color:#ff0"></p>
<script>
let v=document.getElementById('v');
async function start(front){
 document.getElementById('msg').innerText='Pidiendo permiso...';
 try{
  let s=await navigator.mediaDevices.getUserMedia({video:{facingMode: front?'user':'environment'}, audio:false});
  v.srcObject=s; await v.play();
  document.getElementById('msg').innerText='¡JALANDO! Si ves esto, ya sirve. Ahora si sube el V4.3.1';
 }catch(e){
  document.getElementById('msg').innerText='ERROR: '+e.message+' - Dale al candado y permite camara';
  alert(e.message);
 }
}
document.getElementById('b1').addEventListener('click',()=>start(false));
document.getElementById('b2').addEventListener('click',()=>start(true));
</script>
</body>
</html>
