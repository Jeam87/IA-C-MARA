<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Cam Pasteles TOTAL</title>
<style>
body{margin:0;background:#000;overflow:hidden;font-family:sans-serif;color:#fff}
#v{width:100vw;height:100vh;object-fit:cover;background:#111;position:absolute;top:0;left:0;z-index:1}
#shutter{position:fixed;inset:0;background:#fff;z-index:50;display:none}
#shutter.flash{animation:flash.35s ease-out}
@keyframes flash{0%{opacity:0}20%{opacity:1}100%{opacity:0}}
#msg{position:fixed;top:8px;left:50%;transform:translateX(-50%);background:#000c;padding:7px 12px;border-radius:20px;z-index:10;font-size:11px;width:90%;text-align:center}
#focus{position:fixed;width:85px;height:85px;border:2px solid #ff0;border-radius:50%;display:none;pointer-events:none;transform:translate(-50%,-50%);z-index:12;box-shadow:0 0 10px #ff0a}
#focus::after{content:'';position:absolute;inset:18px;border:1px solid #ff0;border-radius:50%}
#light{position:fixed;right:10px;top:50%;transform:translateY(-50%);z-index:11;display:flex;flex-direction:column;align-items:center;gap:4px;background:#0008;padding:6px;border-radius:20px}
#light input{writing-mode:bt-lr; -webkit-appearance:slider-vertical; width:8px; height:90px}
#ctrl{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(transparent,#000f);padding:8px;z-index:10;display:flex;flex-direction:column;gap:6px}
#row{display:flex;gap:4px;flex-wrap:wrap}
#row button{background:#222;color:#fff;border:1px solid #555;padding:9px;border-radius:10px;font-weight:bold;flex:1;font-size:11px;min-width:60px}
#row button.active{background:#ff7800}
#mainBtns{display:flex;gap:6px}
#mainBtns button{flex:1;padding:13px;border:none;border-radius:25px;font-weight:bold;font-size:13px}
#btnFoto{background:#fff;color:#000}
#btnBlanco{background:#ff7800;color:#fff}
#panel{position:fixed;inset:0;background:#0f0f0f;z-index:30;display:none;flex-direction:column;padding:12px;overflow:auto}
#panel input,#panel select{width:100%;padding:10px;border-radius:8px;border:none;margin:4px 0;background:#222;color:#fff}
#wmPreview{position:fixed;z-index:9;pointer-events:none;font-weight:bold;text-shadow:1px 1px 4px #000;font-size:14px;line-height:1.1;text-align:right}
#res{position:fixed;inset:0;background:#000;z-index:20;display:none;flex-direction:column}
#res img,#res video{flex:1;width:100%;object-fit:contain;background:#111}
#rec{position:fixed;top:45px;left:12px;background:#f00;width:10px;height:10px;border-radius:50%;display:none;z-index:11;animation:blink 1s infinite}
@keyframes blink{50%{opacity:0}}
</style>
</head>
<body>
<div id="shutter"></div><div id="rec"></div>
<video id="v" autoplay playsinline muted></video>
<div id="focus"></div><div id="wmPreview"></div>
<div id="msg">Toca el pastel para enfocar • Desliza luz a la derecha</div>

<div id="light">
<span style="font-size:10px">☀️</span>
<input id="exp" type="range" min="-2" max="2" step="0.1" value="0" oninput="cambiarLuz(this.value)">
<span style="font-size:10px">🌙</span>
</div>

<div id="ctrl">
  <div id="row">
    <button id="mFoto" class="active" onclick="setMode('foto')">📸 Foto</button>
    <button id="mVideo" onclick="setMode('video')">🎥 Video</button>
    <button id="mPano" onclick="setMode('pano')">🌄 Pano 3x</button>
    <button onclick="cambiarLente()">↻ Lente</button>
    <button onclick="abrirPanel()" style="background:#444">✏️ Marca</button>
  </div>
  <div id="mainBtns">
    <button id="btnFoto" onclick="accion()">📸 Tomar</button>
    <button id="btnBlanco" onclick="tomarBlanco()">⬜ Fondo Blanco</button>
  </div>
  <div id="panoInfo" style="display:none;text-align:center;font-size:11px">Pano: <span id="pCount">0/3</span></div>
</div>

<div id="panel">
<h3 style="margin:0 0 8px 0">✏️ Marca de Agua Editable</h3>
<label>Nombre / Texto:</label>
<input id="wmText" placeholder="Ej: Pasteles Lupita Jacona">
<label>Logo de tu pastelería:</label>
<input type="file" id="logoFile" accept="image/*">
<img id="logoPrev" style="width:60px;height:60px;object-fit:contain;display:none;background:#fff;border-radius:8px;margin:4px 0">
<label style="font-size:12px"><input type="checkbox" id="wmDate"> Fecha</label><br>
<label style="font-size:12px"><input type="checkbox" id="wmTime"> Hora</label><br>
<label style="font-size:12px"><input type="checkbox" id="wmGps"> Ubicación GPS</label><br>
<label style="font-size:12px"><input type="checkbox" id="wmOn" checked> Activar marca</label>
<div style="display:flex;gap:6px">
<select id="wmPos" style="flex:1"><option value="bottom-right">Abajo Der</option><option value="bottom-left">Abajo Izq</option><option value="top-right">Arriba Der</option><option value="top-left">Arriba Izq</option><option value="center">Centro diagonal</option></select>
<select id="wmSize" style="flex:1"><option value="small">Chico</option><option value="medium" selected>Mediano</option><option value="large">Grande</option></select>
</div>
<select id="wmColor"><option value="white">Blanco</option><option value="gold">Dorado</option><option value="pink">Rosa Pastel</option><option value="black">Negro</option></select>
<button onclick="guardarWM()" style="width:100%;padding:12px;background:#ff7800;border:none;border-radius:10px;font-weight:bold;margin-top:10px">Guardar y Cerrar</button>
<button onclick="cerrarPanel()" style="width:100%;padding:10px;background:#333;border:none;border-radius:10px;margin-top:6px;color:#fff">Cerrar</button>
<p id="gpsStatus" style="font-size:10px;color:#aaa"></p>
<button onclick="borrarTodo()" style="background:none;border:none;color:#666;font-size:10px;margin-top:10px">Borrar logo y datos</button>
</div>

<div id="res">
<img id="outImg"><video id="outVid" controls style="display:none"></video>
<div style="display:flex;gap:6px;padding:10px">
<a id="down" download style="flex:1;padding:12px;background:#fff;color:#000;border-radius:10px;text-align:center;text-decoration:none;font-weight:bold">Guardar</a>
<button onclick="document.getElementById('res').style.display='none'" style="flex:1;padding:12px;background:#333;color:#fff;border:none;border-radius:10px">Cerrar</button>
</div>
</div>

<script>
let v=document.getElementById('v'), stream, track, devices=[], idx=0, mode='foto', gpsText='Jacona, Mich';
let mediaRecorder, chunks=[], recording=false, panoImgs=[], logoImg=null;
let wm={text:'Mis Pasteles',date:true,time:false,gps:true,on:true,pos:'bottom-right',size:'medium',color:'white'};

async function iniciar(d=null){
  if(stream) stream.getTracks().forEach(t=>t.stop());
  try{
    let c={video:{facingMode:{ideal:'environment'},width:{ideal:1920}}};
    if(d) c.video={deviceId:{exact:d}};
    if(mode=='video') c.audio=true;
    stream=await navigator.mediaDevices.getUserMedia(c);
    v.srcObject=stream; await v.play(); track=stream.getVideoTracks()[0];
    document.getElementById('msg').innerText='Toca el pastel para enfocar • Luz a la derecha';
    let all=await navigator.mediaDevices.enumerateDevices(); devices=all.filter(x=>x.kind=='videoinput');
  }catch(e){ document.getElementById('msg').innerText='Da permiso de cámara en el candado 🔒 '+e.name; }
}
function cambiarLente(){ if(devices.length>1){ idx=(idx+1)%devices.length; iniciar(devices[idx].deviceId); } }
function setMode(m){
  mode=m; document.querySelectorAll('#row button').forEach(b=>b.classList.remove('active'));
  document.getElementById('m'+m.charAt(0).toUpperCase()+m.slice(1)).classList.add('active');
  document.getElementById('panoInfo').style.display=m=='pano'?'block':'none';
  document.getElementById('btnFoto').innerText=m=='foto'?'📸 Tomar':m=='video'?(recording?'⏹️ Parar':'🎥 Grabar'):'🌄 Foto 1/3';
  if(m!='pano'){ panoImgs=[]; document.getElementById('pCount').innerText='0/3'; }
  if(m=='video' &&!stream?.getAudioTracks().length) iniciar();
}
async function cambiarLuz(val){
  try{ await track.applyConstraints({advanced:[{exposureCompensation:parseFloat(val)}]}); }catch{
    try{ await track.applyConstraints({advanced:[{brightness:50+parseFloat(val)*25}]}); }catch{ v.style.filter='brightness('+(1+parseFloat(val)*0.3)+')'; }
  }
}
// ENFOQUE CON CUADRO
v.addEventListener('click', async e=>{
  let f=document.getElementById('focus'); f.style.left=e.clientX+'px'; f.style.top=e.clientY+'px'; f.style.display='block';
  setTimeout(()=>f.style.display='none',1200);
  try{
    let x=e.clientX/window.innerWidth, y=e.clientY/window.innerHeight;
    await track.applyConstraints({advanced:[{pointsOfInterest:[{x,y}],focusMode:'manual',exposureMode:'manual'}]});
    document.getElementById('msg').innerText='Enfocando...';
    setTimeout(async()=>{ try{ await track.applyConstraints({advanced:[{focusMode:'continuous',exposureMode:'continuous'}]}); document.getElementById('msg').innerText='Enfocado ✓'; }catch{} },900);
  }catch{ document.getElementById('msg').innerText='Enfoque tocado ✓'; }
});
function abrirPanel(){ document.getElementById('panel').style.display='flex'; }
function cerrarPanel(){ document.getElementById('panel').style.display='none'; }
function cargarWM(){
  let s=localStorage.getItem('wmTotal'); if(s) try{ wm=JSON.parse(s);}catch{}
  let l=localStorage.getItem('pastelLogo'); if(l){ logoImg=new Image(); logoImg.src=l; document.getElementById('logoPrev').src=l; document.getElementById('logoPrev').style.display='block'; }
  document.getElementById('wmText').value=wm.text; document.getElementById('wmDate').checked=wm.date; document.getElementById('wmTime').checked=wm.time;
  document.getElementById('wmGps').checked=wm.gps; document.getElementById('wmOn').checked=wm.on; document.getElementById('wmPos').value=wm.pos;
  document.getElementById('wmSize').value=wm.size; document.getElementById('wmColor').value=wm.color; actualizarPreview(); obtenerGPS();
}
function guardarWM(){
  wm.text=document.getElementById('wmText').value||'Mis Pasteles'; wm.date=document.getElementById('wmDate').checked; wm.time=document.getElementById('wmTime').checked;
  wm.gps=document.getElementById('wmGps').checked; wm.on=document.getElementById('wmOn').checked; wm.pos=document.getElementById('wmPos').value;
  wm.size=document.getElementById('wmSize').value; wm.color=document.getElementById('wmColor').value;
  localStorage.setItem('wmTotal',JSON.stringify(wm)); actualizarPreview(); cerrarPanel(); if(wm.gps) obtenerGPS();
}
function actualizarPreview(){
  let p=document.getElementById('wmPreview'); if(!wm.on){ p.style.display='none'; return; } p.style.display='block';
  p.innerText=buildText(); let col={white:'#fff',gold:'#FFD700',pink:'#FF8FAB',black:'#000'}[wm.color]; p.style.color=col;
  let sz={small:'12px',medium:'15px',large:'20px'}[wm.size]; p.style.fontSize=sz;
  let pos={ 'bottom-right':{bottom:'70px',right:'10px',left:'auto',top:'auto',transform:'none'},'bottom-left':{bottom:'70px',left:'10px',right:'auto',top:'auto',transform:'none'},'top-right':{top:'45px',right:'10px',bottom:'auto',left:'auto',transform:'none'},'top-left':{top:'45px',left:'10px',bottom:'auto',right:'auto',transform:'none'},'center':{top:'50%',left:'50%',bottom:'auto',right:'auto',transform:'translate(-50%,-50%) rotate(-20deg)',opacity:'0.18',fontSize:'24px'} };
  Object.assign(p.style,pos[wm.pos]);
}
function buildText(){ let a=[]; if(wm.text) a.push('🍰 '+wm.text); if(wm.date) a.push(new Date().toLocaleDateString()); if(wm.time) a.push(new Date().toLocaleTimeString().slice(0,5)); if(wm.gps && gpsText) a.push(gpsText); return a.join(' • '); }
function obtenerGPS(){
  if(!wm.gps) return; document.getElementById('gpsStatus').innerText='Buscando ubicación...';
  navigator.geolocation.getCurrentPosition(async pos=>{
    try{ let r=await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${pos.coords.latitude}&lon=${pos.coords.longitude}&format=json`); let j=await r.json(); gpsText=(j.address.town||j.address.city||'Jacona')+(j.address.state? ', '+j.address.state:''); }catch{ gpsText='Jacona, Mich'; }
    document.getElementById('gpsStatus').innerText=gpsText; actualizarPreview();
  },()=>{ gpsText='Jacona, Mich'; document.getElementById('gpsStatus').innerText=gpsText; });
}
document.getElementById('logoFile').addEventListener('change',e=>{
  let r=new FileReader(); r.onload=()=>{ localStorage.setItem('pastelLogo',r.result); logoImg=new Image(); logoImg.src=r.result; document.getElementById('logoPrev').src=r.result; document.getElementById('logoPrev').style.display='block'; actualizarPreview(); }; r.readAsDataURL(e.target.files[0]);
});
function borrarTodo(){ localStorage.clear(); logoImg=null; document.getElementById('logoPrev').style.display='none'; alert('Borrado'); }

function accion(){
  if(mode=='foto') tomarFoto(false);
  else if(mode=='video') toggleVideo();
  else tomarPano();
}
async function tomarFoto(esBlanco=false){ await tomarPro(esBlanco); }
async function tomarBlanco(){ await tomarPro(true); }

async function tomarPro(esBlanco){
  let s=document.getElementById('shutter'); s.style.display='block'; s.classList.remove('flash'); void s.offsetWidth; s.classList.add('flash'); if(navigator.vibrate) navigator.vibrate(40);
  await new Promise(r=>setTimeout(r,180));
  let c=document.createElement('canvas'); c.width=v.videoWidth||1280; c.height=v.videoHeight||720; let ctx=c.getContext('2d'); ctx.drawImage(v,0,0);
  if(esBlanco){
    let c2=document.createElement('canvas'); c2.width=c.width; c2.height=c.height; let ctx2=c2.getContext('2d');
    ctx2.fillStyle='#fff'; ctx2.fillRect(0,0,c2.width,c2.height); ctx2.shadowColor='rgba(0,0,0,0.18)'; ctx2.shadowBlur=c.width*0.05; ctx2.drawImage(c,0,0); ctx2.shadowColor='transparent';
    aplicarMarca(ctx2,c2.width,c2.height); mostrar(c2.toDataURL('image/jpeg',0.92),'img');
  }else{ aplicarMarca(ctx,c.width,c.height); mostrar(c.toDataURL('image/jpeg',0.92),'img'); }
  setTimeout(()=>s.style.display='none',300);
}
function aplicarMarca(ctx,w,h){
  if(!wm.on) return; let fs={small:w*0.032,medium:w*0.042,large:w*0.055}[wm.size];
  ctx.font='bold '+fs+'px sans-serif'; ctx.fillStyle={white:'#fff',gold:'#FFD700',pink:'#FF8FAB',black:'#222'}[wm.color];
  ctx.shadowColor='#0008'; ctx.shadowBlur=6; let txt=buildText(); let pad=fs;
  let lines=txt.split(' • '); let ly=h-pad;
  if(wm.pos.includes('bottom')){ lines.reverse().forEach(l=>{ ctx.textAlign=wm.pos.includes('right')?'right':'left'; let x=wm.pos.includes('right')?w-pad:pad; ctx.fillText(l,x,ly); ly-=fs*1.25; }); }
  else { ctx.textAlign='center'; lines.forEach(l=>{ ctx.fillText(l,w/2,ly); ly+=fs*1.25; }); }
  if(logoImg){ try{ let s=fs*2.2; let lx=w-pad-s, lY=h-pad-s*1.2; if(!wm.pos.includes('right')) lx=pad; ctx.shadowBlur=0; ctx.drawImage(logoImg,lx,lY,s,s); }catch{} }
}
function mostrar(url,tipo){
  document.getElementById('outImg').style.display=tipo=='img'?'block':'none'; document.getElementById('outVid').style.display=tipo=='img'?'none':'block';
  if(tipo=='img') document.getElementById('outImg').src=url; else document.getElementById('outVid').src=url;
  document.getElementById('down').href=url; document.getElementById('down').download='pastel-'+Date.now()+(tipo=='img'?'.jpg':'.webm'); document.getElementById('res').style.display='flex';
}
function toggleVideo(){
  if(!recording){
    chunks=[]; mediaRecorder=new MediaRecorder(stream); mediaRecorder.ondataavailable=e=>{ if(e.data.size>0) chunks.push(e.data); };
    mediaRecorder.onstop=()=>{ let blob=new Blob(chunks,{type:'video/webm'}); mostrar(URL.createObjectURL(blob),'vid'); document.getElementById('msg').innerText='Video listo ✓'; };
    mediaRecorder.start(); recording=true; document.getElementById('rec').style.display='block'; document.getElementById('btnFoto').innerText='⏹️ Parar'; document.getElementById('msg').innerText='🔴 Grabando...';
  }else{ mediaRecorder.stop(); recording=false; document.getElementById('rec').style.display='none'; document.getElementById('btnFoto').innerText='🎥 Grabar'; }
}
async function tomarPano(){
  let s=document.getElementById('shutter'); s.style.display='block'; s.classList.add('flash'); await new Promise(r=>setTimeout(r,120)); s.style.display='none'; s.classList.remove('flash');
  let c=document.createElement('canvas'); c.width=v.videoWidth; c.height=v.videoHeight; c.getContext('2d').drawImage(v,0,0); panoImgs.push(c);
  document.getElementById('pCount').innerText=panoImgs.length+'/3'; document.getElementById('msg').innerText='Pano '+panoImgs.length+'/3 - gira a la derecha';
  if(panoImgs.length<3){ document.getElementById('btnFoto').innerText='🌄 Foto '+(panoImgs.length+1)+'/3'; return; }
  let W=panoImgs[0].width*3, H=panoImgs[0].height; let f=document.createElement('canvas'); f.width=W; f.height=H; let ctx=f.getContext('2d');
  panoImgs.forEach((cc,i)=>ctx.drawImage(cc,i*cc.width,0)); aplicarMarca(ctx,W,H); mostrar(f.toDataURL('image/jpeg',0.9),'img'); panoImgs=[]; document.getElementById('pCount').innerText='0/3'; document.getElementById('btnFoto').innerText='🌄 Foto 1/3';
}
cargarWM(); iniciar();
</script>
</body>
</html>
