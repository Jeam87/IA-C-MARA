<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Foto Pro IA Estudio V4.5 AUTO</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon-512.png">
<style>
*{box-sizing:border-box}body{margin:0;background:#000;overflow:hidden;font-family:system-ui;color:#fff;touch-action:none}
#v{width:100vw;height:100vh;object-fit:cover;position:fixed;inset:0;background:#111;transform:none!important}
#flash{position:fixed;inset:0;background:#fff;z-index:60;opacity:0;pointer-events:none;transition:opacity.12s}#flash.on{opacity:1}
#recDot{position:fixed;top:52px;left:50%;transform:translateX(-50%);z-index:11;background:#f00;color:#fff;padding:7px 18px;border-radius:22px;font-size:13px;font-weight:900;display:none;gap:8px;align-items:center}
#start{position:fixed;inset:0;background:#000;z-index:100;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:22px;text-align:center}
#start.show{display:flex}
#start button{padding:18px;width:100%;background:#ff7800;color:#fff;border:none;border-radius:50px;font-size:18px;font-weight:900}
#top{position:fixed;top:10px;left:10px;right:10px;z-index:10;background:#000c;padding:8px 12px;border-radius:20px;display:flex;justify-content:space-between;font-size:10px;border:1px solid #333;align-items:center}
#zoomBar{position:fixed;left:50%;bottom:175px;transform:translateX(-50%);z-index:20;background:#000e;padding:7px 8px;border-radius:25px;display:flex;gap:6px;border:1px solid #444}
#zoomBar button{background:#222;color:#fff;border:1px solid #555;padding:7px 13px;border-radius:20px;font-size:12px}
#ctrl{position:fixed;bottom:0;left:0;right:0;z-index:10;padding:12px 14px 20px;background:linear-gradient(transparent,#000d 20%,#000 90%)}
#mainRow{display:flex;align-items:center;justify-content:space-between}
#shutter{width:86px;height:86px;border-radius:50%;background:#fff;border:5px solid #000;box-shadow:0 0 0 3px #fff;display:flex;align-items:center;justify-content:center;font-size:30px}
#shutter.rec{background:#f00;animation:pulse.8s infinite}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(.92)}}
.btn{width:52px;height:52px;border-radius:50%;background:#ffffff18;border:1px solid #ffffff35;color:#fff;font-size:20px}
#drawer{position:fixed;bottom:0;left:0;right:0;background:#161616fa;border-radius:28px 28px 0 0;z-index:30;padding:16px 16px 28px;transform:translateY(110%);transition:.32s;max-height:85vh;overflow:auto}#drawer.open{transform:translateY(0)}
.label{font-size:11px;color:#ff7800;font-weight:800;margin:12px 0 6px;display:block}.inp{width:100%;padding:11px;border-radius:11px;background:#222;border:1px solid #333;color:#fff}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.chip{padding:8px 12px;border-radius:20px;border:1px solid #333;background:#222;color:#fff;font-size:11px;text-align:center}.chip.on{background:#fff;color:#000;font-weight:900}
#res{position:fixed;inset:0;background:#000;z-index:40;display:none;flex-direction:column}#res img,#res video{flex:1;width:100%;object-fit:contain;background:#111}
</style></head><body>
<div id="flash"></div><div id="recDot">🔴 <span id="timer">00:00</span></div>
<div id="start"><div style="font-size:46px">📷</div><h3>Permiso de cámara bloqueado</h3><p style="color:#aaa;font-size:12px">Dale al candado 🔒 arriba y pon Cámara en Permitir</p><button id="btnBack">📷 REINTENTAR TRASERA</button><button id="btnFront" style="background:#222;border:1px solid #444">🤳 FRONTAL</button></div>
<video id="v" autoplay playsinline muted></video>
<div id="top"><span id="info">Cargando...</span><button id="btnTorch" style="display:none;background:#222;border:1px solid #555;color:#fff;border-radius:12px;padding:4px 10px;font-size:12px">🔦</button><span id="modeTxt" style="background:#fff;color:#000;padding:2px 9px;border-radius:10px;font-weight:900">FOTO</span></div>
<div id="zoomBar"><button data-z="0.6">0.6x</button><button data-z="1" class="active">1x</button><button data-z="2">2x</button><button data-z="5">5x</button></div>
<div id="ctrl"><div id="mainRow"><button class="btn" id="btnFlip">🔄</button><div id="shutter">📸</div><button class="btn" id="btnSet">⚙️</button></div><div style="display:flex;justify-content:center;gap:8px;margin-top:12px"><button id="mf" style="background:#fff;color:#000;padding:7px 20px;border-radius:20px;border:none;font-weight:900;font-size:12px">FOTO</button><button id="mv" style="background:#222;color:#fff;padding:7px 20px;border-radius:20px;border:1px solid #555;font-size:12px">VIDEO</button><button id="recBtn" style="background:#222;color:#fff;padding:7px 14px;border-radius:20px;border:1px solid #555;font-size:12px">⬜ 1:1</button></div></div>
<div id="drawer"><div style="width:40px;height:5px;background:#444;border-radius:10px;margin:0 auto 12px"></div><h3>⚙️ Config</h3><span class="label">FLASH</span><div class="grid2"><label style="display:flex;gap:8px;background:#222;padding:10px;border-radius:12px;font-size:12px"><input type="checkbox" id="flashOn" checked> Pantalla</label><label style="display:flex;gap:8px;background:#222;padding:10px;border-radius:12px;font-size:12px"><input type="checkbox" id="ledOn" checked> LED</label></div><span class="label">FONDO</span><div class="grid2"><button class="chip on" id="bg0">Original</button><button class="chip" id="bg1">Blur</button><button class="chip" id="bg2">Blanco</button><button class="chip" id="bg3">Negro</button></div><span class="label">MARCA</span><input id="wm" class="inp" value="Foto Pro IA - Jacona"><div class="grid2"><input id="price" class="inp" value="$250"><input id="gps" class="inp" value="Jacona, Mich"></div><button id="btnClose" style="width:100%;padding:14px;margin-top:14px;background:#fff;color:#000;border:none;border-radius:14px;font-weight:900">✅ CERRAR</button></div>
<div id="res"><img id="outImg" style="display:none"><video id="outVid" controls playsinline style="display:none"></video><div style="display:flex;gap:8px;padding:12px"><a id="dl" download style="flex:1;padding:14px;background:#fff;color:#000;border-radius:14px;text-align:center;text-decoration:none;font-weight:900">💾 Guardar</a><button id="btnCont" style="flex:1;padding:14px;background:#222;color:#fff;border:none;border-radius:14px">Seguir</button></div></div>
<script>
let v=document.getElementById('v'), stream, track, modo='foto', isRec=false, curBg='none', recorte='none', curZoom=1, torchOn=false, hasTorch=false, sec=0, timerInt, recorder, chunks=[];
const $=id=>document.getElementById(id);
async function iniciar(wantFront){
 try{
  if(stream) stream.getTracks().forEach(t=>t.stop());
  // CONFIG ESTABLE PARA NO RAYAS: 720p y sin audio
  let cons={video:{facingMode:wantFront?'user':'environment', width:{ideal:1280}, height:{ideal:720}}, audio:false};
  stream=await navigator.mediaDevices.getUserMedia(cons);
  v.srcObject=stream;
  await v.play();
  track=stream.getVideoTracks()[0];
  $('start').classList.remove('show');
  $('info').innerText=track.getSettings().width+'x'+track.getSettings().height;
  try{ hasTorch=track.getCapabilities()?.torch||false; $('btnTorch').style.display=hasTorch?'block':'none'; }catch{}
 }catch(e){
  $('start').classList.add('show');
  $('info').innerText='Sin permiso';
 }
}
window.addEventListener('load',()=>{ setTimeout(()=>iniciar(false),300); });
$('btnBack').addEventListener('click',()=>iniciar(false));
$('btnFront').addEventListener('click',()=>iniciar(true));
$('btnFlip').addEventListener('click',()=>iniciar(true));
$('btnTorch').addEventListener('click',async()=>{ try{ torchOn=!torchOn; await track.applyConstraints({advanced:[{torch:torchOn}]}); $('btnTorch').innerText=torchOn?'🔦 ON':'🔦 OFF'; }catch{} });
function setModo(m){ modo=m; $('mf').style.background=m=='foto'?'#fff':'#222'; $('mf').style.color=m=='foto'?'#000':'#fff'; $('mv').style.background=m=='video'?'#fff':'#222'; $('mv').style.color=m=='video'?'#000':'#fff'; $('modeTxt').innerText=m.toUpperCase(); }
$('mf').addEventListener('click',()=>setModo('foto')); $('mv').addEventListener('click',()=>setModo('video'));
document.querySelectorAll('#zoomBar button').forEach(b=>{ b.addEventListener('click',()=>{ curZoom=parseFloat(b.dataset.z); try{ track.applyConstraints({advanced:[{zoom:curZoom}]});}catch{ v.style.transform='scale('+(1+(curZoom-1)*0.1)+')'; } document.querySelectorAll('#zoomBar button').forEach(x=>x.classList.remove('active')); b.classList.add('active'); }); });
['bg0','bg1','bg2','bg3'].forEach((id,i)=>{ $(id).addEventListener('click',()=>{ curBg=['none','blur','white','black'][i]; document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on')); $(id).classList.add('on'); }); });
$('recBtn').addEventListener('click',()=>{ let o=['none','1:1','4:5']; recorte=o[(o.indexOf(recorte)+1)%o.length]; $('recBtn').innerText=recorte=='none'?'⬜ Orig':recorte; });
$('btnSet').addEventListener('click',()=>$('drawer').classList.add('open')); $('btnClose').addEventListener('click',()=>$('drawer').classList.remove('open')); $('btnCont').addEventListener('click',()=>$('res').style.display='none');
$('shutter').addEventListener('click',()=>{ if(modo=='foto') foto(); else video(); });
async function foto(){
 if($('ledOn').checked && hasTorch){ try{ await track.applyConstraints({advanced:[{torch:true}]}); await new Promise(r=>setTimeout(r,200)); }catch{} }
 if($('flashOn').checked){ $('flash').classList.add('on'); setTimeout(()=>$('flash').classList.remove('on'),120); }
 let c=document.createElement('canvas'); c.width=v.videoWidth||1280; c.height=v.videoHeight||720; c.getContext('2d').drawImage(v,0,0,c.width,c.height);
 let blob=await new Promise(r=>c.toBlob(r,'image/jpeg',0.95));
 if($('ledOn').checked && hasTorch){ try{ await track.applyConstraints({advanced:[{torch:false}]}); }catch{} }
 let url=URL.createObjectURL(blob); $('outImg').src=url; $('outImg').style.display='block'; $('outVid').style.display='none'; $('dl').href=url; $('dl').download='FOTO_'+Date.now()+'.jpg'; $('res').style.display='flex';
}
function video(){
 let sh=$('shutter'), dot=$('recDot'), t=$('timer');
 if(!isRec){
  chunks=[]; recorder=new MediaRecorder(stream,{mimeType:'video/webm'});
  recorder.ondataavailable=e=>{ if(e.data.size) chunks.push(e.data); };
  recorder.onstop=()=>{ let b=new Blob(chunks,{type:'video/webm'}); let u=URL.createObjectURL(b); $('outVid').src=u; $('outVid').style.display='block'; $('outImg').style.display='none'; $('dl').href=u; $('dl').download='VIDEO_'+Date.now()+'.webm'; $('res').style.display='flex'; };
  recorder.start(200); isRec=true; sh.classList.add('rec'); dot.style.display='flex'; sec=0; timerInt=setInterval(()=>{ sec++; t.innerText=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0'); },1000);
 }else{ recorder.stop(); isRec=false; sh.classList.remove('rec'); dot.style.display='none'; clearInterval(timerInt); }
}
</script></body></html>
