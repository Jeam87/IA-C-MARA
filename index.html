<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>App de Cámara con IA</title>
</head>
<body>
<h1>Mejorador de Fotos con IA</h1>

<!-- Subir imagen -->
<input type="file" id="upload" accept="image/*" />
<br><br>

<!-- Botón para procesar la imagen -->
<button onclick="procesarImagen()">Mejorar Imagen</button>

<!-- Mostrar la imagen original -->
<h2>Imagen Original</h2>
<img id="originalImage" src="" alt="Imagen subido" width="300" />

<!-- Mostrar la imagen final procesada -->
<h2>Imagen Mejorada</h2>
<img id="resultImage" src="" alt="Imagen mejorada" width="300" />

<script>
let imagenSubida = null;

// Cuando se sube la imagen
document.getElementById('upload').addEventListener('change', function(event) {
    const reader = new FileReader();
    reader.onload = function(e) {
        document.getElementById('originalImage').src = e.target.result;
        imagenSubida = e.target.result;
    }
    reader.readAsDataURL(event.target.files[0]);
});

// Función para procesar la imagen
function procesarImagen() {
    if (!imagenSubida) {
        alert('Por favor, sube una imagen primero.');
        return;
    }

    // Aquí deberías enviar la imagen a tu backend que ejecuta el código Python
    // Por ejemplo, usando fetch para enviar la imagen y recibir la imagen mejorada
    // Como este es un ejemplo, vamos a simularlo mostrando la misma imagen

    // Simulación: simplemente muestra la misma imagen
    document.getElementById('resultImage').src = imagenSubida;

    // En un caso real, aquí usarías fetch() para enviar la imagen al backend
    /*
    fetch('/procesar-imagen', {
        method: 'POST',
        body: data // la imagen en formato adecuado
    })
    .then(response => response.blob())
    .then(blob => {
        const url = URL.createObjectURL(blob);
        document.getElementById('resultImage').src = url;
    });
    */
}
</script>

</body>
</html>
