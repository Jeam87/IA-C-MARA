<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cam 3 Lentes</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:sans-serif}
#v{width:100%;height:100vh;object-fit:cover;background:#111}
#ctrl{position:fixed;bottom:0;left:0;right:0;background:#000c;display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:10px;z-index:10}
button{padding:10px 14px;border-radius:20px;border:none;font-weight:bold;font-size:13px}
#foto{background:#fff;color:#000;font-size:16px;padding:12px 25px;border-radius:30px}
#msg{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:#000c;padding:6px 14px;border-radius:20px;z-index:10;font-size:13px}
.camBtn{background:#222;color:#fff;border:1px solid #444}.camBtn.active{background:#ff7800;border-color:#ff7800}
#res{position:fixed;inset:0;background:#000;display:none;flex-direction:column;z-index:20}
#res img{width:100%;flex:1;object-fit:contain}
#zoomBar{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:10}
#zoomBar button{background:#000c;color:#fff;border:1px solid #fff}
</style>
</head>
<body>
<div id="msg">Detectando lentes...</div>
<video id="v" autoplay playsinline></video>

<div id="zoomBar">
  <button onclick="zoom(-0.5)">Alejar -</button>
  <button onclick="zoom(0.5)">Acercar +</button>
</div>

<div id="ctrl">
  <div id="cams" style="display:flex;gap:8px;width:100%;justify-content:center"></div>
  <button id="foto" onclick="tomar()">📸 Tomar Foto IA (2x)</button>
</div>

<div id="res"><img id="out"><button onclick="this.parentElement.style.display='none'" style="padding:15px;background:#333;color:#fff">Cerrar</button><a id="down" download="pastel-hd.jpg" style="padding:15px;background:#fff;color:#000;text-align:center;margin:10px;border-radius:10px;text-decoration:none">Guardar HD</a></div>

<script>
let video=document.getElementById('v'), stream, track, devices=[], currentId=null, zoomLevel=1;

async function getCamaras(){
  await navigator.mediaDevices.getUserMedia({video:true}); // permiso para ver nombres
  let all=await navigator.mediaDevices.enumerateDevices();
  devices=all.filter(d=>d.kind==='videoinput');
  let camsDiv=document.getElementById('cams'); camsDiv.innerHTML='';
  devices.forEach((d,i)=>{
    let label=d.label.toLowerCase();
    let nombre='Cam '+(i+1);
    if(label.includes('back')||label.includes('rear')||label.includes('trasera')||i==0) nombre=['Gran Angular 0.6x','Principal 1x','Teleobjetivo 3x'][i]||nombre;
    if(label.includes('front')||label.includes('frontal')) nombre='Frontal';
    let b=document.createElement('button'); b.className='camBtn'; b.innerText=nombre;
    b.onclick=()=>iniciar(d.deviceId, b);
    camsDiv.appendChild(b);
  });
  if(devices[0]) iniciar(devices[0].deviceId, camsDiv.firstChild);
}
async function iniciar(deviceId, btn){
  if(stream) stream.getTracks().forEach(t=>t.stop());
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{deviceId:{exact:deviceId}, width:{ideal:1920}, height:{ideal:1080}}});
    video.srcObject=stream; await video.play();
    track=stream.getVideoTracks()[0]; currentId=deviceId;
    document.querySelectorAll('.camBtn').forEach(x=>x.classList.remove('active'));
    if(btn) btn.classList.add('active');
    let caps=track.getCapabilities? track.getCapabilities() : {};
    document.getElementById('msg').innerText=btn.innerText+' lista'+(caps.zoom?` - Zoom ${caps.zoom.min}x a ${caps.zoom.max}x`:'');
    if(caps.zoom){ zoomLevel=caps.zoom.min||1; }
  }catch(e){ document.getElementById('msg').innerText='Error: '+e.message; }
}
function zoom(d){
  if(!track) return;
  try{
    let caps=track.getCapabilities(); if(!caps.zoom) return;
    zoomLevel=Math.min(caps.zoom.max, Math.max(caps.zoom.min, zoomLevel+d));
    track.applyConstraints({advanced:[{zoom:zoomLevel}]}).then(()=>{document.getElementById('msg').innerText='Zoom '+zoomLevel.toFixed(1)+'x';});
  }catch{}
}
getCamaras();

video.onclick=async(e)=>{
  if(!track) return;
  const x=e.clientX/window.innerWidth, y=e.clientY/window.innerHeight;
  try{ await track.applyConstraints({advanced:[{focusMode:'continuous', pointsOfInterest:[{x,y}]}]}); document.getElementById('msg').innerText='Enfocando...'; setTimeout(()=>document.getElementById('msg').innerText='Enfocado',600);}catch{}
}

async function tomar(){
  let c=document.createElement('canvas'); c.width=video.videoWidth; c.height=video.videoHeight;
  c.getContext('2d').drawImage(video,0,0);
  let base64=c.toDataURL('image/jpeg',0.9);
  document.getElementById('msg').innerText='Mejorando con Real-ESRGAN...';
  try{
    let r=await fetch('/api/upscale',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:base64})});
    let data=await r.json(); if(!data.url) throw new Error();
    document.getElementById('out').src=data.url; document.getElementById('down').href=data.url;
    document.getElementById('res').style.display='flex'; document.getElementById('msg').innerText='¡Foto HD lista!';
  }catch{ let a=document.createElement('a'); a.href=base64; a.download='foto.jpg'; a.click(); document.getElementById('msg').innerText='Guardada normal (sin IA)'; }
}
</script>
</body>
</html>
