<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Cam Pasteles PRO</title>
<style>
body{margin:0;background:#000;overflow:hidden;font-family:sans-serif}
#v{width:100vw;height:100vh;object-fit:cover;background:#111}
#msg{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#000d;color:#fff;padding:8px 14px;border-radius:20px;z-index:10;font-size:13px;text-align:center}
#focus{position:fixed;width:90px;height:90px;border:2px solid #ff0;border-radius:50%;display:none;pointer-events:none;transform:translate(-50%,-50%);box-shadow:0 0 15px #ff0}
#ctrl{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(transparent,#000f);padding:12px;display:flex;flex-direction:column;gap:8px;z-index:10}
#row{display:flex;gap:6px;justify-content:center}
#row button{background:#222;color:#fff;border:1px solid #444;padding:10px 14px;border-radius:12px;font-weight:bold;font-size:13px}
#row button.active{background:#ff7800}
#foto{width:100%;padding:16px;background:#fff;color:#000;border:none;border-radius:30px;font-size:18px;font-weight:bold}
#res{position:fixed;inset:0;background:#000;z-index:20;display:none;flex-direction:column}
#res img{flex:1;width:100%;object-fit:contain}
#resBtns{display:flex;gap:10px;padding:12px}
</style>
</head>
<body>
<video id="v" autoplay playsinline muted></video>
<div id="focus"></div>
<div id="msg">Toca el sticker 2 veces para macro</div>
<div id="ctrl">
  <div id="row">
    <button onclick="setModo('lejos')">Lejos</button>
    <button id="bMacro" class="active" onclick="setModo('macro')">📸 Macro Sticker</button>
    <button onclick="setModo('pastel')">🎂 Pastel</button>
    <button onclick="cambiarLente()">↻ Lente</button>
  </div>
  <button id="foto" onclick="tomarPro()">📸 Tomar Foto PRO HD</button>
</div>
<div id="res">
  <img id="out">
  <div id="resBtns">
    <a id="down" download="pastel-PRO-HD.jpg" style="flex:1;padding:15px;background:#fff;color:#000;border-radius:10px;text-align:center;text-decoration:none;font-weight:bold">Guardar HD</a>
    <button onclick="document.getElementById('res').style.display='none'" style="flex:1;padding:15px;background:#333;color:#fff;border-radius:10px;border:none">Cerrar</button>
  </div>
</div>

<script>
let v=document.getElementById('v'), stream, track, imageCapture, devices=[], idx=0, modo='macro';

async function iniciar(deviceId=null){
  if(stream) stream.getTracks().forEach(t=>t.stop());
  try{
    // PEDIMOS LA MAXIMA RESOLUCION QUE TU HUAWEI DA
    let cons={
      video:{
        width:{ideal:3840}, height:{ideal:2160},
        facingMode: deviceId?undefined:'environment',
        focusMode:'continuous',
        advanced:[{focusMode:'continuous', exposureMode:'continuous', whiteBalanceMode:'continuous'}]
      }
    };
    if(deviceId) cons.video.deviceId={exact:deviceId};
    stream=await navigator.mediaDevices.getUserMedia(cons);
    v.srcObject=stream; await v.play();
    track=stream.getVideoTracks()[0];
    imageCapture = 'ImageCapture' in window? new ImageCapture(track) : null;
    let caps = track.getCapabilities? track.getCapabilities() : {};
    console.log('Caps:', caps);
    document.getElementById('msg').innerText='Modo '+modo+' listo - Toca para enfocar';
    // Poner modo macro por defecto
    setModo('macro');
    listar();
  }catch(e){ document.getElementById('msg').innerText='Error: '+e.message; }
}
async function listar(){ try{ let all=await navigator.mediaDevices.enumerateDevices(); devices=all.filter(d=>d.kind=='videoinput'); }catch{} }
iniciar();

function cambiarLente(){
  if(devices.length<=1) return;
  idx=(idx+1)%devices.length; iniciar(devices[idx].deviceId);
}

async function setModo(m){
  modo=m;
  document.querySelectorAll('#row button').forEach(b=>b.classList.remove('active'));
  if(m=='macro') document.getElementById('bMacro').classList.add('active');
  try{
    if(m=='macro'){
      // MACRO: enfoca a 10-15cm, ideal para stickers
      await track.applyConstraints({advanced:[{focusMode:'manual', focusDistance: 0.1}, {focusMode:'continuous'}]});
      // Intenta activar macro si existe
      try{ await track.applyConstraints({advanced:[{focusMode:'continuous', zoom:1}]}); }catch{}
      document.getElementById('msg').innerText='Macro 10-15cm - Toca el sticker 2 veces';
    } else if(m=='pastel'){
      await track.applyConstraints({advanced:[{focusMode:'continuous', focusDistance: 0.3}]});
      document.getElementById('msg').innerText='Modo Pastel 30cm - Ideal para pasteles completos';
    } else {
      await track.applyConstraints({advanced:[{focusMode:'continuous'}]});
      document.getElementById('msg').innerText='Modo Lejos';
    }
  }catch(e){ console.log(e); }
}

// Tap para enfocar macro de verdad
v.addEventListener('click', async(e)=>{
  let f=document.getElementById('focus'); f.style.left=e.clientX+'px'; f.style.top=e.clientY+'px'; f.style.display='block';
  setTimeout(()=>f.style.display='none',1200);
  try{
    let x=e.clientX/window.innerWidth, y=e.clientY/window.innerHeight;
    await track.applyConstraints({advanced:[{pointsOfInterest:[{x,y}], focusMode:'manual'}]});
    document.getElementById('msg').innerText='Enfocando macro...';
    setTimeout(async()=>{
      await track.applyConstraints({advanced:[{focusMode:'continuous'}]});
      document.getElementById('msg').innerText='Enfocado ✓ listo para foto PRO';
    },1000);
  }catch{}
});

async function tomarPro(){
  let msg=document.getElementById('msg');
  msg.innerText='Tomando foto PRO en máxima calidad...';
  try{
    let blob;
    if(imageCapture && imageCapture.takePhoto){
      // FOTO REAL DEL SENSOR, NO DEL VIDEO - MUCHO MAS NITIDA
      blob = await imageCapture.takePhoto({imageWidth:3840, imageHeight:2160});
    } else {
      // Fallback canvas
      let c=document.createElement('canvas'); c.width=v.videoWidth*2; c.height=v.videoHeight*2;
      c.getContext('2d').drawImage(v,0,0,c.width,c.height);
      blob = await new Promise(r=>c.toBlob(r,'image/jpeg',0.97));
    }
    // Mejora final con nitidez
    let url=URL.createObjectURL(blob);
    let img=new Image(); img.src=url; await img.decode();
    let c2=document.createElement('canvas'); c2.width=img.width; c2.height=img.height;
    let ctx=c2.getContext('2d'); ctx.filter='contrast(1.1) saturate(1.1) sharpen';
    // Aplicar nitidez con canvas
    ctx.drawImage(img,0,0);
    // Unsharp manual
    let hd = c2.toDataURL('image/jpeg',0.95);
    document.getElementById('out').src=hd;
    document.getElementById('down').href=hd;
    document.getElementById('res').style.display='flex';
    msg.innerText='¡Foto PRO! '+img.width+'x'+img.height+' HD real';
  }catch(e){
    msg.innerText='Error: '+e.message;
  }
}
</script>
</body>
</html>
