<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PODEROSA P30 SIN COLGARSE</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:sans-serif;overflow:hidden}
#v{width:100vw;height:100vh;object-fit:cover;background:#111}
#msg{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#000d;padding:8px 14px;border-radius:20px;z-index:10;font-size:12px;text-align:center}
#ctrl{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(transparent,#000);padding:10px;z-index:10}
#shutterRow{display:flex;justify-content:center;gap:24px}
#foto{width:88px;height:88px;border-radius:50%;background:#fff;border:6px solid #ff7800;font-size:32px}
#btnVideo{width:54px;height:54px;border-radius:50%;background:#222;border:3px solid #fff;color:#fff}
#res{position:fixed;inset:0;background:#000;z-index:20;display:none;flex-direction:column}
#res img,#res video{flex:1;width:100%;object-fit:contain}
</style>
</head>
<body>
<video id="v" autoplay playsinline muted></video>
<div id="msg">PODEROSA P30 - Sin rayas - Instantanea</div>

<div id="ctrl">
  <div id="shutterRow">
    <button id="btnVideo" onclick="toggleVideo()">🎥</button>
    <button id="foto" onclick="tomarPoderosa()">📸</button>
    <div style="width:54px"></div>
  </div>
</div>

<div id="res">
  <img id="outImg" style="display:none">
  <video id="outVid" style="display:none" controls playsinline></video>
  <div style="display:flex;gap:10px;padding:12px">
    <a id="down" download style="flex:1;padding:14px;background:#fff;color:#000;border-radius:10px;text-align:center;text-decoration:none;font-weight:bold">Guardar 6MB REAL</a>
    <button onclick="document.getElementById('res').style.display='none'" style="flex:1;padding:14px;background:#333;color:#fff;border:none;border-radius:10px">Cerrar</button>
  </div>
</div>

<script>
let v=document.getElementById('v'), stream, track;
let grabando=false, recorder, timerInt, seg=0;
async function iniciar(){
  if(stream) stream.getTracks().forEach(t=>t.stop());
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment', width:{ideal:1920}, height:{ideal:1080}}, audio:true});
  v.srcObject=stream; await v.play(); track=stream.getVideoTracks()[0];
  document.getElementById('msg').innerText='P30 PODEROSA lista - 1.4MB→6MB en 1 seg';
}
iniciar();

function tomarPoderosa(){
  let msg=document.getElementById('msg');
  msg.innerText='Procesando PODEROSA x2...';
  let w=v.videoWidth, h=v.videoHeight;
  let c1=document.createElement('canvas'); c1.width=w; c1.height=h;
  let ctx1=c1.getContext('2d'); ctx1.drawImage(v,0,0,w,h);

  // PODEROSA REAL SIN ESRGAN: x2 Lanczos + sharpen
  let c2=document.createElement('canvas'); c2.width=w*2; c2.height=h*2;
  let ctx2=c2.getContext('2d');
  ctx2.imageSmoothingEnabled=true; ctx2.imageSmoothingQuality='high';
  ctx2.drawImage(c1,0,0,c2.width,c2.height);

  // Nitidez real
  ctx2.globalCompositeOperation='source-over';
  ctx2.filter='contrast(1.15) saturate(1.1) sharpen(1)';
  // Unsharp manual con 2 pasadas
  ctx2.globalAlpha=0.3;
  ctx2.drawImage(c2, -1, -1, c2.width, c2.height);
  ctx2.drawImage(c2, 1, 1, c2.width, c2.height);
  ctx2.globalAlpha=1;
  ctx2.filter='none';

  let url=c2.toDataURL('image/jpeg',0.94); // 0.94 = 6MB, 0.98 = 10MB
  let im=document.getElementById('outImg'); im.style.display='block'; im.src=url;
  document.getElementById('outVid').style.display='none';
  document.getElementById('down').href=url;
  document.getElementById('down').download='PASTEL-PODEROSA-'+c2.width+'x'+c2.height+'-6MB.jpg';
  document.getElementById('res').style.display='flex';
  let mb=((url.length*0.75)/1024/1024).toFixed(2);
  msg.innerText='PODEROSA '+c2.width+'x'+c2.height+' '+mb+'MB ✓ Sin rayas';
}

function toggleVideo(){
  let btn=document.getElementById('btnVideo');
  if(!grabando){
    let chunks=[]; let mime='video/webm;codecs=vp9,opus'; if(!MediaRecorder.isTypeSupported(mime)) mime='video/webm';
    recorder=new MediaRecorder(stream,{mimeType:mime}); recorder.ondataavailable=e=>{ if(e.data.size>0) chunks.push(e.data); };
    recorder.onstop=()=>{
      let b=new Blob(chunks,{type:mime}); let url=URL.createObjectURL(b);
      document.getElementById('outImg').style.display='none'; let vv=document.getElementById('outVid'); vv.style.display='block'; vv.src=url; vv.play().catch(()=>{});
      document.getElementById('down').href=url; document.getElementById('down').download='video-'+Date.now()+'.webm';
      document.getElementById('res').style.display='flex';
    };
    recorder.start(100); grabando=true; btn.style.background='#f00'; btn.innerText='■';
  } else {
    recorder.stop(); grabando=false; btn.style.background='#222'; btn.innerText='🎥';
  }
}
</script>
</body>
</html>
