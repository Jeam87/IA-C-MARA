<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>P30 Pro Killer - Pro Photo</title>
<style>
 body{margin:0;background:#000;color:#fff;font-family:sans-serif;overflow:hidden}
 #out{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}
 #topBar{position:fixed;top:6px;left:0;right:0;z-index:20;display:flex;flex-direction:column;gap:5px;align-items:center}
.bar{display:flex;gap:4px;background:#000d;padding:5px 7px;border-radius:18px;border:1px solid #444;max-width:98vw;overflow-x:auto}
.btn{padding:5px 10px;border-radius:14px;border:1px solid #555;background:#222;color:#fff;font-size:10px;font-weight:bold}
.btn.active{background:#fff;color:#000}.btn.sony.active{background:#ff7800;color:#fff}.btn.leica.active{background:#e30613;color:#fff}
 #proPanel{position:fixed;right:6px;top:120px;z-index:20;background:#000c;padding:8px;border-radius:12px;width:140px}
 #proPanel label{font-size:9px;display:block;margin:6px 0 2px} #proPanel input{width:100%}
 #shutter{width:82px;height:82px;border-radius:50%;background:#fff;border:5px solid #fff8}
 #ui{position:fixed;bottom:0;left:0;right:0;padding:10px;background:linear-gradient(transparent,#000f);z-index:20}
</style>
</head>
<body>
<video id="cam" autoplay playsinline muted style="display:none"></video>
<canvas id="out"></canvas>
<div id="topBar">
  <div class="bar" id="colorBar">
    <button class="btn active" data-c="normal">NORMAL</button>
    <button class="btn sony active" data-c="sony_scine">SONY S-CINE</button>
    <button class="btn sony" data-c="sony_std">SONY STD</button>
    <button class="btn leica" data-c="leica_vivid">LEICA VIVID</button>
    <button class="btn leica" data-c="leica_auth">LEICA AUTH</button>
  </div>
  <div class="bar" id="lensBar"></div>
  <div class="bar"><button class="btn active" id="hdrBtn">HDR ON</button><button class="btn" id="proBtn">MODO PRO OFF</button><span id="res" style="font-size:9px;color:#0f0">...</span></div>
</div>
<div id="proPanel" style="display:none">
  <label>Exposición <span id="evV">0</span></label><input type="range" id="ev" min="-2" max="2" step="0.1" value="0">
  <label>Enfoque <span id="fV">Auto</span></label><input type="range" id="focus" min="0" max="100" value="50">
  <label>Nitidez Pro <span id="sV">70</span>%</label><input type="range" id="sharp" min="0" max="100" value="70">
  <label>Zoom</label><input type="range" id="zoom" min="1" max="10" step="0.1" value="1">
</div>
<div id="ui"><div style="display:flex;justify-content:space-around"><div style="width:50px"></div><button id="shutter"></button><button id="flip" style="width:46px;height:46px;border-radius:50%;background:#222;color:#fff;border:2px solid #fff">↻</button></div><p id="log" style="font-size:9px;color:#aaa;text-align:center"></p></div>
<script>
const video=document.getElementById('cam'), canvas=document.getElementById('out'), ctx=canvas.getContext('2d');
let stream, track, devices=[], color='sony_scine', hdrOn=true, proOn=false, curIdx=0, imageCapture=null;

async function init(){
  const tmp=await navigator.mediaDevices.getUserMedia({video:true}); tmp.getTracks().forEach(t=>t.stop());
  devices=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput');
  const bar=document.getElementById('lensBar'); bar.innerHTML='';
  devices.forEach((d,i)=>{ const b=document.createElement('button'); b.className='btn'+(i===0?' active':''); b.textContent=d.label.toLowerCase().includes('front')?'FRONTAL':`LENTE ${i+1}`; b.onclick=()=>start(d.deviceId,i); bar.appendChild(b); });
  start(devices[0]?.deviceId,0);
}
async function start(id, idx){
  if(idx!==undefined) curIdx=idx;
  if(stream) stream.getTracks().forEach(t=>t.stop());
  stream=await navigator.mediaDevices.getUserMedia({video:{deviceId:id?{exact:id}:undefined, width:{ideal:4000}, height:{ideal:3000}, advanced:[{focusMode:'continuous'}]}});
  video.srcObject=stream; track=stream.getVideoTracks()[0];
  try{ imageCapture=new ImageCapture(track); const caps=await imageCapture.getPhotoCapabilities(); document.getElementById('res').textContent=`${caps.imageWidth.max}x${caps.imageHeight.max}`; }catch{ document.getElementById('res').textContent='Foto Alta'; }
  await video.play(); canvas.width=video.videoWidth; canvas.height=video.videoHeight;
  loop();
}
function getFilter(){ if(color==='sony_scine') return 'contrast(1.08) saturate(0.95) brightness(1.04) sepia(0.03) hue-rotate(-3deg)'; if(color==='sony_std') return 'contrast(1.12) saturate(1.08) brightness(1.02)'; if(color==='leica_vivid') return 'contrast(1.35) saturate(1.65) brightness(1.08)'; if(color==='leica_auth') return 'contrast(1.22) saturate(0.9) brightness(1.02) sepia(0.06)'; return 'contrast(1.05) saturate(1.05)'; }
function loop(){ ctx.filter=getFilter(); ctx.drawImage(video,0,0,canvas.width,canvas.height); requestAnimationFrame(loop); }

// FOTO PRO REAL - NO SCREENSHOT
async function takeProPhoto(){
  const log=document.getElementById('log'); log.textContent='Tomando foto pro...';
  let blobs=[];
  try{
    if(!imageCapture) throw 'no capture';
    if(hdrOn){
      // HDR: 3 fotos como P30 Pro: subexpuesta, normal, sobreexpuesta
      for(let ev of [-0.7,0,0.7]){
        try{ await track.applyConstraints({advanced:[{exposureCompensation:ev}]}); }catch{}
        await new Promise(r=>setTimeout(r,150));
        const b=await imageCapture.takePhoto({imageWidth:3840}); blobs.push(b);
      }
      await track.applyConstraints({advanced:[{exposureCompensation:parseFloat(document.getElementById('ev').value)}]});
    }else{
      const b=await imageCapture.takePhoto({imageWidth:3840}); blobs=[b];
    }
  }catch{
    // Fallback si no hay ImageCapture (algunos Huawei no lo dejan)
    const c=document.createElement('canvas'); c.width=canvas.width; c.height=canvas.height; const f=c.getContext('2d'); f.filter=getFilter(); f.drawImage(canvas,0,0); const b=await new Promise(r=>c.toBlob(r,'image/jpeg',0.98)); blobs=[b];
  }

  // Fusion HDR + Sharpening Pro (como Sony)
  const img = await createImageBitmap(blobs[0]);
  const out=document.createElement('canvas'); out.width=img.width; out.height=img.height; const octx=out.getContext('2d');

  if(blobs.length===3 && hdrOn){
    // Fusion simple HDR: promedio + contraste local
    const imgs=await Promise.all(blobs.map(b=>createImageBitmap(b)));
    octx.filter=getFilter(); octx.drawImage(imgs[1],0,0); // base normal
    octx.globalAlpha=0.35; octx.drawImage(imgs[0],0,0); // sombras
    octx.globalAlpha=0.35; octx.drawImage(imgs[2],0,0); // luces
    octx.globalAlpha=1;
  }else{
    octx.filter=getFilter(); octx.drawImage(img,0,0);
  }

  // Nitidez Sony: unsharp mask
  const sharp=parseInt(document.getElementById('sharp').value);
  if(sharp>0){
    const tmp=document.createElement('canvas'); tmp.width=out.width; tmp.height=out.height; const tctx=tmp.getContext('2d');
    tctx.filter=`blur(${sharp/30}px)`; tctx.drawImage(out,0,0);
    octx.globalCompositeOperation='source-over'; octx.globalAlpha=sharp/100; octx.drawImage(out,0,0); // mezcla para detalle
    // Unsharp real
    octx.filter='none'; octx.globalAlpha=1; octx.globalCompositeOperation='overlay';
    octx.drawImage(out,0,0); // aumenta microcontraste
    octx.globalCompositeOperation='source-over';
  }

  // Marca Leica/Sony
  octx.filter='none'; octx.fillStyle='#fff'; octx.font=`bold ${out.width*0.022}px monospace`; octx.fillText(`${color.toUpperCase()} | ${new Date().toLocaleString()} | P30 PRO KILLER`, 30, out.height-30);

  const finalBlob=await new Promise(r=>out.toBlob(r,'image/jpeg',0.98));
  const a=document.createElement('a'); a.download=`PRO-${color}-${Date.now()}.jpg`; a.href=URL.createObjectURL(finalBlob); a.click();
  log.textContent=`Foto pro guardada: ${out.width}x${out.height} HDR:${hdrOn?'ON':'OFF'}`;
}

document.querySelectorAll('#colorBar.btn').forEach(b=>{ b.onclick=()=>{ document.querySelectorAll('#colorBar.btn').forEach(x=>x.classList.remove('active')); b.classList.add('active'); color=b.dataset.c; }; });
document.getElementById('lensBar').addEventListener('click',e=>{ if(e.target.classList.contains('btn')){ document.querySelectorAll('#lensBar.btn').forEach(x=>x.classList.remove('active')); e.target.classList.add('active'); } });
document.getElementById('hdrBtn').onclick=e=>{ hdrOn=!hdrOn; e.target.textContent=hdrOn?'HDR ON':'HDR OFF'; e.target.classList.toggle('active'); };
document.getElementById('proBtn').onclick=e=>{ proOn=!proOn; e.target.textContent=proOn?'MODO PRO ON':'MODO PRO OFF'; e.target.classList.toggle('active'); document.getElementById('proPanel').style.display=proOn?'block':'none'; };
document.getElementById('ev').oninput=async e=>{ document.getElementById('evV').textContent=e.target.value; try{ await track.applyConstraints({advanced:[{exposureCompensation:parseFloat(e.target.value)}]}); }catch{} };
document.getElementById('focus').oninput=async e=>{ document.getElementById('fV').textContent=e.target.value; try{ const d=e.target.value/100* (track.getCapabilities().focusDistance?.max||10); await track.applyConstraints({advanced:[{focusMode:'manual', focusDistance:d}]}); }catch{ try{ await track.applyConstraints({advanced:[{focusMode:'continuous'}]}); }catch{} } };
document.getElementById('sharp').oninput=e=>document.getElementById('sV').textContent=e.target.value;
document.getElementById('zoom').oninput=async e=>{ try{ await track.applyConstraints({advanced:[{zoom:parseFloat(e.target.value)}]}); }catch{} };
document.getElementById('flip').onclick=()=>{ curIdx=(curIdx+1)%devices.length; start(devices[curIdx].deviceId,curIdx); };
document.getElementById('shutter').onclick=takeProPhoto;
init();
</script>
</body>
</html>
