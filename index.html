<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Cam Pro Fix</title>
<style>
 *{touch-action:manipulation}
 body{margin:0;background:#000;color:#fff;font-family:sans-serif;overflow:hidden}
 #out{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
 #topBar{position:fixed;top:0;left:0;right:0;z-index:99;background:linear-gradient(#000f,#0000);padding:10px 5px 20px;pointer-events:auto}
.bar{display:flex;gap:6px;padding:6px;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch}
.bar::-webkit-scrollbar{display:none}
.btn{min-width:72px;height:36px;padding:0 12px;border-radius:18px;border:1px solid #fff4;background:#222;color:#fff;font-size:11px;font-weight:bold;pointer-events:auto}
.btn.active{background:#fff!important;color:#000!important;border-color:#fff}
.btn.sony.active{background:#ff7800!important;color:#fff!important}
.btn.leica.active{background:#e30613!important;color:#fff!important}
 #shutter{width:80px;height:80px;border-radius:50%;background:#fff;border:4px solid #fff8;z-index:99}
 #ui{position:fixed;bottom:0;left:0;right:0;z-index:99;display:flex;justify-content:space-around;align-items:center;padding:15px;background:linear-gradient(transparent,#000e);pointer-events:auto}
</style>
</head>
<body>
<video id="cam" autoplay playsinline muted style="display:none"></video>
<canvas id="out"></canvas>
<div id="topBar">
  <div class="bar" id="colorBar">
    <button class="btn active" data-c="normal">NORMAL</button>
    <button class="btn sony" data-c="sony_scine">SONY S-CINE</button>
    <button class="btn sony" data-c="sony_std">SONY STD</button>
    <button class="btn leica" data-c="leica_vivid">LEICA VIVID</button>
    <button class="btn leica" data-c="leica_auth">LEICA AUTH</button>
  </div>
  <div class="bar" id="lensBar"></div>
</div>
<div id="ui"><div style="width:50px"></div><button id="shutter"></button><button id="flip" style="width:48px;height:48px;border-radius:50%;background:#222;color:#fff;border:2px solid #fff">↻</button></div>

<script>
const video=document.getElementById('cam'), canvas=document.getElementById('out'), ctx=canvas.getContext('2d');
let stream, track, devices=[], color='normal', curIdx=0, imageCapture=null;

async function init(){
  const tmp=await navigator.mediaDevices.getUserMedia({video:true}); tmp.getTracks().forEach(t=>t.stop());
  devices=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput');
  const bar=document.getElementById('lensBar'); bar.innerHTML='';
  devices.forEach((d,i)=>{
    const b=document.createElement('button'); b.className='btn'+(i===0?' active':''); 
    b.textContent=d.label.toLowerCase().includes('front')?'FRONTAL':`LENTE ${i+1}`;
    b.addEventListener('touchend', (e)=>{ e.preventDefault(); start(d.deviceId,i); setActiveLens(i); });
    b.addEventListener('click', ()=>{ start(d.deviceId,i); setActiveLens(i); });
    bar.appendChild(b);
  });
  start(devices[0]?.deviceId,0);
}
function setActiveLens(i){ document.querySelectorAll('#lensBar .btn').forEach((x,idx)=>x.classList.toggle('active', idx===i)); }
async function start(id, idx){
  curIdx=idx||0;
  if(stream) stream.getTracks().forEach(t=>t.stop());
  // IMPORTANTE: 1280x720 para que no se trabe en tu P30 Pro
  stream=await navigator.mediaDevices.getUserMedia({video:{deviceId:id?{exact:id}:undefined, width:{ideal:1280}, height:{ideal:720}}});
  video.srcObject=stream; track=stream.getVideoTracks()[0];
  try{ imageCapture=new ImageCapture(track); }catch{}
  await video.play(); canvas.width=video.videoWidth; canvas.height=video.videoHeight;
  requestAnimationFrame(loop);
}
function getFilter(){
  if(color==='sony_scine') return 'contrast(1.08) saturate(0.95) brightness(1.04) sepia(0.03) hue-rotate(-3deg)';
  if(color==='sony_std') return 'contrast(1.12) saturate(1.08) brightness(1.02)';
  if(color==='leica_vivid') return 'contrast(1.35) saturate(1.65) brightness(1.08)';
  if(color==='leica_auth') return 'contrast(1.22) saturate(0.9) brightness(1.02) sepia(0.06)';
  return 'contrast(1.05) saturate(1.05)';
}
function loop(){ ctx.filter=getFilter(); ctx.drawImage(video,0,0,canvas.width,canvas.height); requestAnimationFrame(loop); }

// Botones color FIX - touch y click
document.querySelectorAll('#colorBar .btn').forEach(b=>{
  const fn=(e)=>{ e.preventDefault(); document.querySelectorAll('#colorBar .btn').forEach(x=>x.classList.remove('active')); b.classList.add('active'); color=b.dataset.c; };
  b.addEventListener('touchend', fn, {passive:false}); b.addEventListener('click', fn);
});

document.getElementById('flip').addEventListener('click', ()=>{
  curIdx=(curIdx+1)%devices.length; start(devices[curIdx].deviceId, curIdx); setActiveLens(curIdx);
});

document.getElementById('shutter').addEventListener('click', async ()=>{
  let blob;
  try{
    // Foto real en alta, no del preview borroso
    if(imageCapture) blob=await imageCapture.takePhoto();
    else throw 1;
  }catch{
    const c=document.createElement('canvas'); c.width=video.videoWidth; c.height=video.videoHeight;
    const f=c.getContext('2d'); f.filter=getFilter(); f.drawImage(video,0,0,c.width,c.height);
    blob=await new Promise(r=>c.toBlob(r,'image/jpeg',0.98));
  }
  // Aplicar filtro Sony/Leica final
  const img=await createImageBitmap(blob);
  const out=document.createElement('canvas'); out.width=img.width; out.height=img.height;
  const o=out.getContext('2d'); o.filter=getFilter(); o.drawImage(img,0,0);
  o.filter='none'; o.fillStyle='#fff'; o.font=`bold ${out.width*0.025}px Arial`; o.fillText(`${color.toUpperCase()}`, 20, out.height-20);
  out.toBlob(b=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=`PRO-${Date.now()}.jpg`; a.click(); }, 'image/jpeg', 0.98);
});

init();
</script>
</body>
</html>
