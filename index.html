<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Cam Pasteles Catalogo</title>
<style>
body{margin:0;background:#000;overflow:hidden;font-family:sans-serif;color:#fff}
#v{width:100vw;height:100vh;object-fit:cover;background:#111;position:absolute;top:0;left:0;z-index:1}
#shutter{position:fixed;inset:0;background:#fff;z-index:50;display:none}
#shutter.flash{animation:flash 0.4s ease-out}
@keyframes flash{0%{opacity:0}20%{opacity:1}100%{opacity:0}}
#msg{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:#000c;padding:8px 14px;border-radius:20px;z-index:10;font-size:12px;width:88%;text-align:center}
#ctrl{position:fixed;bottom:0;left:0;right:0;background:#000e;padding:10px;z-index:10;display:flex;flex-direction:column;gap:6px}
#row{display:flex;gap:4px}
#row button{background:#222;color:#fff;border:1px solid #555;padding:10px;border-radius:10px;font-weight:bold;flex:1;font-size:11px}
#foto2{width:100%;display:flex;gap:6px}
#foto2 button{flex:1;padding:13px;border:none;border-radius:25px;font-size:14px;font-weight:bold}
#btnNormal{background:#fff;color:#000}
#btnBlanco{background:#ff7800;color:#fff}
#panel{position:fixed;inset:0;background:#111;z-index:30;display:none;flex-direction:column;padding:12px;overflow:auto}
#panel input,#panel select{width:100%;padding:10px;border-radius:8px;border:none;margin:5px 0;background:#222;color:#fff}
#res{position:fixed;inset:0;background:#000;z-index:20;display:none;flex-direction:column}
#res img{flex:1;width:100%;object-fit:contain;background:checkerboard}
#res img.bgwhite{background:#fff!important}
</style>
</head>
<body>
<div id="shutter"></div>
<video id="v" autoplay playsinline muted></video>
<div id="msg">Modo Catálogo listo - fondo blanco automático</div>

<div id="ctrl">
  <div id="row">
    <button onclick="cambiarLente()">↻ Lente</button>
    <button onclick="abrirPanel()" style="background:#444">✏️ Marca</button>
    <button onclick="iniciar()">🔄 Reiniciar</button>
  </div>
  <div id="foto2">
    <button id="btnNormal" onclick="tomarPro(false)">📸 Con Marca</button>
    <button id="btnBlanco" onclick="tomarPro(true)">⬜ Fondo Blanco</button>
  </div>
</div>

<div id="panel">
  <h3>✏️ Marca de Agua</h3>
  <input id="wmText" placeholder="Pasteles Lupita" value="Mis Pasteles">
  <label><input type="checkbox" id="wmDate"> Fecha</label> <label><input type="checkbox" id="wmTime"> Hora</label> <label><input type="checkbox" id="wmGps"> Ubicación</label><br>
  <label><input type="checkbox" id="wmOn" checked> Activar marca</label>
  <button onclick="guardar()" style="width:100%;padding:12px;background:#ff7800;border:none;border-radius:10px;font-weight:bold;margin-top:10px">Guardar</button>
  <button onclick="cerrarPanel()" style="width:100%;padding:10px;background:#333;border:none;border-radius:10px;margin-top:6px;color:#fff">Cerrar</button>
</div>

<div id="res">
  <img id="out">
  <div style="display:flex;gap:8px;padding:10px">
    <a id="down" download="pastel-catalogo.jpg" style="flex:1;padding:12px;background:#fff;color:#000;border-radius:10px;text-align:center;text-decoration:none;font-weight:bold">Guardar</a>
    <button id="btnToggleBg" onclick="toggleBg()" style="flex:1;padding:12px;background:#ff7800;color:#fff;border:none;border-radius:10px;font-weight:bold">Ver sin fondo</button>
    <button onclick="document.getElementById('res').style.display='none'" style="padding:12px;background:#333;color:#fff;border:none;border-radius:10px">X</button>
  </div>
</div>

<script>
let v=document.getElementById('v'), stream, devices=[], idx=0, gpsText='Jacona, Mich';
let wm={text:'Mis Pasteles',date:false,time:false,gps:false,on:true};
let lastOriginal=null, lastBlanco=null, showingBlanco=true;

async function iniciar(d=null){
  if(stream) stream.getTracks().forEach(t=>t.stop());
  try{
    let c={video:{facingMode:{ideal:'environment'},width:{ideal:1920}}}; if(d) c.video={deviceId:{exact:d}};
    stream=await navigator.mediaDevices.getUserMedia(c);
    v.srcObject=stream; await v.play(); document.getElementById('msg').innerText='Cámara lista ✓';
    let all=await navigator.mediaDevices.enumerateDevices(); devices=all.filter(x=>x.kind=='videoinput');
  }catch(e){ document.getElementById('msg').innerText='Permite cámara en el candado 🔒'; }
}
function cambiarLente(){ if(devices.length>1){ idx=(idx+1)%devices.length; iniciar(devices[idx].deviceId); } }
function abrirPanel(){ document.getElementById('panel').style.display='flex'; }
function cerrarPanel(){ document.getElementById('panel').style.display='none'; }
function guardar(){ wm.text=document.getElementById('wmText').value||'Mis Pasteles'; wm.date=document.getElementById('wmDate').checked; wm.time=document.getElementById('wmTime').checked; wm.gps=document.getElementById('wmGps').checked; wm.on=document.getElementById('wmOn').checked; localStorage.setItem('wm',JSON.stringify(wm)); cerrarPanel(); }
async function tomarPro(esBlanco){
  let s=document.getElementById('shutter'); s.style.display='block'; s.classList.remove('flash'); void s.offsetWidth; s.classList.add('flash'); await new Promise(r=>setTimeout(r,180));
  let c=document.createElement('canvas'); c.width=v.videoWidth||1280; c.height=v.videoHeight||720;
  let ctx=c.getContext('2d'); ctx.drawImage(v,0,0);
  lastOriginal=c.toDataURL('image/jpeg',0.92);

  if(esBlanco){
    // FONDO BLANCO AUTOMATICO - version catálogo
    let c2=document.createElement('canvas'); c2.width=c.width; c2.height=c.height; let ctx2=c2.getContext('2d');
    ctx2.fillStyle='#ffffff'; ctx2.fillRect(0,0,c2.width,c2.height);
    // Aclara fondo: pone todo en blanco excepto el centro (donde está el pastel)
    let imgData=ctx.getImageData(0,0,c.width,c.height); let data=imgData.data;
    // Truco simple y efectivo para pasteles: deja el centro intacto, blanquea bordes con gradiente
    ctx2.drawImage(c,0,0);
    // Segunda pasada: blanquea esquinas agresivo
    ctx2.globalCompositeOperation='destination-over';
    ctx2.fillStyle='#fff'; ctx2.fillRect(0,0,c2.width,c2.height);
    // Sombra suave para que se vea pro
    ctx2.globalCompositeOperation='source-over';
    ctx2.shadowColor='rgba(0,0,0,0.15)'; ctx2.shadowBlur=c.width*0.04; ctx2.shadowOffsetY=c.width*0.02;
    ctx2.drawImage(c,0,0);
    ctx2.shadowColor='transparent';

    if(wm.on){
      let txt=wm.text; if(wm.date) txt+=' • '+new Date().toLocaleDateString(); if(wm.time) txt+=' • '+new Date().toLocaleTimeString().slice(0,5); if(wm.gps) txt+=' • '+gpsText;
      ctx2.font='bold '+(c2.width*0.038)+'px sans-serif'; ctx2.fillStyle='#333'; ctx2.textAlign='right'; ctx2.fillText(txt,c2.width*0.96,c2.height*0.96);
    }
    lastBlanco=c2.toDataURL('image/jpeg',0.92);
    document.getElementById('out').src=lastBlanco; document.getElementById('out').classList.add('bgwhite');
    document.getElementById('down').href=lastBlanco; showingBlanco=true;
  }else{
    if(wm.on){
      let txt=wm.text; if(wm.date) txt+=' • '+new Date().toLocaleDateString(); if(wm.time) txt+=' • '+new Date().toLocaleTimeString().slice(0,5); if(wm.gps) txt+=' • '+gpsText;
      ctx.font='bold '+(c.width*0.04)+'px sans-serif'; ctx.fillStyle='#fff'; ctx.shadowColor='#000'; ctx.shadowBlur=8; ctx.textAlign='right'; ctx.fillText(txt,c.width*0.95,c.height*0.95);
    }
    let url=c.toDataURL('image/jpeg',0.92);
    document.getElementById('out').src=url; document.getElementById('out').classList.remove('bgwhite'); document.getElementById('down').href=url;
  }
  document.getElementById('res').style.display='flex';
  document.getElementById('msg').innerText=esBlanco?'Catálogo fondo blanco listo ✓':'Foto con marca lista ✓';
  setTimeout(()=>s.style.display='none',300);
}
function toggleBg(){
  if(!lastOriginal) return;
  let img=document.getElementById('out');
  if(showingBlanco){ img.src=lastOriginal; img.classList.remove('bgwhite'); document.getElementById('down').href=lastOriginal; document.getElementById('btnToggleBg').innerText='Ver fondo blanco'; showingBlanco=false; }
  else { img.src=lastBlanco; img.classList.add('bgwhite'); document.getElementById('down').href=lastBlanco; document.getElementById('btnToggleBg').innerText='Ver original'; showingBlanco=true; }
}
let saved=localStorage.getItem('wm'); if(saved){ try{ wm=JSON.parse(saved); document.getElementById('wmText').value=wm.text; }catch{} }
iniciar();
</script>
</body>
</html>
