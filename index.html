<!DOCTYPE html><html lang="es"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Foto Pro V4.3 BASE BUENA + IA</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#000;overflow:hidden;font-family:system-ui;color:#fff;touch-action:none}
#v{width:100vw;height:100vh;object-fit:cover;position:fixed;inset:0;background:#111}
#cBg{width:100vw;height:100vh;object-fit:cover;position:fixed;inset:0;display:none}
#flash{position:fixed;inset:0;background:#fff;z-index:60;opacity:0;pointer-events:none;transition:opacity.12s}#flash.on{opacity:1}
#recDot{position:fixed;top:52px;left:50%;transform:translateX(-50%);z-index:11;background:#f00;color:#fff;padding:7px 18px;border-radius:22px;font-size:13px;font-weight:900;display:none;align-items:center;gap:8px}
#start{position:fixed;inset:0;background:#000;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:22px;text-align:center}
#start button{padding:18px;width:100%;background:#ff7800;color:#fff;border:none;border-radius:50px;font-size:18px;font-weight:900}#start button.sec{background:#222;border:1px solid #444}
#top{position:fixed;top:10px;left:10px;right:10px;z-index:10;background:#000c;padding:8px 12px;border-radius:20px;display:flex;justify-content:space-between;font-size:10px;border:1px solid #333}
#light{position:fixed;right:10px;top:50%;transform:translateY(-50%);z-index:10;background:#0008;padding:10px 6px;border-radius:25px;display:flex;flex-direction:column;align-items:center;gap:6px;border:1px solid #3336}
#light input{writing-mode:bt-lr;-webkit-appearance:slider-vertical;width:4px;height:80px;accent-color:#ff7800}
#zoomBar{position:fixed;left:50%;bottom:175px;transform:translateX(-50%);z-index:20;background:#000e;padding:7px 8px;border-radius:25px;display:flex;gap:6px;border:1px solid #444;pointer-events:auto;backdrop-filter:blur(10px)}
#zoomBar button{background:#222;color:#fff;border:1px solid #555;padding:7px 13px;border-radius:20px;font-size:12px;pointer-events:auto}#zoomBar button.active{background:#fff;color:#000;font-weight:900}#zoomBar button.ia{border-color:#00ff88}
#ctrl{position:fixed;bottom:0;left:0;right:0;z-index:10;padding:12px 14px 20px;background:linear-gradient(transparent,#000d 20%,#000 90%);pointer-events:none}
#mainRow{display:flex;align-items:center;justify-content:space-between;pointer-events:auto}
#shutter{width:86px;height:86px;border-radius:50%;background:#fff;border:5px solid #000;box-shadow:0 0 0 3px #fff;display:flex;align-items:center;justify-content:center;font-size:30px}#shutter.rec{background:#f00;animation:pulse.8s infinite}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(.92)}}
.btn{width:52px;height:52px;border-radius:50%;background:#ffffff18;border:1px solid #ffffff35;color:#fff;font-size:20px;pointer-events:auto}
#tools{position:fixed;left:10px;top:50%;transform:translateY(-50%);z-index:10;display:flex;flex-direction:column;gap:8px}
#tools button{width:44px;height:44px;border-radius:50%;background:#000a;border:1px solid #333;color:#fff;font-size:16px}
#focus{position:fixed;width:70px;height:70px;border:2px solid #ff0;border-radius:50%;pointer-events:none;z-index:10;display:none;transform:translate(-50%,-50%)}
#drawer{position:fixed;bottom:0;left:0;right:0;background:#161616fa;border-radius:28px 28px 0 0;z-index:30;padding:16px 16px 28px;transform:translateY(105%);transition:.32s;max-height:85vh;overflow:auto}#drawer.open{transform:translateY(0)}.label{font-size:11px;color:#ff7800;font-weight:800;margin:12px 0 6px;display:block}.inp{width:100%;padding:11px;border-radius:11px;background:#222;border:1px solid #333;color:#fff}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.chip{padding:8px 12px;border-radius:20px;border:1px solid #333;background:#222;color:#fff;font-size:11px;text-align:center}.chip.on{background:#fff;color:#000;font-weight:900}.chip.ia.on{background:#00ff88;color:#000}
#res{position:fixed;inset:0;background:#000;z-index:40;display:none;flex-direction:column}#res img,#res video{flex:1;width:100%;object-fit:contain;background:#111}
#aiStat{position:fixed;top:92px;right:12px;z-index:20;background:#222;color:#aaa;padding:4px 10px;border-radius:12px;font-size:9px;font-weight:900;border:1px solid #333}
</style>
</head><body>
<div id="flash"></div><div id="recDot">🔴 <span id="timer">00:00</span> • <span id="timerMb">0 MB</span></div>
<div id="start"><div style="font-size:46px">🍰</div><h2 style="margin:0">V4.3 BASE BUENA + IA</h2><p style="color:#0f0;font-size:11px">Tu V4.2 + guardado fix + IA fondo</p><button onclick="iniciar(false)">📷 PRENDER TRASERA</button><button onclick="iniciar(true)" class="sec">🤳 FRONTAL</button><p id="err" style="color:#ff6;font-size:11px"></p></div>
<video id="v" autoplay playsinline muted></video><canvas id="cBg"></canvas><div id="focus"></div>
<div id="top"><span id="info">-</span><span id="camLabel">-</span><span id="modeTxt" style="background:#fff;color:#000;padding:2px 9px;border-radius:10px;font-weight:900">FOTO</span></div>
<div id="tools"><button onclick="setFilter('none')">☀️</button><button onclick="setFilter('vivid')">🎨</button><button onclick="setFilter('warm')">🔥</button><button onclick="setFilter('bw')">⚫</button></div>
<div id="light"><span>☀️</span><input type="range" id="lightR" min="-2" max="2" step="0.1" value="0" oninput="applyLight()"><span>🌙</span></div>
<div id="zoomBar"><button onclick="setZ(0.6)">0.6x</button><button onclick="setZ(1)" id="b1" class="active">1x</button><button onclick="setZ(2)">2x</button><button onclick="setZ(5)">5x</button><button onclick="setZ(10)">10x</button></div>
<div id="ctrl"><div id="mainRow"><button class="btn" onclick="voltear()">🔄</button><div id="shutter" onclick="accion()">📸</div><button class="btn" onclick="toggle()">⚙️</button></div>
<div style="display:flex;justify-content:center;gap:8px;margin-top:12px;pointer-events:auto">
<button id="mf" onclick="setModo('foto')" style="background:#fff;color:#000;padding:7px 20px;border-radius:20px;border:none;font-weight:900;font-size:12px">FOTO</button>
<button id="mv" onclick="setModo('video')" style="background:#222;color:#fff;padding:7px 20px;border-radius:20px;border:1px solid #555;font-size:12px">VIDEO</button>
<button onclick="setRecorte()" id="recBtn" style="background:#222;color:#fff;padding:7px 14px;border-radius:20px;border:1px solid #555;font-size:12px">⬜ 1:1</button>
</div></div>
<div id="drawer"><div style="width:40px;height:5px;background:#444;border-radius:10px;margin:0 auto 12px"></div><h3 style="margin:0">⚙️ Config V4.3</h3><div id="aiStat">IA: cargando...</div>
<span class="label">CALIDAD</span><div class="grid2"><label style="display:flex;gap:8px;background:#ff780022;border:1px solid #ff7800;padding:10px;border-radius:12px;font-size:12px"><input type="checkbox" id="pngOn" checked> PNG 40MB</label><label style="display:flex;gap:8px;background:#222;border:1px solid #333;padding:10px;border-radius:12px;font-size:12px"><input type="checkbox" id="flashOn" checked> Flash</label></div>
<span class="label">FONDO IA REAL - se ve en vivo</span><div class="grid2"><button class="chip on" id="bg0" onclick="setBg('none')">Original</button><button class="chip ia" id="bg1" onclick="setBg('blur')">Blur IA</button><button class="chip ia" id="bg2" onclick="setBg('white')">Blanco IA</button><button class="chip ia" id="bg3" onclick="setBg('black')">Negro IA</button></div>
<span class="label">MARCA</span><input id="wm" class="inp" value="Foto Pro IA - Jacona"><div class="grid2"><input id="price" class="inp" value="$250"><input id="gps" class="inp" value="Jacona, Mich"></div><div id="camList" style="font-size:10px;color:#666;background:#111;padding:8px;border-radius:8px;margin-top:10px">-</div><button onclick="toggle()" style="width:100%;padding:14px;margin-top:14px;background:#fff;color:#000;border:none;border-radius:14px;font-weight:900">✅ CERRAR</button></div>
<div id="res"><img id="outImg" style="display:none"><video id="outVid" controls playsinline style="display:none"></video><div style="display:flex;gap:8px;padding:12px"><button id="dl" style="flex:1;padding:14px;background:#00ff88;color:#000;border-radius:14px;border:none;text-align:center;font-weight:900">💾 GUARDAR EN GALERIA</button><button onclick="cerrarRes()" style="flex:1;padding:14px;background:#222;color:#fff;border:none;border-radius:14px">Seguir</button></div><p id="resInfo" style="text-align:center;font-size:11px;color:#888"></p></div>
<script>
let v=document.getElementById('v'), cBg=document.getElementById('cBg'), ctxBg=cBg.getContext('2d'), stream, track, modo='foto', cams=[], camIndex=0, facingFront=false, recorder, chunks=[], isRec=false, curFilter='none', curBg='none', recorte='none', timerInt, sec=0, curZoom=1, lastDist=0, selfieSeg=null, lastMask=null, iaReady=false, lastUrl=null;
async function getCams(){ try{ let d=await navigator.mediaDevices.enumerateDevices(); cams=d.filter(x=>x.kind=='videoinput'); document.getElementById('camList').innerText=cams.map((c,i)=>{ let l=c.label.toLowerCase(); let n=l.includes('front')?'🤳 Frontal':l.includes('ultra')||l.includes('wide')?'🌄 0.6x Gran Angular':l.includes('tele')?'🔭 Tele':'📷 Trasera '+(i+1); return (i==camIndex?'▶ ':' ')+`[${i}] ${n} - ${c.label}`; }).join('\n'); }catch{} }
async function iniciar(wantFront){ facingFront=wantFront; try{ if(stream) stream.getTracks().forEach(t=>t.stop()); await getCams(); if(cams.length){ camIndex = wantFront? (cams.findIndex(c=>c.label.toLowerCase().includes('front'))>=0?cams.findIndex(c=>c.label.toLowerCase().includes('front')):0) : (cams.findIndex(c=>c.label.toLowerCase().includes('back'))>=0?cams.findIndex(c=>c.label.toLowerCase().includes('back')):cams.length-1); } let devId=cams[camIndex]?.deviceId; stream=await navigator.mediaDevices.getUserMedia({ video: devId? {deviceId:{exact:devId}, width:{ideal:1920}, height:{ideal:1080}} : {facingMode: wantFront?'user':'environment', width:{ideal:1920}, height:{ideal:1080}}, audio:true }); v.srcObject=stream; await v.play(); track=stream.getVideoTracks()[0]; document.getElementById('info').innerText=`${track.getSettings().width}x${track.getSettings().height}`; document.getElementById('camLabel').innerText=`CAM ${camIndex+1}/${cams.length}`; document.getElementById('start').style.display='none'; applyLight(); await getCams(); loadIA(); }catch(e){ document.getElementById('err').innerText=e.message; } }
async function voltear(){ if(!cams.length) await getCams(); camIndex=(camIndex+1)%(cams.length||2); try{ if(stream) stream.getTracks().forEach(t=>t.stop()); let devId=cams[camIndex]?.deviceId; stream=await navigator.mediaDevices.getUserMedia({ video: devId? {deviceId:{exact:devId}, width:{ideal:1920}, height:{ideal:1080}} : {facingMode:'environment', width:{ideal:1920}}, audio:true }); v.srcObject=stream; await v.play(); track=stream.getVideoTracks()[0]; document.getElementById('camLabel').innerText=`CAM ${camIndex+1}/${cams.length}`; curZoom=1; await getCams(); }catch{ await iniciar(!facingFront); } }
function loadIA(){ let sc=document.createElement('script'); sc.src='https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js'; sc.onload=()=>{ selfieSeg=new SelfieSegmentation({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${f}`}); selfieSeg.setOptions({modelSelection:0}); selfieSeg.onResults(r=>{ lastMask=r.segmentationMask; if(curBg!=='none') drawIA(); }); iaReady=true; document.getElementById('aiStat').innerText='IA REAL OK ✅ - Blur/Blanco/Negro recorta real'; document.getElementById('aiStat').style.color='#00ff88'; (function lp(){ if(iaReady && curBg!=='none') selfieSeg.send({image:v}).catch(()=>{}); setTimeout(()=>requestAnimationFrame(lp),160); })(); }; sc.onerror=()=>{ document.getElementById('aiStat').innerText='IA no cargó - funciona modo normal'; }; document.head.appendChild(sc); }
function drawIA(){ if(!v.videoWidth||!lastMask) return; cBg.width=v.videoWidth; cBg.height=v.videoHeight; cBg.style.display='block'; v.style.display='none'; ctxBg.clearRect(0,0,cBg.width,cBg.height); if(curBg=='white'){ ctxBg.fillStyle='#fff'; ctxBg.fillRect(0,0,cBg.width,cBg.height); }else if(curBg=='black'){ ctxBg.fillStyle='#111'; ctxBg.fillRect(0,0,cBg.width,cBg.height); }else{ ctxBg.filter='blur(22px)'; ctxBg.drawImage(v,0,0,cBg.width,cBg.height); ctxBg.filter='none'; } ctxBg.globalCompositeOperation='destination-in'; ctxBg.drawImage(lastMask,0,0,cBg.width,cBg.height); ctxBg.globalCompositeOperation='source-over'; let pc=document.createElement('canvas'); pc.width=cBg.width; pc.height=cBg.height; let px=pc.getContext('2d'); px.drawImage(lastMask,0,0,cBg.width,cBg.height); px.globalCompositeOperation='source-in'; px.drawImage(v,0,0,cBg.width,cBg.height); ctxBg.drawImage(pc,0,0); }
function drawNormal(){ cBg.style.display='none'; v.style.display='block'; }
function setModo(m){ modo=m; document.getElementById('mf').style.background=m=='foto'?'#fff':'#222'; document.getElementById('mf').style.color=m=='foto'?'#000':'#fff'; document.getElementById('mv').style.background=m=='video'?'#fff':'#222'; document.getElementById('mv').style.color=m=='video'?'#000':'#fff'; document.getElementById('modeTxt').innerText=m.toUpperCase(); if(m=='foto') drawNormal(); }
function setZ(z){ curZoom=parseFloat(z); try{ track.applyConstraints({advanced:[{zoom:curZoom}]});}catch{ v.style.transform=`scale(${1+(curZoom-1)*0.15})`; cBg.style.transform=`scale(${1+(curZoom-1)*0.15})`; } document.querySelectorAll('#zoomBar button').forEach(b=>b.classList.remove('active')); if(z==1) document.getElementById('b1').classList.add('active'); document.getElementById('camLabel').innerText=`ZOOM ${curZoom.toFixed(1)}x`; if(!isRec) setTimeout(()=>{ document.getElementById('camLabel').innerText=`CAM ${camIndex+1}/${cams.length}`; },1200); }
function applyLight(){ let b=1+parseFloat(document.getElementById('lightR').value)*0.3; v.style.filter=`brightness(${b}) ${curFilter=='vivid'?'saturate(1.6) contrast(1.1)':''} ${curFilter=='warm'?'sepia(0.3) saturate(1.4)':''} ${curFilter=='bw'?'grayscale(1)':''}`; cBg.style.filter=v.style.filter; }
function setFilter(f){ curFilter=f; applyLight(); }
function setBg(b){ curBg=b; document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on')); document.getElementById(b=='none'?'bg0':b=='blur'?'bg1':b=='white'?'bg2':'bg3').classList.add('on'); if(b=='none') drawNormal(); else if(iaReady) drawIA(); else { document.getElementById('aiStat').innerText='Cargando IA para fondo...'; } }
function setRecorte(){ let o=['none','1:1','4:5']; recorte=o[(o.indexOf(recorte)+1)%o.length]; document.getElementById('recBtn').innerText=recorte=='none'?'⬜ Orig':recorte; }
function toggle(){ document.getElementById('drawer').classList.toggle('open'); }
function cerrarRes(){ document.getElementById('res').style.display='none'; if(lastUrl) URL.revokeObjectURL(lastUrl); }
function doFlash(){ if(!document.getElementById('flashOn').checked) return; let f=document.getElementById('flash'); f.classList.add('on'); setTimeout(()=>f.classList.remove('on'),140); navigator.vibrate?.(60); }
v.addEventListener('click',e=>{ if(e.touches && e.touches.length>1) return; let f=document.getElementById('focus'); f.style.left=e.clientX+'px'; f.style.top=e.clientY+'px'; f.style.display='block'; setTimeout(()=>f.style.display='none',1000); try{ track.applyConstraints({advanced:[{pointsOfInterest:[{x:e.clientX/window.innerWidth,y:e.clientY/window.innerHeight}]}]});}catch{} });
v.addEventListener('touchstart',e=>{ if(e.touches.length==2){ lastDist=Math.hypot(e.touches[0].pageX-e.touches[1].pageX, e.touches[0].pageY-e.touches[1].pageY); } },{passive:false});
v.addEventListener('touchmove',e=>{ if(e.touches.length==2){ e.preventDefault(); let dist=Math.hypot(e.touches[0].pageX-e.touches[1].pageX, e.touches[0].pageY-e.touches[1].pageY); let diff=(dist-lastDist)*0.015; curZoom=Math.min(10,Math.max(0.6, curZoom+diff)); try{ track.applyConstraints({advanced:[{zoom:curZoom}]});}catch{ v.style.transform=`scale(${1+(curZoom-1)*0.15})`; cBg.style.transform=`scale(${1+(curZoom-1)*0.15})`; } document.getElementById('camLabel').innerText=`ZOOM ${curZoom.toFixed(1)}x`; lastDist=dist; } },{passive:false});
async function foto(){ doFlash(); let usePNG=document.getElementById('pngOn').checked, blob; let srcEl = (curBg!=='none' && iaReady && cBg.style.display!=='none')? cBg : v; try{ if(srcEl===v){ let ic=new ImageCapture(track); blob=await ic.takePhoto(); } else { throw 'use canvas'; } }catch{ let c=document.createElement('canvas'); c.width=(srcEl.videoWidth||srcEl.width||1280)*2; c.height=(srcEl.videoHeight||srcEl.height||720)*2; c.getContext('2d').drawImage(srcEl,0,0,c.width,c.height); blob=await new Promise(r=>c.toBlob(r,usePNG?'image/png':'image/jpeg',1.0)); } try{ let bmp=await createImageBitmap(blob); let c=document.createElement('canvas'); let tw=bmp.width, th=bmp.height; if(recorte=='1:1'){ let s=Math.min(bmp.width,bmp.height); tw=s; th=s; } if(recorte=='4:5'){ tw=bmp.width; th=bmp.width*1.25; if(th>bmp.height){ th=bmp.height; tw=th*0.8; } } c.width=tw; c.height=th; let ctx=c.getContext('2d'); ctx.filter='contrast(1.08) saturate(1.15)'; ctx.drawImage(bmp,(c.width-bmp.width)/2,(c.height-bmp.height)/2); ctx.filter='none'; ctx.font=`bold ${c.width*0.03}px system-ui`; ctx.fillStyle='#fff'; ctx.shadowColor='#000'; ctx.shadowBlur=10; ctx.textAlign='right'; ctx.fillText(document.getElementById('wm').value, c.width*0.97, c.height*0.96); ctx.font=`900 ${c.width*0.06}px system-ui`; ctx.fillStyle='#ff7800'; ctx.textAlign='left'; ctx.fillText(document.getElementById('price').value, c.width*0.03, c.height*0.93); blob=await new Promise(r=>c.toBlob(r,usePNG?'image/png':'image/jpeg',1.0)); }catch{} let url=URL.createObjectURL(blob); lastUrl=url; let mb=(blob.size/1024/1024).toFixed(2); document.getElementById('outImg').src=url; document.getElementById('outImg').style.display='block'; document.getElementById('outVid').style.display='none'; document.getElementById('resInfo').innerText=`${mb} MB • ${blob.type} • ${curBg!=='none'&&iaReady?'IA REAL':''}`; document.getElementById('res').style.display='flex'; }
function video(){ let sh=document.getElementById('shutter'), dot=document.getElementById('recDot'), t=document.getElementById('timer'), tm=document.getElementById('timerMb'); if(!isRec){ chunks=[]; recorder=new MediaRecorder(stream,{mimeType:'video/webm',videoBitsPerSecond:8000000}); recorder.ondataavailable=e=>{ chunks.push(e.data); tm.innerText=`${(chunks.reduce((a,b)=>a+b.size,0)/1024/1024).toFixed(1)} MB`; }; recorder.onstop=()=>{ let b=new Blob(chunks,{type:'video/webm'}); let u=URL.createObjectURL(b); lastUrl=u; document.getElementById('outVid').src=u; document.getElementById('outVid').style.display='block'; document.getElementById('outImg').style.display='none'; document.getElementById('res').style.display='flex'; }; recorder.start(200); isRec=true; sh.classList.add('rec'); sh.innerText='⬛'; dot.style.display='flex'; sec=0; t.innerText='00:00'; tm.innerText='0 MB'; timerInt=setInterval(()=>{ sec++; let m=String(Math.floor(sec/60)).padStart(2,'0'); let s=String(sec%60).padStart(2,'0'); t.innerText=`${m}:${s}`; document.getElementById('info').innerText=`● REC ${m}:${s} Z${curZoom.toFixed(1)}x`; },1000); }else{ recorder.stop(); isRec=false; sh.classList.remove('rec'); sh.innerText='📸'; dot.style.display='none'; clearInterval(timerInt); document.getElementById('info').innerText=`${track.getSettings().width}x${track.getSettings().height}`; } }
function accion(){ if(modo=='foto') foto(); else video(); }
// GUARDADO QUE SI JALA EN ANDROID - SHARE API
document.getElementById('dl').onclick=async()=>{
 if(!lastUrl) return;
 try{
  let blob=await fetch(lastUrl).then(r=>r.blob());
  let file=new File([blob], `foto_${Date.now()}.${blob.type.includes('video')?'webm':'jpg'}`, {type:blob.type});
  if(navigator.canShare && navigator.canShare({files:[file]})){
   await navigator.share({files:[file], title:'Foto Pro IA'});
   return;
  }
 }catch{}
 // fallback descarga
 let a=document.createElement('a'); a.href=lastUrl; a.download=`FOTO_${Date.now()}.${lastUrl.includes('video')?'webm':'jpg'}`; a.target='_blank'; document.body.appendChild(a); a.click(); a.remove();
 setTimeout(()=>{ window.open(lastUrl,'_blank'); },300);
};
</script></body></html>
