<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Camara</title>
<style>
body{margin:0;background:#000}
#v{position:fixed;top:0;left:0;width:100%;height:100%;object-fit:cover}
#b{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);width:70px;height:70px;background:white;border-radius:50%;border:4px solid #000;z-index:99}
#s{position:fixed;top:10px;left:10px;color:white;background:#0008;padding:5px 10px;border-radius:10px;z-index:99}
#fo{position:fixed;width:60px;height:60px;border:2px solid yellow;display:none;z-index:99;pointer-events:none}
</style>
</head>
<body>
<video id="v" autoplay playsinline></video>
<div id="fo"></div>
<div id="s">Tocá para enfocar</div>
<div id="b"></div>

<script>
let video=document.getElementById('v');
let stream, track;

async function inicia(){
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    video.srcObject=stream;
    track=stream.getVideoTracks()[0];
    await video.play();
    document.getElementById('s').innerText='Cámara lista';
  }catch(e){
    document.getElementById('s').innerText='Error: '+e.message+' - usa https';
    alert('Activa https:// en Vercel');
  }
}
inicia();

video.addEventListener('click', async(e)=>{
  let fo=document.getElementById('fo');
  fo.style.left=(e.clientX-30)+'px';
  fo.style.top=(e.clientY-30)+'px';
  fo.style.display='block';
  let x=e.clientX/window.innerWidth;
  let y=e.clientY/window.innerHeight;
  try{ await track.applyConstraints({advanced:[{focusMode:'continuous', pointsOfInterest:[{x:x,y:y}]}]}); }catch{}
  setTimeout(()=>fo.style.display='none',1500);
});

document.getElementById('b').onclick=()=>{
  let c=document.createElement('canvas');
  c.width=video.videoWidth;
  c.height=video.videoHeight;
  c.getContext('2d').drawImage(video,0,0);
  c.toBlob(blob=>{
    let url=URL.createObjectURL(blob);
    let a=document.createElement('a');
    a.href=url;
    a.download='foto.jpg';
    a.click();
    document.getElementById('s').innerText='Foto guardada!';
  },'image/jpeg',0.95);
};
</script>
</body>
</html>
