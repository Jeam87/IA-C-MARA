<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Camara - Detecta Escena</title>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.15.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
<style>
 body{margin:0;background:#000;overflow:hidden;font-family:sans-serif}
 #out{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}
 #tag{position:fixed;top:15px;left:50%;transform:translateX(-50%);background:#ffffffeb;color:#000;padding:6px 14px;border-radius:20px;font-size:13px;font-weight:bold;z-index:10;display:none}
 #lensBar{display:flex;gap:8px;justify-content:center;position:fixed;top:55px;left:0;right:0;z-index:10}
.lens{padding:6px 12px;border-radius:20px;background:#222c;color:#fff;border:1px solid #555;font-size:11px}
.lens.active{background:#fff;color:#000}
 #ui{position:fixed;bottom:0;left:0;right:0;padding:10px;background:linear-gradient(transparent,#000d);z-index:10}
 #controls{display:flex;align-items:center;justify-content:space-around}
 #shutter{width:78px;height:78px;border-radius:50%;background:#fff;border:4px solid #fff8}
</style>
</head>
<body>
<video id="cam" autoplay playsinline muted style="display:none"></video>
<canvas id="out"></canvas>
<div id="tag">Detectando...</div>
<div id="lensBar"></div>
<div id="ui">
  <div style="display:flex;gap:8px"><label style="color:#fff;font-size:11px;flex:1">Belleza <span id="bVal">50</span>%<input type="range" id="beauty" min="0" max="100" value="50"></label><label style="color:#fff;font-size:11px;flex:1">Zoom <span id="zVal">1x</span><input type="range" id="zoom" min="1" max="10" value="1"></label></div>
  <div id="controls"><div style="width:50px"></div><button id="shutter"></button><button id="flip" style="width:50px;height:50px;border-radius:50%;background:#222;color:#fff;border:2px solid #fff">↻</button></div>
</div>
<script>
const video=document.getElementById('cam'), canvas=document.getElementById('out'), ctx=canvas.getContext('2d'), tag=document.getElementById('tag');
let stream, track, devices=[], model=null, scene='normal', lastScene='';

async function init(){
  tag.style.display='block'; tag.textContent='Cargando IA de escena...';
  model = await cocoSsd.load({base:'lite_mobilenet_v2'}); // modelo liviano
  tag.textContent='IA lista!';
  setTimeout(()=>tag.style.display='none',1000);
  await navigator.mediaDevices.getUserMedia({video:true});
  devices = (await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput');
  const bar=document.getElementById('lensBar'); devices.forEach((d,i)=>{ const b=document.createElement('button'); b.className='lens'; b.textContent=d.label.includes('front')?'FRONTAL':`LENTE ${i}`; b.onclick=()=>start(d.deviceId); bar.appendChild(b); });
  start(devices[0]?.deviceId);
}
async function start(id){
  if(stream) stream.getTracks().forEach(t=>t.stop());
  stream = await navigator.mediaDevices.getUserMedia({video:{deviceId:id?{exact:id}:undefined}});
  video.srcObject=stream; track=stream.getVideoTracks()[0];
  await video.play(); canvas.width=video.videoWidth; canvas.height=video.videoHeight;
  requestAnimationFrame(loop);
}
let frame=0;
async function loop(){
  frame++;
  // Dibuja con filtro segun escena
  let f=''; const lv=beauty.value/100;
  if(scene==='flor' || scene==='potted plant') f=`contrast(1.2) saturate(1.8) brightness(1.1) hue-rotate(-10deg)`;
  else if(scene==='comida' || scene==='pizza' || scene==='cake' || scene==='sandwich') f=`contrast(1.25) saturate(1.6) brightness(1.12) sepia(0.15)`;
  else if(scene==='pelota' || scene==='sports ball') f=`contrast(1.3) saturate(1.7) brightness(1.15)`;
  else if(scene==='persona' || scene==='person') f=`contrast(${1+lv*0.1}) saturate(${1+lv*0.2}) brightness(${1+lv*0.1})`;
  else f=`contrast(1.15) saturate(1.3) brightness(1.05)`;
  ctx.filter=f; ctx.drawImage(video,0,0,canvas.width,canvas.height); ctx.filter='none';

  // Detecta cada 30 frames para no trabarse
  if(frame%30===0 && model){
    const preds = await model.detect(video);
    if(preds[0]){
      let obj = preds[0].class; // en ingles: person, potted plant, cake...
      // Traduccion rapida
      const mapa={ 'potted plant':'flor 🌸', 'person':'persona 👤', 'cat':'gato 🐱', 'dog':'perro 🐶', 'pizza':'comida 🍕', 'cake':'comida 🍰', 'sandwich':'comida 🥪', 'sports ball':'pelota ⚽', 'apple':'comida 🍎' };
      scene=obj; let nombre = mapa[obj] || obj;
      if(scene!==lastScene){ tag.style.display='block'; tag.textContent=`Detectado: ${nombre} - optimizando`; setTimeout(()=>tag.style.display='none',1500); lastScene=scene; }
    }
  }
  requestAnimationFrame(loop);
}
beauty.oninput=e=>bVal.textContent=e.target.value;
zoom.oninput=async e=>{ zVal.textContent=e.target.value+'x'; try{await track.applyConstraints({advanced:[{zoom:parseFloat(e.target.value)}]})}catch{}};
flip.onclick=()=>{
  const idx=devices.findIndex(d=>d.deviceId===stream.getVideoTracks()[0].getSettings().deviceId);
  start(devices[(idx+1)%devices.length].deviceId);
};
shutter.onclick=()=>{
  const c=document.createElement('canvas'); c.width=canvas.width; c.height=canvas.height; const f=c.getContext('2d'); f.filter=ctx.filter+' contrast(1.15)'; f.drawImage(canvas,0,0);
  const a=document.createElement('a'); a.download=`AI-${scene}-${Date.now()}.jpg`; a.href=c.toDataURL('image/jpeg',0.96); a.click();
};
init();
</script>
</body>
</html>
