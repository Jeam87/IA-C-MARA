<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/>
<title>Cam IA + ESRGAN</title>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/upscaler@1.29.2/dist/browser/umd/upscaler.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;overflow:hidden;font-family:sans-serif}
#video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.top{position:fixed;top:0;left:0;right:0;height:50px;background:#000;display:flex;justify-content:space-around;align-items:center;z-index:5;font-size:20px}
.modes{position:fixed;bottom:80px;left:0;right:0;display:flex;justify-content:space-around;z-index:5;font-size:12px;opacity:.8}
.modes.active{font-weight:bold;color:#fff;opacity:1}
.bot{position:fixed;bottom:0;left:0;right:0;height:80px;background:#000;display:flex;justify-content:space-around;align-items:center;z-index:5}
#shutter{width:68px;height:68px;background:#fff;border-radius:50%;border:4px solid #000}
#focus{position:fixed;width:70px;height:70px;border:2px solid yellow;border-radius:50%;display:none;z-index:10;pointer-events:none}
#loader{position:fixed;inset:0;background:#000d;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
#loader b{width:40px;height:40px;border:4px solid #fff3;border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#esrganToggle{position:fixed;bottom:210px;left:50%;transform:translateX(-50%);z-index:5;background:#ff7800;color:#fff;border:none;padding:7px 18px;border-radius:20px;font-weight:bold;font-size:12px}
</style>
</head>
<body>
<video id="video" autoplay playsinline></video>
<canvas id="canvas" style="display:none"></canvas>
<div id="focus"></div>
<div id="loader"><b></b><div>ESRGAN mejorando foto... 2-3 seg</div><div id="prog" style="font-size:11px;opacity:.7"></div></div>

<div class="top"><span>◎</span><span>AI ON</span><span>ESRGAN</span><span>⚙</span></div>
<button id="esrganToggle">ESRGAN: ON (2x)</button>
<div class="modes"><span>NOCHE</span><span>RETRATO</span><span class="active">FOTO</span><span>VIDEO</span></div>
<div class="bot"><div id="mini" style="width:44px;height:44px;border-radius:50%;background:#222"></div><div id="shutter"></div><div id="flip" style="width:44px;height:44px;border-radius:50%;border:1px solid #fff;display:flex;align-items:center;justify-content:center">↻</div></div>

<script>
const video=document.getElementById('video'), focus=document.getElementById('focus'), loader=document.getElementById('loader');
let stream,track,devs=[],idx=0,esrganOn=true;
const upscaler=new Upscaler({modelType:'esrgan-thick', modelScale:2}); // modelo 2x ligero

async function init(){
  const all=await navigator.mediaDevices.enumerateDevices(); devs=all.filter(d=>d.kind==='videoinput');
  openCam(devs[0]?.deviceId);
  document.getElementById('prog').textContent='Cargando IA...'; await upscaler.warmup([{patchSize:64}]); document.getElementById('prog').textContent='Lista';
  console.log('ESRGAN listo');
}
async function openCam(id){
  if(stream) stream.getTracks().forEach(t=>t.stop());
  stream=await navigator.mediaDevices.getUserMedia({video:{deviceId:id?{exact:id}:undefined, width:{ideal:1280}}});
  video.srcObject=stream; track=stream.getVideoTracks()[0]; await video.play();
}
init();

video.addEventListener('click', async(e)=>{
  const r=video.getBoundingClientRect(); const x=(e.clientX-r.left)/r.width; const y=(e.clientY-r.top)/r.height;
  focus.style.left=(e.clientX-35)+'px'; focus.style.top=(e.clientY-35)+'px'; focus.style.display='block';
  try{ await track.applyConstraints({advanced:[{focusMode:'continuous', pointsOfInterest:[{x,y}]}]});}catch{}
  setTimeout(()=>focus.style.display='none',1200);
});
document.getElementById('flip').onclick=()=>{ idx=(idx+1)%devs.length; openCam(devs[idx].deviceId); };
document.getElementById('esrganToggle').onclick=(e)=>{ esrganOn=!esrganOn; e.target.textContent=`ESRGAN: ${esrganOn?'ON (2x)':'OFF'}`; e.target.style.background=esrganOn?'#ff7800':'#444'; };

document.getElementById('shutter').onclick=async()=>{
  const c=document.getElementById('canvas'); c.width=video.videoWidth; c.height=video.videoHeight; c.getContext('2d').drawImage(video,0,0);

  if(!esrganOn){
    c.toBlob(b=>save(b), 'image/jpeg',0.95); return;
  }

  loader.style.display='flex';
  try{
    // Upscale con ESRGAN
    const upscaled=await upscaler.upscale(c); // devuelve canvas ya en 2x
    // Mejora color comida (quita amarillo)
    const ctx=upscaled.getContext('2d'); ctx.filter='contrast(1.08) saturate(1.18) brightness(1.05) hue-rotate(-5deg)';
    const final=document.createElement('canvas'); final.width=upscaled.width; final.height=upscaled.height;
    final.getContext('2d').drawImage(upscaled,0,0);

    final.toBlob(b=>{ save(b); loader.style.display='none'; }, 'image/jpeg',0.96);
  }catch(err){
    console.log(err); loader.style.display='none'; c.toBlob(b=>save(b),'image/jpeg',0.95);
  }
};

function save(blob){
  const url=URL.createObjectURL(blob);
  document.getElementById('mini').innerHTML=`<img src="${url}" style="width:100%;height:100%;border-radius:50%;object-fit:cover">`;
  const a=document.createElement('a'); a.href=url; a.download=`ESRGAN-${Date.now()}.jpg`; a.click();
}
</script>
</body>
</html>
