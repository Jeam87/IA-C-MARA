<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Foto Pro IA</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font-family:system-ui;overflow:hidden}
#v{width:100vw;height:100vh;object-fit:cover;position:fixed;inset:0;background:#111}
#start{position:fixed;inset:0;background:#000;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:22px;text-align:center}
button{font:inherit;cursor:pointer}.startbtn{padding:18px;width:100%;background:#ff7800;color:#fff;border:0;border-radius:50px;font-size:18px;font-weight:900}
#top{position:fixed;top:10px;left:10px;right:10px;z-index:10;background:#000c;padding:8px 12px;border-radius:20px;display:flex;justify-content:space-between;font-size:10px;border:1px solid #333}
#tools{position:fixed;left:10px;top:50%;transform:translateY(-50%);z-index:10;display:flex;flex-direction:column;gap:8px}
#tools button,.round{width:48px;height:48px;border-radius:50%;background:#000b;border:1px solid #555;color:#fff}
#zoomBar{position:fixed;left:50%;bottom:175px;transform:translateX(-50%);z-index:20;background:#000e;padding:7px;border-radius:25px;display:flex;gap:6px}
#zoomBar button{background:#222;color:#fff;border:1px solid #555;padding:7px 13px;border-radius:20px;font-size:12px}.active{background:#fff!important;color:#000!important;font-weight:900}
#ctrl{position:fixed;bottom:0;left:0;right:0;z-index:10;padding:12px 14px 20px;background:linear-gradient(transparent,#000d 20%,#000 90%)}
#mainRow{display:flex;align-items:center;justify-content:space-between}.shutter{width:86px;height:86px;border-radius:50%;background:#fff;border:5px solid #000;box-shadow:0 0 0 3px #fff;display:flex;align-items:center;justify-content:center;font-size:30px}
#drawer{position:fixed;bottom:0;left:0;right:0;background:#161616fa;border-radius:28px 28px 0 0;z-index:30;padding:16px 16px 28px;transform:translateY(105%);transition:.32s;max-height:88vh;overflow:auto}
#drawer.open{transform:translateY(0)}.label{font-size:11px;color:#ff7800;font-weight:800;margin:12px 0 6px;display:block}
.inp{width:100%;padding:11px;border-radius:11px;background:#222;border:1px solid #333;color:#fff}
#res{position:fixed;inset:0;background:#000;z-index:40;display:none;flex-direction:column}
#compare{position:relative;flex:1;overflow:hidden;background:#111}
#before,#after{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
#after{clip-path:inset(0 50% 0 0)}
#divider{position:absolute;top:0;bottom:0;left:50%;width:3px;background:#fff;z-index:3}
#handle{position:absolute;left:calc(50% - 23px);top:50%;width:46px;height:46px;border-radius:50%;background:#fff;color:#000;z-index:4;display:flex;align-items:center;justify-content:center;font-weight:900}
#aiPanel{padding:12px;background:#0c0c0c}.aiBtn{width:100%;padding:14px;border:0;border-radius:14px;background:#00e58b;color:#000;font-weight:900}
#status{text-align:center;color:#aaa;font-size:11px;margin:8px}.danger{background:#222;color:#fff;border:1px solid #555;padding:12px;border-radius:14px;width:100%}
</style>
</head>
<body>
<div id="start"><div style="font-size:46px">✨📷</div><h2 style="margin:0">FOTO PRO IA</h2>
<p style="color:#aaa;font-size:12px">Cámara + mejora por IA + comparación antes/después</p>
<button class="startbtn" onclick="iniciar(false)">📷 PRENDER TRASERA</button>
<button class="startbtn" style="background:#222;border:1px solid #555" onclick="iniciar(true)">🤳 FRONTAL</button>
<p id="err" style="color:#ffb84d;font-size:11px"></p></div>

<video id="v" autoplay playsinline muted></video>
<div id="top"><span id="info">-</span><span id="camLabel">-</span><span>FOTO PRO IA</span></div>
<div id="tools"><button onclick="setFilter('none')">☀️</button><button onclick="setFilter('vivid')">🎨</button><button onclick="setFilter('warm')">🔥</button><button onclick="setFilter('bw')">⚫</button></div>
<div id="zoomBar"><button onclick="setZ(1)" id="b1" class="active">1x</button><button onclick="setZ(2)">2x</button><button onclick="setZ(3)">3x</button><button onclick="setZ(5)">5x</button></div>
<div id="ctrl"><div id="mainRow">
<button class="round" onclick="voltear()">🔄</button><div class="shutter" onclick="foto()">📸</div><button class="round" onclick="toggle()">⚙️</button>
</div></div>

<div id="drawer"><div style="width:40px;height:5px;background:#444;border-radius:10px;margin:0 auto 12px"></div>
<h3 style="margin:0">⚙️ Configuración</h3>
<span class="label">MEJORA IA</span>
<p style="font-size:11px;color:#aaa">La mejora IA usa super-resolución real en servidor. El token nunca se guarda en este HTML.</p>
<label class="label">ESCALA IA</label>
<select id="scale" class="inp"><option value="x2">2x — Natural</option><option value="x4">4x — Máxima resolución</option></select>
<span class="label">MARCA</span><input id="wm" class="inp" value="Foto Pro IA">
<button onclick="toggle()" style="width:100%;padding:14px;margin-top:14px;background:#fff;color:#000;border:0;border-radius:14px;font-weight:900">✅ CERRAR</button>
</div>

<div id="res">
<div id="compare"><img id="before"><img id="after"><div id="divider"></div><div id="handle">↔</div></div>
<div id="aiPanel"><button class="aiBtn" id="aiBtn" onclick="mejorarIA()">✨ MEJORAR CON IA</button>
<div id="status">Desliza el círculo para comparar antes y después.</div>
<div style="display:flex;gap:8px"><button class="danger" onclick="guardar()">💾 GUARDAR</button><button class="danger" onclick="cerrarRes()">← SEGUIR</button></div></div>
</div>

<script>
let v=document.getElementById('v'),stream,track,cams=[],camIndex=0,curZoom=1,curFilter='none',originalBlob=null,aiBlob=null,aiUrl=null,drag=false;

async function getCams(){try{let d=await navigator.mediaDevices.enumerateDevices();cams=d.filter(x=>x.kind==='videoinput')}catch{}}
async function iniciar(front){
 try{
  if(stream)stream.getTracks().forEach(t=>t.stop());
  await getCams();
  let idx=front?cams.findIndex(c=>/front|facetime|user/i.test(c.label)):cams.findIndex(c=>/back|rear|environment/i.test(c.label));
  if(idx<0)idx=front?0:Math.max(0,cams.length-1);
  camIndex=idx; let dev=cams[camIndex]?.deviceId;
  stream=await navigator.mediaDevices.getUserMedia({video:dev?{deviceId:{exact:dev},width:{ideal:1920},height:{ideal:1080}}:{facingMode:front?'user':'environment',width:{ideal:1920},height:{ideal:1080}},audio:false});
  v.srcObject=stream;await v.play();track=stream.getVideoTracks()[0];
  info.innerText=`${track.getSettings().width||''}x${track.getSettings().height||''}`;
  camLabel.innerText=`CAM ${camIndex+1}/${cams.length||1}`;start.style.display='none';
 }catch(e){err.innerText=e.message}
}
async function voltear(){await getCams();if(!cams.length)return;camIndex=(camIndex+1)%cams.length;try{if(stream)stream.getTracks().forEach(t=>t.stop());let dev=cams[camIndex].deviceId;stream=await navigator.mediaDevices.getUserMedia({video:{deviceId:{exact:dev},width:{ideal:1920},height:{ideal:1080}},audio:false});v.srcObject=stream;await v.play();track=stream.getVideoTracks()[0];camLabel.innerText=`CAM ${camIndex+1}/${cams.length}`}catch(e){}}
function setZ(z){curZoom=z;try{track.applyConstraints({advanced:[{zoom:z}]})}catch{v.style.transform=`scale(${1+(z-1)*.15})`}document.querySelectorAll('#zoomBar button').forEach(x=>x.classList.remove('active'));document.getElementById('b'+z)?.classList.add('active')}
function setFilter(f){curFilter=f;let x='';if(f==='vivid')x='saturate(1.35) contrast(1.08)';if(f==='warm')x='sepia(.22) saturate(1.2)';if(f==='bw')x='grayscale(1)';v.style.filter=x}
function toggle(){drawer.classList.toggle('open')}
async function foto(){
 const c=document.createElement('canvas'),w=v.videoWidth||1920,h=v.videoHeight||1080;c.width=w;c.height=h;
 c.getContext('2d').drawImage(v,0,0,w,h);
 originalBlob=await new Promise(r=>c.toBlob(r,'image/jpeg',.96));
 before.src=URL.createObjectURL(originalBlob);after.removeAttribute('src');aiBlob=null;
 res.style.display='flex';status.innerText='Foto lista. Pulsa “MEJORAR CON IA”.';
}
async function mejorarIA(){
 if(!originalBlob)return;
 aiBtn.disabled=true;aiBtn.innerText='⏳ LA IA ESTÁ MEJORANDO...';status.innerText='Procesando imagen con super-resolución IA…';
 try{
  let fd=new FormData();fd.append('image',originalBlob,'foto.jpg');fd.append('scale',document.getElementById('scale').value);
  let r=await fetch('/api/enhance',{method:'POST',body:fd});let data=await r.json();if(!r.ok)throw new Error(data.error||'Error del servidor');
  let rr=await fetch(data.url);aiBlob=await rr.blob();if(aiUrl)URL.revokeObjectURL(aiUrl);aiUrl=URL.createObjectURL(aiBlob);after.src=aiUrl;setCompare(.5);
  status.innerText='✨ Mejora IA terminada. Desliza para comparar.';
 }catch(e){status.innerText='No se pudo ejecutar la IA: '+e.message}
 aiBtn.disabled=false;aiBtn.innerText='✨ MEJORAR CON IA';
}
function setCompare(p){p=Math.max(.03,Math.min(.97,p));after.style.clipPath=`inset(0 ${100-p*100}% 0 0)`;divider.style.left=(p*100)+'%';handle.style.left=`calc(${p*100}% - 23px)`}
compare.addEventListener('pointerdown',e=>{drag=true;setCompare((e.clientX-compare.getBoundingClientRect().left)/compare.clientWidth)});window.addEventListener('pointermove',e=>{if(drag)setCompare((e.clientX-compare.getBoundingClientRect().left)/compare.clientWidth)});window.addEventListener('pointerup',()=>drag=false);
function guardar(){let b=aiBlob||originalBlob;if(!b)return;let u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=`Foto_Pro_IA_${Date.now()}.${b.type.includes('png')?'png':'jpg'}`;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function cerrarRes(){res.style.display='none';if(aiUrl){URL.revokeObjectURL(aiUrl);aiUrl=null}aiBlob=null}
</script>
</body></html>
