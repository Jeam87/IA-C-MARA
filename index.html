<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<title>Camara Final</title>
<style>
*{margin:0;padding:0;box-sizing:border-box} body{background:#000;overflow:hidden}
#video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.top{position:fixed;top:0;left:0;right:0;height:50px;background:#000;display:flex;justify-content:space-around;align-items:center;z-index:5;color:#fff;font-size:20px}
.chip{position:fixed;bottom:210px;left:50%;transform:translateX(-50%);background:#000c;border:1px solid #fff8;color:#fff;padding:6px 18px;border-radius:20px;z-index:5;font-size:13px}
.zm{position:fixed;bottom:150px;left:50%;transform:translateX(-50%);z-index:5;color:#fff;display:flex;gap:15px;align-items:center}
.zm b{width:44px;height:44px;border-radius:50%;border:2px solid #fff;display:flex;align-items:center;justify-content:center;background:#0006}
.modes{position:fixed;bottom:80px;left:0;right:0;display:flex;justify-content:space-around;z-index:5;color:#fff;font-size:13px}
.modes.a{font-weight:bold}.modes.a::after{content:'';display:block;width:5px;height:5px;background:red;border-radius:50%;margin:4px auto 0}
.bot{position:fixed;bottom:0;left:0;right:0;height:80px;background:#000;display:flex;justify-content:space-around;align-items:center;z-index:5}
#shutter{width:68px;height:68px;background:#fff;border-radius:50%;border:3px solid #aaa}
#focus{position:fixed;width:70px;height:70px;border:2px solid yellow;border-radius:50%;z-index:10;display:none;pointer-events:none}
</style>
</head>
<body>
<video id="video" autoplay playsinline></video>
<div id="focus"></div>
<div class="top"><span>◎</span><span>AI</span><span>⚡</span><span>▭</span><span>⚙</span></div>
<div class="chip">🍴 COMIDA</div>
<div class="zm"><span>•</span><b>1x</b><span>• •</span></div>
<div class="modes"><span>NOCHE</span><span>RETRATO</span><span class="a">FOTO</span><span>VIDEO</span><span>PROFESIO</span></div>
<div class="bot"><div style="width:44px;height:44px;border-radius:50%;background:#333" id="mini"></div><div id="shutter"></div><div style="width:44px;height:44px;border-radius:50%;border:1px solid #fff;color:#fff;display:flex;align-items:center;justify-content:center" id="flip">↻</div></div>

<script>
const video=document.getElementById('video'), focus=document.getElementById('focus');
let stream, track, devs=[], idx=0;

async function start(){
  const all=await navigator.mediaDevices.enumerateDevices();
  devs=all.filter(d=>d.kind==='videoinput');
  openCam(devs[0]?.deviceId);
}
async function openCam(id){
  if(stream) stream.getTracks().forEach(t=>t.stop());
  stream=await navigator.mediaDevices.getUserMedia({video:{deviceId:id?{exact:id}:undefined}});
  video.srcObject=stream; track=stream.getVideoTracks()[0];
  await video.play();
}
start();

// TAP PARA ENFOCAR - FUNCION REAL
video.addEventListener('click', async(e)=>{
  const r=video.getBoundingClientRect();
  const x=(e.clientX-r.left)/r.width;
  const y=(e.clientY-r.top)/r.height;
  focus.style.left=(e.clientX-35)+'px'; focus.style.top=(e.clientY-35)+'px'; focus.style.display='block';
  try{ await track.applyConstraints({advanced:[{focusMode:'continuous', pointsOfInterest:[{x,y}]}]}); }catch(err){}
  setTimeout(()=>focus.style.display='none',1500);
});

document.getElementById('flip').onclick=()=>{
  idx=(idx+1)%devs.length; openCam(devs[idx].deviceId);
};

// FOTO SI FUNCIONA
document.getElementById('shutter').onclick=()=>{
  const c=document.createElement('canvas');
  c.width=video.videoWidth; c.height=video.videoHeight;
  c.getContext('2d').drawImage(video,0,0);
  c.toBlob(b=>{
    const url=URL.createObjectURL(b);
    document.getElementById('mini').innerHTML=`<img src="${url}" style="width:100%;height:100%;border-radius:50%;object-fit:cover">`;
    const a=document.createElement('a'); a.href=url; a.download='foto.jpg'; a.click();
  },'image/jpeg',0.95);
};
</script>
</body>
</html>
