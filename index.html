<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AI Camara Leica Edition</title>
<style>
 body{margin:0;background:#000;overflow:hidden;font-family:sans-serif}
 #out{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}
 #topBar{position:fixed;top:10px;left:0;right:0;display:flex;flex-direction:column;gap:6px;align-items:center;z-index:10}
 #leicaBar{display:flex;gap:6px;background:#000a;padding:6px 10px;border-radius:20px;border:1px solid #333}
.leicaBtn{padding:6px 12px;border-radius:15px;border:none;font-size:11px;font-weight:bold;background:#222;color:#fff}
.leicaBtn.active{background:#ff0000;color:#fff}
 #lensBar{display:flex;gap:6px}
.lens{padding:5px 10px;border-radius:15px;background:#000a;color:#fff;border:1px solid #555;font-size:10px}
.lens.active{background:#fff;color:#000}
 #tag{position:fixed;top:90px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:4px 12px;border-radius:15px;font-size:12px;z-index:10;display:none}
 #ui{position:fixed;bottom:0;left:0;right:0;padding:10px;background:linear-gradient(transparent,#000e);z-index:10}
 #controls{display:flex;justify-content:space-around;align-items:center}
 #shutter{width:80px;height:80px;border-radius:50%;background:#fff;border:4px solid #fff8}
</style>
</head>
<body>
<video id="cam" autoplay playsinline muted style="display:none"></video>
<canvas id="out"></canvas>
<div id="topBar">
  <div id="leicaBar">
    <button class="leicaBtn active" data-mode="normal">NORMAL</button>
    <button class="leicaBtn" data-mode="vivid">LEICA VIVID</button>
    <button class="leicaBtn" data-mode="auth">LEICA AUTH</button>
  </div>
  <div id="lensBar"></div>
</div>
<div id="tag"></div>
<div id="ui">
  <div style="display:flex;gap:10px"><label style="color:#fff;font-size:11px;flex:1">Belleza <span id="bVal">50</span>%<input type="range" id="beauty" min="0" max="100" value="50"></label><label style="color:#fff;font-size:11px;flex:1">Zoom <span id="zVal">1x</span><input type="range" id="zoom" min="1" max="8" value="1"></label></div>
  <div id="controls"><div style="width:50px"></div><button id="shutter"></button><button id="flip" style="width:50px;height:50px;border-radius:50%;background:#222;color:#fff;border:2px solid #fff">↻</button></div>
  <p style="color:#aaa;font-size:10px;text-align:center;margin:4px 0 0">Modo Leica inspirado en Huawei x Leica</p>
</div>
<script>
const video=document.getElementById('cam'), canvas=document.getElementById('out'), ctx=canvas.getContext('2d'), tag=document.getElementById('tag');
let stream, track, devices=[], leicaMode='normal';

async function init(){
  await navigator.mediaDevices.getUserMedia({video:true});
  devices=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput');
  const bar=document.getElementById('lensBar');
  devices.forEach((d,i)=>{ const b=document.createElement('button'); b.className='lens'+(i==0?' active':''); b.textContent=d.label.toLowerCase().includes('front')?'FRONTAL':`LENTE ${i+1}`; b.onclick=()=>start(d.deviceId,i); bar.appendChild(b); });
  start(devices[0]?.deviceId,0);
}
async function start(id, idx){
  if(stream) stream.getTracks().forEach(t=>t.stop());
  stream=await navigator.mediaDevices.getUserMedia({video:{deviceId:id?{exact:id}:undefined}});
  video.srcObject=stream; track=stream.getVideoTracks()[0];
  document.querySelectorAll('.lens').forEach((b,i)=>b.classList.toggle('active',i===idx));
  await video.play(); canvas.width=video.videoWidth; canvas.height=video.videoHeight; requestAnimationFrame(draw);
}
function getLeicaFilter(){
  const b=beauty.value/100;
  if(leicaMode==='vivid'){
    // Rojo Leica profundo, contraste alto, viñeteo
    return `contrast(1.38) saturate(1.65) brightness(1.08) sepia(0.04) hue-rotate(-4deg)`;
  }else if(leicaMode==='auth'){
    // Leica Authentic: colores reales, piel no amarilla, sombras con detalle
    return `contrast(1.22) saturate(0.92) brightness(1.02) sepia(0.06)`;
  }else{
    return `contrast(${1+b*0.1}) saturate(${1+b*0.25}) brightness(${1+b*0.08})`;
  }
}
function draw(){
  ctx.filter=getLeicaFilter();
  ctx.drawImage(video,0,0,canvas.width,canvas.height);
  // Viñeteo Leica caracteristico
  if(leicaMode!=='normal'){
    const grad=ctx.createRadialGradient(canvas.width/2,canvas.height/2,canvas.width*0.4,canvas.width/2,canvas.height/2,canvas.width);
    grad.addColorStop(0,'transparent'); grad.addColorStop(1, leicaMode==='vivid'?'rgba(0,0,0,0.35)':'rgba(0,0,0,0.25)');
    ctx.filter='none'; ctx.fillStyle=grad; ctx.fillRect(0,0,canvas.width,canvas.height);
  }
  requestAnimationFrame(draw);
}
// Cambio de modo Leica
document.querySelectorAll('.leicaBtn').forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll('.leicaBtn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active'); leicaMode=btn.dataset.mode;
    tag.style.display='block'; tag.textContent= leicaMode==='vivid'?'LEICA VIVID: Colores intensos':'LEICA AUTHENTIC: Tonos reales';
    if(leicaMode==='normal') tag.textContent='MODO NORMAL';
    setTimeout(()=>tag.style.display='none',1500);
  };
});
beauty.oninput=e=>bVal.textContent=e.target.value;
zoom.oninput=async e=>{ zVal.textContent=e.target.value+'x'; try{await track.applyConstraints({advanced:[{zoom:parseFloat(e.target.value)}]})}catch{} };
flip.onclick=()=>{ const cur=stream.getVideoTracks()[0].getSettings().deviceId; let i=devices.findIndex(d=>d.deviceId===cur); start(devices[(i+1)%devices.length].deviceId,(i+1)%devices.length); };
shutter.onclick=()=>{
  const c=document.createElement('canvas'); c.width=canvas.width; c.height=canvas.height; const f=c.getContext('2d');
  f.filter=getLeicaFilter()+' contrast(1.1)'; f.drawImage(canvas,0,0);
  // Marca de agua estilo Leica
  if(leicaMode!=='normal'){ f.filter='none'; f.fillStyle='#fff'; f.font=`bold ${c.width*0.03}px monospace`; f.fillText(`LEICA ${leicaMode.toUpperCase()} | ${new Date().toLocaleTimeString()}`,20,c.height-20); }
  const a=document.createElement('a'); a.download=`LEICA-${leicaMode}-${Date.now()}.jpg`; a.href=c.toDataURL('image/jpeg',0.97); a.click();
};
init();
</script>
</body>
</html>
