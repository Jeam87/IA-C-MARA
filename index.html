<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<title>P30 Pro - Mejorada</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#000;font-family:sans-serif;overflow:hidden;color:#fff}
#cam{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}
.top{position:fixed;top:0;left:0;right:0;height:52px;background:#000;display:flex;justify-content:space-around;align-items:center;z-index:10}
.top span{font-size:22px;opacity:.9}
.chip{position:fixed;bottom:200px;left:50%;transform:translateX(-50%);background:#000a;border:1px solid #fff;padding:6px 18px;border-radius:20px;font-size:13px;z-index:10;display:flex;gap:8px;align-items:center;backdrop-filter:blur(6px)}
.zoom{position:fixed;bottom:145px;left:50%;transform:translateX(-50%);display:flex;gap:18px;align-items:center;z-index:10}
.zoom b{width:46px;height:46px;border-radius:50%;border:2px solid #fff;display:flex;align-items:center;justify-content:center;background:#0006;font-size:14px}
.modes{position:fixed;bottom:78px;left:0;right:0;display:flex;justify-content:space-around;z-index:10;font-size:14px;letter-spacing:1px}
.modes div{opacity:.6}.modes div.active{opacity:1;font-weight:bold}.modes div.active::after{content:'';display:block;width:6px;height:6px;background:#f00;border-radius:50%;margin:4px auto 0}
.bottom{position:fixed;bottom:0;left:0;right:0;height:78px;background:#000;display:flex;justify-content:space-around;align-items:center;z-index:10}
#shutter{width:68px;height:68px;background:#fff;border-radius:50%;border:4px solid #fff3}
.thumb{width:46px;height:46px;border-radius:50%;background:#222;overflow:hidden;border:2px solid #fff6}
.thumb img{width:100%;height:100%;object-fit:cover}
#focusBox{position:fixed;width:64px;height:64px;border:1.5px solid #ffeb00;border-radius:50%;display:none;z-index:20;pointer-events:none}
#focusBox::before{content:'';position:absolute;inset:-1px;border:1px solid #0005;border-radius:50%}
</style>
</head>
<body>
<video id="camV" autoplay playsinline muted style="display:none"></video>
<canvas id="cam"></canvas>
<div class="top"><span>◉</span><span>AI</span><span>⚡✕</span><span>▭</span><span>⚙</span></div>
<div class="chip">🍴 COMIDA X</div>
<div class="zoom"><span>•</span><b>1x</b><span>• •</span></div>
<div id="focusBox"></div>
<div class="modes"><div>NOCHE</div><div>RETRATO</div><div class="active">FOTO</div><div>VIDEO</div><div>PROFESIO</div></div>
<div class="bottom"><div class="thumb" id="thumb"></div><div id="shutter"></div><div style="width:46px;height:46px;border-radius:50%;border:2px solid #fff;display:flex;align-items:center;justify-content:center">⇄</div></div>

<script>
const video=document.getElementById('camV'), canvas=document.getElementById('cam'), ctx=canvas.getContext('2d'), focusBox=document.getElementById('focusBox');
let stream,track,imageCapture;

async function init(){
  stream=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:1920},height:{ideal:1080}, facingMode:'environment'}});
  video.srcObject=stream; track=stream.getVideoTracks()[0];
  try{ imageCapture=new ImageCapture(track); }catch{}
  await video.play(); canvas.width=video.videoWidth; canvas.height=video.videoHeight;
  loop();
}
function loop(){
  // MEJORA: corrige el amarillo de tu foto original + más nitidez
  ctx.filter='contrast(1.08) saturate(1.15) brightness(1.08) hue-rotate(-4deg)'; // quita amarillo
  ctx.drawImage(video,0,0,canvas.width,canvas.height);
  requestAnimationFrame(loop);
}

// TAP PARA ENFOCAR COMO P30 ORIGINAL
canvas.addEventListener('click', async(e)=>{
  const r=canvas.getBoundingClientRect(); const x=(e.clientX-r.left)/r.width; const y=(e.clientY-r.top)/r.height;
  focusBox.style.left=(e.clientX-32)+'px'; focusBox.style.top=(e.clientY-32)+'px'; focusBox.style.display='block';
  try{ await track.applyConstraints({advanced:[{focusMode:'continuous', pointsOfInterest:[{x,y}]}]});}catch{}
  setTimeout(()=>focusBox.style.display='none',1500);
});

// FOTO MEJORADA - ALTA RESOLUCIÓN + PROCESADO COMIDA PRO
document.getElementById('shutter').onclick=async()=>{
  let blob;
  try{ blob=await imageCapture.takePhoto({imageWidth:4000}); }catch{
    const tmp=document.createElement('canvas'); tmp.width=canvas.width; tmp.height=canvas.height;
    const tctx=tmp.getContext('2d'); tctx.filter=ctx.filter; tctx.drawImage(canvas,0,0);
    blob=await new Promise(r=>tmp.toBlob(r,'image/jpeg',0.98));
  }
  // Post-proceso tipo Leica COMIDA
  const img=await createImageBitmap(blob);
  const out=document.createElement('canvas'); out.width=img.width; out.height=img.height; const o=out.getContext('2d');
  o.filter='contrast(1.12) saturate(1.25) brightness(1.06) hue-rotate(-6deg) sharpness'; o.drawImage(img,0,0);
  // un poco de sharpen suave
  o.filter='none'; o.globalAlpha=0.18; o.globalCompositeOperation='overlay'; o.drawImage(out,0,0); o.globalAlpha=1; o.globalCompositeOperation='source-over';

  const final=await new Promise(r=>out.toBlob(r,'image/jpeg',0.97));
  const url=URL.createObjectURL(final);
  document.getElementById('thumb').innerHTML=`<img src="${url}">`;
  const a=document.createElement('a'); a.href=url; a.download=`COMIDA-PRO-${Date.now()}.jpg`; a.click();
};
init();
</script>
</body>
</html>
