<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Cam Pasteles TOTAL FIX</title>
<style>
body{margin:0;background:#000;overflow:hidden;font-family:sans-serif;color:#fff}
#v{width:100vw;height:100vh;object-fit:cover;background:#111;position:absolute;top:0;left:0;z-index:1}
#start{position:fixed;inset:0;background:#000;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:15px;padding:20px;text-align:center}
#start button{padding:18px 25px;background:#ff7800;color:#fff;border:none;border-radius:30px;font-size:18px;font-weight:bold;width:90%}
#shutter{position:fixed;inset:0;background:#fff;z-index:50;display:none}
#msg{position:fixed;top:8px;left:50%;transform:translateX(-50%);background:#000c;padding:7px 12px;border-radius:20px;z-index:10;font-size:11px;width:90%;text-align:center}
#focus{position:fixed;width:85px;height:85px;border:2px solid #ff0;border-radius:50%;display:none;pointer-events:none;transform:translate(-50%,-50%);z-index:12;box-shadow:0 0 10px #ff08}
#light{position:fixed;right:8px;top:45%;transform:translateY(-50%);z-index:11;display:flex;flex-direction:column;align-items:center;gap:4px;background:#0008;padding:6px;border-radius:20px}
#light input{writing-mode:bt-lr;-webkit-appearance:slider-vertical;width:8px;height:90px}
#ctrl{position:fixed;bottom:0;left:0;right:0;background:#000e;padding:8px;z-index:10;display:flex;flex-direction:column;gap:6px}
#row{display:flex;gap:4px}
#row button{background:#222;color:#fff;border:1px solid #555;padding:9px;border-radius:10px;font-weight:bold;flex:1;font-size:11px}
#row button.active{background:#ff7800}
#mainBtns{display:flex;gap:6px}
#mainBtns button{flex:1;padding:13px;border:none;border-radius:25px;font-weight:bold;font-size:13px}
#btnFoto{background:#fff;color:#000}
#btnBlanco{background:#ff7800;color:#fff}
#panel{position:fixed;inset:0;background:#111;z-index:30;display:none;flex-direction:column;padding:12px;overflow:auto}
#panel input,#panel select{width:100%;padding:10px;border-radius:8px;border:none;margin:4px 0;background:#222;color:#fff}
#res{position:fixed;inset:0;background:#000;z-index:20;display:none;flex-direction:column}
#res img,#res video{flex:1;width:100%;object-fit:contain;background:#111}
#rec{position:fixed;top:45px;left:12px;background:#f00;width:10px;height:10px;border-radius:50%;display:none;z-index:11;animation:blink 1s infinite}
@keyframes blink{50%{opacity:0}}
</style>
</head>
<body>
<div id="start">
<h2 style="margin:0">🍰 Cam Pasteles PRO</h2>
<p>Tu Huawei bloquea inicio automático</p>
<button onclick="iniciarReal()">📷 PRENDER CÁMARA</button>
<p id="err" style="font-size:11px;color:#ff0"></p>
<p style="font-size:10px;color:#666">Si no prende: toca el candado 🔒 arriba -> Cámara -> Permitir</p>
</div>

<div id="shutter"></div><div id="rec"></div>
<video id="v" autoplay playsinline muted></video>
<div id="focus"></div>
<div id="msg">Esperando cámara...</div>

<div id="light">
<span>☀️</span><input type="range" min="-2" max="2" step="0.2" value="0" oninput="v.style.filter='brightness('+(1+parseFloat(this.value)*0.25)+')'"><span>🌙</span>
</div>

<div id="ctrl">
<div id="row">
<button id="mFoto" class="active" onclick="setMode('foto')">📸 Foto</button>
<button id="mVideo" onclick="setMode('video')">🎥 Video</button>
<button id="mPano" onclick="setMode('pano')">🌄 Pano</button>
<button onclick="cambiarLente()">↻ Lente</button>
<button onclick="abrirPanel()">✏️ Marca</button>
</div>
<div id="mainBtns">
<button id="btnFoto" onclick="accion()">📸 Tomar</button>
<button id="btnBlanco" onclick="tomarPro(true)">⬜ Fondo Blanco</button>
</div>
<div id="panoInfo" style="display:none;text-align:center;font-size:11px">Pano: <span id="pCount">0/3</span> - gira a la derecha</div>
</div>

<div id="panel">
<h3>✏️ Marca de Agua - Editable</h3>
<label>Nombre / Pastelería:</label>
<input id="wmText" placeholder="Ej: Pasteles Lupita Jacona" value="Mis Pasteles">
<label>Logo:</label>
<input type="file" id="logoFile" accept="image/*">
<label><input type="checkbox" id="wmDate" checked> Fecha</label><br>
<label><input type="checkbox" id="wmTime"> Hora</label><br>
<label><input type="checkbox" id="wmGps" checked> Ubicación (Jacona)</label><br>
<label><input type="checkbox" id="wmOn" checked> Activar marca</label>
<select id="wmPos"><option value="bottom-right">Abajo Derecha</option><option value="bottom-left">Abajo Izq</option><option value="top-right">Arriba Der</option><option value="center">Centro diagonal</option></select>
<select id="wmSize"><option value="small">Chico</option><option value="medium" selected>Mediano</option><option value="large">Grande</option></select>
<select id="wmColor"><option value="white">Blanco</option><option value="gold">Dorado</option><option value="pink">Rosa</option><option value="black">Negro</option></select>
<button onclick="guardar()" style="width:100%;padding:12px;background:#ff7800;border:none;border-radius:10px;font-weight:bold;margin-top:10px">Guardar y Cerrar</button>
<button onclick="cerrarPanel()" style="width:100%;padding:10px;background:#333;border:none;border-radius:10px;margin-top:6px;color:#fff">Cerrar</button>
<p id="gpsStatus" style="font-size:11px;color:#aaa"></p>
</div>

<div id="res"><img id="outImg"><video id="outVid" controls style="display:none"></video><div style="display:flex;gap:6px;padding:10px"><a id="down" download="pastel.jpg" style="flex:1;padding:12px;background:#fff;color:#000;border-radius:10px;text-align:center;text-decoration:none;font-weight:bold">Guardar</a><button onclick="document.getElementById('res').style.display='none'" style="flex:1;padding:12px;background:#333;color:#fff;border:none;border-radius:10px">Cerrar</button></div></div>

<script>
let v=document.getElementById('v'), stream, track, devices=[], idx=0, mode='foto', gpsText='Jacona, Mich', logoImg=null, wm={}, mediaRecorder, chunks=[], recording=false, panoImgs=[], facing='environment';

async function iniciarReal(){
  document.getElementById('err').innerText='Pidiendo cámara...';
  try{
    if(stream) stream.getTracks().forEach(t=>t.stop());
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:facing, width:{ideal:1920}}, audio:false});
    v.srcObject=stream; await v.play(); track=stream.getVideoTracks()[0];
    document.getElementById('start').style.display='none';
    let all=await navigator.mediaDevices.enumerateDevices(); devices=all.filter(x=>x.kind=='videoinput');
    document.getElementById('msg').innerText='Lista ✓ '+devices.length+' lentes - Toca pastel para enfocar';
  }catch(e){ document.getElementById('err').innerText='Error '+e.name+': Ve al candado 🔒 y permite cámara'; }
}

async function cambiarLente(){
  try{
    document.getElementById('msg').innerText='Cambiando lente...';
    if(stream) stream.getTracks().forEach(t=>t.stop());

    if(devices.length>1){
      // Si ya detectó varios, los cicla
      idx=(idx+1)%devices.length;
      stream = await navigator.mediaDevices.getUserMedia({video:{deviceId:{exact:devices[idx].deviceId}}, audio:false});
      document.getElementById('msg').innerText='Lente '+(idx+1)+'/'+devices.length+' ✓';
    }else{
      // Si no, alterna trasera/delantera (Huawei)
      facing = facing==='environment'?'user':'environment';
      try{
        stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{exact:facing}}, audio:false});
      }catch{
        stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:facing}, audio:false});
      }
      document.getElementById('msg').innerText=facing==='environment'?'Trasera ✓':'Delantera ✓';
    }
    v.srcObject=stream; await v.play(); track=stream.getVideoTracks()[0];
    let all=await navigator.mediaDevices.enumerateDevices(); devices=all.filter(x=>x.kind=='videoinput');
  }catch(e){ document.getElementById('msg').innerText='No se pudo cambiar: '+e.message; iniciarReal(); }
}

function setMode(m){
  mode=m; document.querySelectorAll('#row button').forEach(b=>b.classList.remove('active'));
  document.getElementById('m'+m.charAt(0).toUpperCase()+m.slice(1)).classList.add('active');
  document.getElementById('panoInfo').style.display=m=='pano'?'block':'none';
  document.getElementById('btnFoto').innerText=m=='foto'?'📸 Tomar':m=='video'?(recording?'⏹️ Parar':'🎥 Grabar'):'🌄 Foto 1/3';
  if(m!='pano'){ panoImgs=[]; let pc=document.getElementById('pCount'); if(pc) pc.innerText='0/3'; }
}
function abrirPanel(){ document.getElementById('panel').style.display='flex'; }
function cerrarPanel(){ document.getElementById('panel').style.display='none'; }
function guardar(){
  wm={text:document.getElementById('wmText').value||'Mis Pasteles', date:document.getElementById('wmDate').checked, time:document.getElementById('wmTime').checked, gps:document.getElementById('wmGps').checked, on:document.getElementById('wmOn').checked, pos:document.getElementById('wmPos').value, size:document.getElementById('wmSize').value, color:document.getElementById('wmColor').value};
  localStorage.setItem('wm',JSON.stringify(wm)); cerrarPanel(); obtenerGPS();
}
document.getElementById('logoFile').addEventListener('change',e=>{ let r=new FileReader(); r.onload=()=>{ localStorage.setItem('logo',r.result); logoImg=new Image(); logoImg.src=r.result; }; r.readAsDataURL(e.target.files[0]); });

function obtenerGPS(){
  if(!navigator.geolocation){ gpsText='Jacona, Mich'; return; }
  navigator.geolocation.getCurrentPosition(async p=>{
    try{ let res=await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${p.coords.latitude}&lon=${p.coords.longitude}&format=json`); let j=await res.json(); gpsText=(j.address.town||j.address.city||'Jacona')+', '+(j.address.state||'Mich'); }catch{ gpsText='Jacona, Mich'; }
    let g=document.getElementById('gpsStatus'); if(g) g.innerText=gpsText;
  },()=>{ gpsText='Jacona, Mich'; });
}

v.addEventListener('click', async e=>{
  let f=document.getElementById('focus'); f.style.left=e.clientX+'px'; f.style.top=e.clientY+'px'; f.style.display='block'; setTimeout(()=>f.style.display='none',1000);
  try{ let x=e.clientX/window.innerWidth, y=e.clientY/window.innerHeight; await track.applyConstraints({advanced:[{pointsOfInterest:[{x,y}], focusMode:'manual'}]}); setTimeout(()=>track.applyConstraints({advanced:[{focusMode:'continuous'}]}),800); }catch{}
  document.getElementById('msg').innerText='Enfoque tocado ✓';
});

function accion(){ if(mode=='foto') tomarPro(false); else if(mode=='video') toggleVideo(); else tomarPano(); }

async function tomarPro(esBlanco){
  let s=document.getElementById('shutter'); s.style.display='block'; await new Promise(r=>setTimeout(r,150)); s.style.display='none';
  let c=document.createElement('canvas'); c.width=v.videoWidth||1280; c.height=v.videoHeight||720; let ctx=c.getContext('2d'); ctx.drawImage(v,0,0);
  let sv=localStorage.getItem('wm'); if(sv) try{ wm=JSON.parse(sv);}catch{}
  let col={white:'#fff',gold:'#FFD700',pink:'#FF8FAB',black:'#222'}[wm.color||'white'];
  let fs={small:c.width*0.03,medium:c.width*0.04,large:c.width*0.055}[wm.size||'medium'];

  function build(){ let a=[]; if(wm.text) a.push('🍰 '+wm.text); if(wm.date) a.push(new Date().toLocaleDateString()); if(wm.time) a.push(new Date().toLocaleTimeString().slice(0,5)); if(wm.gps && gpsText) a.push(gpsText); return a.join(' • '); }

  if(esBlanco){
    let c2=document.createElement('canvas'); c2.width=c.width; c2.height=c.height; let ctx2=c2.getContext('2d');
    ctx2.fillStyle='#fff'; ctx2.fillRect(0,0,c2.width,c2.height); ctx2.shadowColor='rgba(0,0,0,0.18)'; ctx2.shadowBlur=c.width*0.05; ctx2.drawImage(c,0,0); ctx2.shadowColor='transparent';
    if(wm.on){ ctx2.font='bold '+fs+'px sans-serif'; ctx2.fillStyle='#333'; ctx2.textAlign='right'; ctx2.fillText(build(), c2.width*0.96, c2.height*0.96); if(logoImg) try{ ctx2.drawImage(logoImg,c2.width*0.82,c2.height*0.82,fs*2,fs*2);}catch{} }
    mostrar(c2.toDataURL('image/jpeg',0.92),'img');
  }else{
    if(wm.on){ ctx.font='bold '+fs+'px sans-serif'; ctx.fillStyle=col; ctx.shadowColor='#0008'; ctx.shadowBlur=6; ctx.textAlign=wm.pos&&wm.pos.includes('left')?'left':'right'; let x=ctx.textAlign=='right'?c.width*0.96:c.width*0.04; let txt=build(); let lines=txt.split(' • '); let y=c.height*0.96; lines.reverse().forEach(l=>{ ctx.fillText(l,x,y); y-=fs*1.3; }); if(logoImg) try{ ctx.shadowBlur=0; ctx.drawImage(logoImg,x-fs*2,y-fs*2,fs*2,fs*2);}catch{} }
    mostrar(c.toDataURL('image/jpeg',0.92),'img');
  }
}

function mostrar(url,t){
  document.getElementById('outImg').style.display=t=='img'?'block':'none'; document.getElementById('outVid').style.display=t=='img'?'none':'block';
  if(t=='img') document.getElementById('outImg').src=url; else document.getElementById('outVid').src=url;
  document.getElementById('down').href=url; document.getElementById('res').style.display='flex';
}

function toggleVideo(){
  if(!recording){
    document.getElementById('msg').innerText='Pidiendo micro...';
    navigator.mediaDevices.getUserMedia({video:{facingMode:facing}, audio:true}).then(s=>{
      stream=s; v.srcObject=s; track=s.getVideoTracks()[0]; chunks=[];
      mediaRecorder=new MediaRecorder(s); mediaRecorder.ondataavailable=e=>{ if(e.data.size>0) chunks.push(e.data); };
      mediaRecorder.onstop=()=>{ let blob=new Blob(chunks,{type:'video/webm'}); mostrar(URL.createObjectURL(blob),'vid'); document.getElementById('msg').innerText='Video listo ✓'; };
      mediaRecorder.start(); recording=true; document.getElementById('rec').style.display='block'; document.getElementById('btnFoto').innerText='⏹️ Parar Video'; document.getElementById('msg').innerText='🔴 Grabando... toca para parar';
    }).catch(e=>{ document.getElementById('msg').innerText='Sin micro: '+e.message; });
  }else{ try{ mediaRecorder.stop(); }catch{} recording=false; document.getElementById('rec').style.display='none'; document.getElementById('btnFoto').innerText='🎥 Grabar'; }
}

async function tomarPano(){
  let c=document.createElement('canvas'); c.width=v.videoWidth; c.height=v.videoHeight; c.getContext('2d').drawImage(v,0,0); panoImgs.push(c);
  document.getElementById('pCount').innerText=panoImgs.length+'/3'; document.getElementById('msg').innerText='Pano '+panoImgs.length+'/3 - gira un poco a la derecha';
  if(panoImgs.length<3){ document.getElementById('btnFoto').innerText='🌄 Foto '+(panoImgs.length+1)+'/3'; return; }
  let W=panoImgs[0].width*3, H=panoImgs[0].height; let f=document.createElement('canvas'); f.width=W; f.height=H; let ctx=f.getContext('2d');
  panoImgs.forEach((cc,i)=>ctx.drawImage(cc,i*cc.width,0)); mostrar(f.toDataURL('image/jpeg',0.9),'img'); panoImgs=[]; document.getElementById('btnFoto').innerText='🌄 Foto 1/3'; document.getElementById('pCount').innerText='0/3';
}

let sv=localStorage.getItem('wm'); if(sv){ try{ wm=JSON.parse(sv); document.getElementById('wmText').value=wm.text; document.getElementById('wmDate').checked=wm.date; document.getElementById('wmTime').checked=wm.time; document.getElementById('wmGps').checked=wm.gps; document.getElementById('wmOn').checked=wm.on; document.getElementById('wmPos').value=wm.pos; document.getElementById('wmSize').value=wm.size; document.getElementById('wmColor').value=wm.color; }catch{} }
let lg=localStorage.getItem('logo'); if(lg){ logoImg=new Image(); logoImg.src=lg; } obtenerGPS();
</script>
</body>
</html>
