<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Camara Pro Auto</title>
<style>
 body{margin:0;background:#000;overflow:hidden;font-family:sans-serif}
 #cam{display:none} #out{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}
 #focusBox{display:none;position:fixed;width:70px;height:70px;border:2px solid #ff0;border-radius:10px;z-index:20}
 #ui{position:fixed;bottom:0;left:0;right:0;padding:12px;background:linear-gradient(transparent,#000d);z-index:10}
 #lensBar{display:flex;gap:8px;justify-content:center;margin-bottom:8px;overflow-x:auto}
.lens{padding:7px 14px;border-radius:20px;background:#222;color:#fff;border:1px solid #555;font-size:12px;white-space:nowrap}
.lens.active{background:#fff;color:#000;font-weight:bold}
 #controls{display:flex;align-items:center;justify-content:space-around}
 #shutter{width:80px;height:80px;border-radius:50%;background:#fff;border:4px solid #fff8}
</style>
</head>
<body>
<video id="cam" autoplay playsinline muted></video>
<canvas id="out"></canvas>
<div id="focusBox"></div>
<div id="ui">
  <div id="lensBar"></div>
  <div style="display:flex;gap:10px"><label style="color:#fff;font-size:11px;flex:1">Belleza <span id="bVal">50</span>%<input type="range" id="beauty" min="0" max="100" value="50"></label><label style="color:#fff;font-size:11px;flex:1">Zoom <span id="zVal">1x</span><input type="range" id="zoom" min="1" max="10" step="0.1" value="1"></label></div>
  <div id="controls"><div style="width:50px"></div><button id="shutter"></button><button id="flip" style="width:50px;height:50px;border-radius:50%;background:#222;color:#fff;border:2px solid #fff">↻</button></div>
</div>
<script>
const video=document.getElementById('cam'), canvas=document.getElementById('out'), ctx=canvas.getContext('2d');
let stream, track, devices=[], backCams=[], frontCams=[], currentIdx=0;

async function init(){
  await navigator.mediaDevices.getUserMedia({video:true});
  const devs = await navigator.mediaDevices.enumerateDevices();
  devices = devs.filter(d=>d.kind==='videoinput');
  frontCams = devices.filter(d=>d.label.toLowerCase().includes('front') || d.label.toLowerCase().includes('frontal') || d.label.toLowerCase().includes('user'));
  backCams = devices.filter(d=>!frontCams.includes(d));
  if(frontCams.length===0 && devices.length>0){ // si no detecta por nombre, el primero es frontal
    frontCams=[devices[0]]; backCams=devices.slice(1);
  }
  if(backCams.length===0) backCams=devices; // fallback

  const bar=document.getElementById('lensBar'); bar.innerHTML='';
  devices.forEach((d,i)=>{
    const b=document.createElement('button'); b.className='lens';
    let txt=d.label; if(txt.toLowerCase().includes('front')) txt='FRONTAL';
    else if(i===1 || devices.length===2) txt = i===0?'FRONTAL':'TRASERA';
    else { if(backCams.indexOf(d)===0) txt='0.5x ULTRA'; else if(backCams.indexOf(d)===1) txt='1x'; else if(backCams.indexOf(d)===2) txt='3x TELE'; else txt=`LENTE ${i+1}`; }
    b.textContent=txt; b.onclick=()=>start(d.deviceId);
    bar.appendChild(b);
  });
  start(devices[0]?.deviceId);
}

async function start(deviceId){
  if(stream) stream.getTracks().forEach(t=>t.stop());
  stream = await navigator.mediaDevices.getUserMedia({video:{deviceId:deviceId?{exact:deviceId}:undefined}});
  video.srcObject=stream; track=stream.getVideoTracks()[0];
  currentIdx = devices.findIndex(d=>d.deviceId===deviceId); if(currentIdx<0) currentIdx=0;
  document.querySelectorAll('.lens').forEach((b,i)=>b.classList.toggle('active', i===currentIdx));
  const caps=track.getCapabilities(); if(caps.zoom){ zoom.min=caps.zoom.min; zoom.max=Math.min(caps.zoom.max,10); }
  await video.play(); canvas.width=video.videoWidth; canvas.height=video.videoHeight; requestAnimationFrame(draw);
}
function draw(){ const lv=beauty.value/100; ctx.filter=`contrast(${1+lv*0.1}) saturate(${1+lv*0.3}) brightness(${1+lv*0.1})`; ctx.drawImage(video,0,0,canvas.width,canvas.height); requestAnimationFrame(draw); }
beauty.oninput=e=>bVal.textContent=e.target.value;
zoom.oninput=async e=>{ zVal.textContent=parseFloat(e.target.value).toFixed(1)+'x'; if(track?.getCapabilities().zoom){ try{await track.applyConstraints({advanced:[{zoom:parseFloat(e.target.value)}]})}catch{}} };

// BOTON VUELTA AUTOMATICO
flip.onclick=()=>{
  const isFront = frontCams.some(d=>d.deviceId===devices[currentIdx]?.deviceId);
  if(isFront){
    // ir a la primera trasera
    const firstBack = backCams[0]; start(firstBack.deviceId);
  } else {
    // rotar entre traseras, si llega al final regresa a frontal
    const idxInBack = backCams.findIndex(d=>d.deviceId===devices[currentIdx]?.deviceId);
    if(idxInBack < backCams.length-1){ start(backCams[idxInBack+1].deviceId); }
    else { start(frontCams[0].deviceId); }
  }
};
out.onclick=async e=>{ const r=canvas.getBoundingClientRect(); const x=(e.clientX-r.left)/r.width, y=(e.clientY-r.top)/r.height; focusBox.style.left=e.clientX-35+'px'; focusBox.style.top=e.clientY-35+'px'; focusBox.style.display='block'; setTimeout(()=>focusBox.style.display='none',1000); try{ await track.applyConstraints({advanced:[{focusMode:'continuous', pointsOfInterest:[{x,y}]}]}); }catch{} };
shutter.onclick=()=>{ const c=document.createElement('canvas'); c.width=canvas.width; c.height=canvas.height; const f=c.getContext('2d'); f.filter='contrast(1.32) saturate(1.5) brightness(1.1) sharpen'; f.drawImage(canvas,0,0); f.globalCompositeOperation='overlay'; f.globalAlpha=0.28; f.drawImage(canvas,0,0); const a=document.createElement('a'); a.download=`AI-PRO-${Date.now()}.jpg`; a.href=c.toDataURL('image/jpeg',0.96); a.click(); };
init();
</script>
</body>
</html>
