<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Foto Pro IA</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:sans-serif;text-align:center}
video{width:100vw;height:100vh;object-fit:cover;position:fixed;top:0;left:0;background:#111}
#ui{position:fixed;bottom:20px;left:0;right:0;z-index:10;display:flex;justify-content:center;gap:20px;align-items:center}
#shutter{width:80px;height:80px;border-radius:50%;background:#fff;border:5px solid #000;box-shadow:0 0 0 3px #fff}
#msg{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#000d;padding:20px;border-radius:15px;z-index:20;width:85%}
button{padding:15px 25px;background:#ff7800;border:none;border-radius:30px;color:#fff;font-weight:bold;font-size:16px}
</style>
</head>
<body>
<video id="v" autoplay playsinline muted></video>
<div id="msg">
<h2>🍰 Foto Pro IA</h2>
<p id="txt">Toca PRENDER y dale Permitir</p>
<button onclick="prender()">📷 PRENDER CÁMARA</button>
<p id="err" style="color:#ff0;font-size:12px;margin-top:10px"></p>
</div>
<div id="ui" style="display:none">
<button onclick="location.reload()" style="background:#333">↻</button>
<div id="shutter" onclick="foto()"></div>
<button onclick="alert('Foto guardada en descargas')" style="background:#333">💾</button>
</div>
<canvas id="c" style="display:none"></canvas>
<script>
let v=document.getElementById('v'), stream;
async function prender(){
 let txt=document.getElementById('txt'), err=document.getElementById('err');
 txt.innerText='Pidiendo permiso...';
 try{
   // PRIMERO pedimos permiso simple, sin buscar lentes
   stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});
   v.srcObject=stream; await v.play();
   document.getElementById('msg').style.display='none';
   document.getElementById('ui').style.display='flex';
 }catch(e){
   console.log(e);
   err.innerHTML='Error: '+e.name+'<br>'+e.message+'<br><br>1. Si es NotAllowedError: Ve a Ajustes > Apps > Edge > Permisos > Cámara > Permitir<br>2. Si es NotFoundError: Tu Edge no ve cámara, prueba en Chrome normal';
   txt.innerText='No dio permiso';
   // intento 2 con user
   try{
     stream=await navigator.mediaDevices.getUserMedia({video:true});
     v.srcObject=stream; await v.play();
     document.getElementById('msg').style.display='none';
     document.getElementById('ui').style.display='flex';
   }catch(e2){ err.innerHTML+='<br>Segundo intento falló: '+e2.message; }
 }
}
function foto(){
 let c=document.getElementById('c'), x=c.getContext('2d');
 c.width=v.videoWidth; c.height=v.videoHeight;
 x.drawImage(v,0,0);
 let url=c.toDataURL('image/jpeg',0.95);
 let a=document.createElement('a'); a.href=url; a.download='pastel_'+Date.now()+'.jpg'; a.click();
 alert('✅ Foto guardada! Revisa tu galería/descargas');
}
</script>
</body>
</html>
