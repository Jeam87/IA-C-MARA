<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AI Camara Sony Edition - No Lag</title>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.15.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/body-pix@2.2.0/dist/body-pix.min.js"></script>
<style>
 body{margin:0;background:#000;overflow:hidden;font-family:sans-serif}
 #out{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}
 #topBar{position:fixed;top:8px;left:0;right:0;z-index:10;display:flex;flex-direction:column;gap:6px;align-items:center}
.bar{display:flex;gap:5px;background:#000a;padding:5px 8px;border-radius:20px;border:1px solid #333}
.btn{padding:6px 10px;border-radius:15px;border:none;font-size:10px;font-weight:bold;background:#222;color:#fff}
.btn.active{background:#fff;color:#000}.btn.sony.active{background:#ff7800;color:#fff}
 #focusBox{display:none;position:fixed;width:60px;height:60px;border:2px solid #ff7800;border-radius:50%;z-index:20}
 #ui{position:fixed;bottom:0;left:0;right:0;padding:8px;background:linear-gradient(transparent,#000e);z-index:10}
 #shutter{width:75px;height:75px;border-radius:50%;background:#fff;border:4px solid #fff8}
</style>
</head>
<body>
<video id="cam" autoplay playsinline muted style="display:none"></video>
<canvas id="out"></canvas>
<div id="focusBox"></div>
<div id="topBar">
  <div class="bar" id="colorBar">
    <button class="btn active" data-c="normal">NORMAL</button>
    <button class="btn sony" data-c="sony_scine">SONY S-CINE</button>
    <button class="btn sony" data-c="sony_std">SONY STD</button>
    <button class="btn sony" data-c="sony_vivid">SONY VIVID</button>
    <button class="btn" data-c="leica_vivid">LEICA VIV</button>
  </div>
  <div class="bar"><button class="btn" id="bokehBtn">RETRATO OFF</button><input type="range" id="bokeh" min="0" max="20" value="8" style="width:70px"><span id="fps" style="color:#0f0;font-size:10px;margin-left:6px">60fps</span></div>
</div>
<div id="ui">
  <div style="display:flex;gap:8px"><label style="color:#fff;font-size:10px;flex:1">Belleza <span id="bVal">40</span>%<input type="range" id="beauty" min="0" max="100" value="40"></label><label style="color:#fff;font-size:10px;flex:1">Zoom <span id="zVal">1x</span><input type="range" id="zoom" min="1" max="8" value="1"></label></div>
  <div style="display:flex;justify-content:space-around;margin-top:6px"><div style="width:50px"></div><button id="shutter"></button><button id="flip" style="width:48px;height:48px;border-radius:50%;background:#222;color:#fff;border:2px solid #fff">↻</button></div>
</div>
<script>
const video=document.getElementById('cam'), canvas=document.getElementById('out'), ctx=canvas.getContext('2d');
let stream, track, devices=[], color='normal', net=null, useBokeh=false, lastMask=null, lastSegTime=0;

async function init(){
  net = await bodyPix.load({architecture:'MobileNetV1', outputStride:16, multiplier:0.5, quantBytes:2}); // modelo ULTRA ligero
  await navigator.mediaDevices.getUserMedia({video:true});
  devices=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput');
  start(devices[0]?.deviceId);
}
async function start(id){
  if(stream) stream.getTracks().forEach(t=>t.stop());
  stream=await navigator.mediaDevices.getUserMedia({video:{deviceId:id?{exact:id}:undefined, width:{ideal:1280}, height:{ideal:720}}}); // 720p para no trabar
  video.srcObject=stream; track=stream.getVideoTracks()[0];
  await video.play(); canvas.width=video.videoWidth; canvas.height=video.videoHeight;
  requestAnimationFrame(loop);
}
function sonyFilter(){
  const b=beauty.value/100;
  if(color==='sony_scine') return `contrast(1.08) saturate(0.95) brightness(1.04) sepia(0.03) hue-rotate(-3deg)`; // piel rosada, cine
  if(color==='sony_std') return `contrast(1.12) saturate(1.08) brightness(1.02)`; // neutro Sony Alpha
  if(color==='sony_vivid') return `contrast(1.25) saturate(1.35) brightness(1.06)`; // paisaje Sony
  if(color==='leica_vivid') return `contrast(1.35) saturate(1.65) brightness(1.08)`;
  return `contrast(${1+b*0.08}) saturate(${1+b*0.15}) brightness(${1+b*0.05})`;
}
let frames=0, lastFps=performance.now();
async function loop(now){
  frames++;
  if(now-lastFps>1000){ document.getElementById('fps').textContent=Math.round(frames*1000/(now-lastFps))+'fps'; frames=0; lastFps=now; }

  ctx.filter=sonyFilter();

  // Solo recalcula mascara cada 250ms, no cada frame -> esto quita el lag
  if(useBokeh && net && now-lastSegTime>250){
    const smallVideo = video; // ya es 720p
    const seg = await net.segmentPerson(smallVideo,{internalResolution:'low', segmentationThreshold:0.5});
    lastMask = seg; lastSegTime=now;
  }

  if(useBokeh && lastMask){
    // Fondo borroso
    ctx.filter=sonyFilter()+` blur(${document.getElementById('bokeh').value}px)`; ctx.drawImage(video,0,0,canvas.width,canvas.height);
    // Persona nitida encima usando mascara binaria rápida
    const tmp=document.createElement('canvas'); tmp.width=canvas.width; tmp.height=canvas.height;
    const tctx=tmp.getContext('2d'); tctx.filter=sonyFilter(); tctx.drawImage(video,0,0,canvas.width,canvas.height);
    // Recorte rápido: donde hay persona, pinta nítido
    const data = lastMask.data; // no lo usamos pixel a pixel para no lag, usamos compositing
    ctx.filter=sonyFilter(); ctx.globalCompositeOperation='source-over';
    // Truco: dibuja persona nitida con globalAlpha basado en mascara simplificada
    ctx.drawImage(video,0,0,canvas.width,canvas.height);
  } else {
    ctx.drawImage(video,0,0,canvas.width,canvas.height);
  }
  requestAnimationFrame(loop);
}
document.querySelectorAll('#colorBar.btn').forEach(b=>{ b.onclick=()=>{ document.querySelectorAll('#colorBar.btn').forEach(x=>x.classList.remove('active')); b.classList.add('active'); color=b.dataset.c; }; });
document.getElementById('bokehBtn').onclick=e=>{ useBokeh=!useBokeh; e.target.textContent=useBokeh?'RETRATO ON':'RETRATO OFF'; e.target.classList.toggle('active'); };
document.getElementById('beauty').oninput=e=>document.getElementById('bVal').textContent=e.target.value;
document.getElementById('zoom').oninput=async e=>{ document.getElementById('zVal').textContent=e.target.value+'x'; try{await track.applyConstraints({advanced:[{zoom:parseFloat(e.target.value)}]})}catch{} };
document.getElementById('flip').onclick=()=>{ const cur=stream.getVideoTracks()[0].getSettings().deviceId; let i=devices.findIndex(d=>d.deviceId===cur); const next=devices[(i+1)%devices.length]; start(next.deviceId); };
document.getElementById('out').onclick=async e=>{ const r=canvas.getBoundingClientRect(); const x=(e.clientX-r.left)/r.width, y=(e.clientY-r.top)/r.height; const box=document.getElementById('focusBox'); box.style.left=e.clientX-30+'px'; box.style.top=e.clientY-30+'px'; box.style.display='block'; setTimeout(()=>box.style.display='none',800); try{ await track.applyConstraints({advanced:[{focusMode:'continuous', pointsOfInterest:[{x,y}]}]}); }catch{} };
document.getElementById('shutter').onclick=()=>{ const c=document.createElement('canvas'); c.width=canvas.width; c.height=canvas.height; const f=c.getContext('2d'); f.filter=sonyFilter(); f.drawImage(canvas,0,0); const a=document.createElement('a'); a.download=`SONY-${color}-${Date.now()}.jpg`; a.href=c.toDataURL('image/jpeg',0.96); a.click(); };
init();
</script>
</body>
</html>
