<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Cam Pasteles IA Gratis</title>
<style>
body{margin:0;background:#000;overflow:hidden;font-family:sans-serif}
#v{width:100vw;height:100vh;object-fit:cover;background:#111}
#focus{position:fixed;width:80px;height:80px;border:2px solid #ff0;border-radius:10px;display:none;pointer-events:none;z-index:5;transform:translate(-50%,-50%)}
#msg{position:fixed;top:15px;left:50%;transform:translateX(-50%);background:#000d;color:#fff;padding:8px 16px;border-radius:20px;z-index:10;font-size:13px;max-width:90%;text-align:center}
#ctrl{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(transparent,#000e);padding:15px;display:flex;flex-direction:column;gap:10px;z-index:10}
#row{display:flex;gap:8px;justify-content:center}
#row button{background:#222;color:#fff;border:1px solid #555;padding:12px 16px;border-radius:12px;font-weight:bold}
#row button.active{background:#ff7800;border-color:#ff7800}
#foto{width:100%;padding:16px;background:#fff;color:#000;border:none;border-radius:30px;font-size:18px;font-weight:bold}
#res{position:fixed;inset:0;background:#000;z-index:20;display:none;flex-direction:column}
#res img{flex:1;width:100%;object-fit:contain;background:#111}
#resBtns{display:flex;gap:10px;padding:15px}
#resBtns a, #resBtns button{flex:1;padding:15px;text-align:center;border-radius:10px;text-decoration:none;font-weight:bold;border:none}
#prog{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#ff7800;color:#fff;padding:6px 14px;border-radius:20px;display:none;z-index:15;font-size:13px}
</style>
</head>
<body>
<video id="v" autoplay playsinline muted></video>
<div id="focus"></div>
<div id="msg">Toca el pastel para enfocar - IA Gratis lista</div>
<div id="prog">Cargando IA...</div>

<div id="ctrl">
  <div id="row">
    <button onclick="setZoom(0.6)">0.6x</button>
    <button id="b1" class="active" onclick="setZoom(1)">1x</button>
    <button onclick="setZoom(2)">2x</button>
    <button onclick="cambiarLente()">↻ Lente</button>
  </div>
  <button id="foto" onclick="tomar()">📸 Tomar Foto IA Gratis 2x</button>
</div>

<div id="res">
  <img id="out">
  <div id="resBtns">
    <a id="down" download="pastel-HD-IA-GRATIS.jpg" style="background:#fff;color:#000">Guardar HD</a>
    <button onclick="document.getElementById('res').style.display='none'" style="background:#333;color:#fff">Cerrar</button>
  </div>
</div>

<script type="module">
import Upscaler from 'https://cdn.jsdelivr.net/npm/upscaler@1.15.4/+esm';
const upscaler = new Upscaler({ model: 'esrgan-thick' });
let modelReady = false;
upscaler.warmup([{patchSize:64, padding:2}]).then(()=>{modelReady=true; document.getElementById('msg').innerText='IA Gratis cargada ✓ - Toca el pastel para enfocar';});

window.video=document.getElementById('v'); window.stream=null; window.track=null; window.devices=[]; window.idx=0;

async function iniciar(deviceId=null){
  if(window.stream) window.stream.getTracks().forEach(t=>t.stop());
  let cons={video:{width:{ideal:1920},height:{ideal:1080},focusMode:{ideal:'continuous'}}};
  if(deviceId) cons.video.deviceId={exact:deviceId}; else cons.video.facingMode='environment';
  try{
    window.stream=await navigator.mediaDevices.getUserMedia(cons);
    window.video.srcObject=window.stream; await window.video.play(); window.track=window.stream.getVideoTracks()[0];
    try{ await window.track.applyConstraints({advanced:[{focusMode:'continuous'}]}); }catch{}
  }catch(e){ document.getElementById('msg').innerText='Error: '+e.message; }
}
async function listar(){
  try{ let all=await navigator.mediaDevices.enumerateDevices(); window.devices=all.filter(d=>d.kind=='videoinput'); }catch{}
  iniciar();
}
listar();
window.cambiarLente=()=>{
  if(window.devices.length<2){ document.getElementById('msg').innerText='Solo 1 lente en web'; return; }
  window.idx=(window.idx+1)%window.devices.length; iniciar(window.devices[window.idx].deviceId);
}
window.setZoom=async(f)=>{
  try{
    if(window.track && window.track.getCapabilities && window.track.getCapabilities().zoom){
      let c=window.track.getCapabilities().zoom; let z=f==0.6?c.min:f==2?Math.min(c.max,2.5):1;
      await window.track.applyConstraints({advanced:[{zoom:z}]});
    }
  }catch{}
}
window.video.addEventListener('click', async(e)=>{
  let box=document.getElementById('focus'); box.style.left=e.clientX+'px'; box.style.top=e.clientY+'px'; box.style.display='block';
  setTimeout(()=>box.style.display='none',1500);
  try{
    const x=e.clientX/window.innerWidth, y=e.clientY/window.innerHeight;
    await window.track.applyConstraints({advanced:[{focusMode:'manual', pointsOfInterest:[{x,y}]}]});
    setTimeout(async()=>{ try{ await window.track.applyConstraints({advanced:[{focusMode:'continuous'}]}); }catch{} },800);
  }catch{}
});

window.tomar=async()=>{
  let prog=document.getElementById('prog'); prog.style.display='block'; prog.innerText='Procesando IA Gratis 2x... (5 seg)';
  let c=document.createElement('canvas'); c.width=window.video.videoWidth; c.height=window.video.videoHeight;
  c.getContext('2d').drawImage(window.video,0,0);
  let w=c.width, h=c.height;
  document.getElementById('msg').innerText='Foto '+w+'x'+h+' -> IA Gratis mejorando...';
  try{
    // IA real gratis en el navegador
    let dataUrl = c.toDataURL('image/jpeg',0.92);
    let hd = await upscaler.upscale(dataUrl, { patchSize: 64, padding: 2, progress: (p)=>{ prog.innerText='IA '+Math.round(p*100)+'% - '+w*2+'x'+h*2; } });
    document.getElementById('out').src=hd;
    document.getElementById('down').href=hd;
    document.getElementById('res').style.display='flex';
    document.getElementById('msg').innerText='¡IA GRATIS OK! '+w+'x'+h+' -> '+(w*2)+'x'+(h*2)+' HD Real';
    prog.style.display='none';
  }catch(e){
    console.error(e);
    prog.innerText='Usando 2x rápido gratis';
    let c2=document.createElement('canvas'); c2.width=w*2; c2.height=h*2;
    let ctx=c2.getContext('2d'); ctx.imageSmoothingQuality='high'; ctx.drawImage(window.video,0,0,c2.width,c2.height);
    let hd=c2.toDataURL('image/jpeg',0.92);
    document.getElementById('out').src=hd; document.getElementById('down').href=hd;
    document.getElementById('res').style.display='flex'; prog.style.display='none';
  }
}
</script>
</body>
</html>
