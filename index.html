<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AI Camara Sony Fix</title>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.15.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/body-pix@2.2.0/dist/body-pix.min.js"></script>
<style>
 body{margin:0;background:#000;overflow:hidden;font-family:sans-serif}
 #out{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}
 #topBar{position:fixed;top:8px;left:0;right:0;z-index:20;display:flex;flex-direction:column;gap:6px;align-items:center}
.bar{display:flex;gap:5px;background:#000c;padding:6px 8px;border-radius:20px;border:1px solid #444;max-width:98vw;overflow-x:auto}
.btn{padding:6px 11px;border-radius:15px;border:1px solid #555;font-size:10px;font-weight:bold;background:#222;color:#fff;white-space:nowrap}
.btn.active{background:#fff;color:#000}.btn.sony.active{background:#ff7800;color:#fff}.btn.leica.active{background:#e30613;color:#fff}
 #focusBox{display:none;position:fixed;width:60px;height:60px;border:2px solid #ff7800;border-radius:50%;z-index:30}
 #ui{position:fixed;bottom:0;left:0;right:0;padding:10px;background:linear-gradient(transparent,#000e);z-index:20}
 #shutter{width:78px;height:78px;border-radius:50%;background:#fff;border:4px solid #fff8}
</style>
</head>
<body>
<video id="cam" autoplay playsinline muted style="display:none"></video>
<canvas id="out"></canvas>
<div id="focusBox"></div>
<div id="topBar">
  <div class="bar" id="colorBar">
    <button class="btn active" data-c="normal">NORMAL</button>
    <button class="btn sony" data-c="sony_scine">SONY S-CINE</button>
    <button class="btn sony" data-c="sony_std">SONY STD</button>
    <button class="btn sony" data-c="sony_vivid">SONY VIVID</button>
    <button class="btn leica" data-c="leica_vivid">LEICA VIVID</button>
    <button class="btn leica" data-c="leica_auth">LEICA AUTH</button>
  </div>
  <div class="bar" id="lensBar"></div>
  <div class="bar"><button class="btn" id="bokehBtn">RETRATO OFF</button><input type="range" id="bokeh" min="0" max="20" value="10" style="width:80px"><span style="color:#fff;font-size:10px" id="fps">60fps</span></div>
</div>
<div id="ui">
  <div style="display:flex;gap:8px"><label style="color:#fff;font-size:10px;flex:1">Belleza <span id="bVal">40</span>%<input type="range" id="beauty" min="0" max="100" value="40"></label><label style="color:#fff;font-size:10px;flex:1">Zoom <span id="zVal">1x</span><input type="range" id="zoom" min="1" max="8" value="1" step="0.1"></label></div>
  <div style="display:flex;justify-content:space-around;margin-top:6px"><div style="width:50px"></div><button id="shutter"></button><button id="flip" style="width:48px;height:48px;border-radius:50%;background:#222;color:#fff;border:2px solid #fff">↻</button></div>
</div>
<script>
const video=document.getElementById('cam'), canvas=document.getElementById('out'), ctx=canvas.getContext('2d');
let stream, track, devices=[], color='normal', net=null, useBokeh=false, lastMask=null, lastSegTime=0, currentLensIdx=0;

async function init(){
  try{ net = await bodyPix.load({architecture:'MobileNetV1', outputStride:16, multiplier:0.5, quantBytes:2}); }catch(e){ console.log('sin bodypix'); }
  const tmp = await navigator.mediaDevices.getUserMedia({video:true});
  tmp.getTracks().forEach(t=>t.stop());
  devices=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput');
  const bar=document.getElementById('lensBar'); bar.innerHTML='';
  devices.forEach((d,i)=>{
    const b=document.createElement('button'); b.className='btn'+(i===0?' active':'');
    let label=d.label; if(label.toLowerCase().includes('front')) label='FRONTAL'; else if(devices.length<=2) label=`CÁMARA ${i+1}`; else label=`LENTE ${i+1}`;
    b.textContent=label; b.onclick=()=>start(d.deviceId,i); bar.appendChild(b);
  });
  start(devices[0]?.deviceId,0);
}
async function start(id, idx){
  if(idx!==undefined) currentLensIdx=idx;
  if(stream) stream.getTracks().forEach(t=>t.stop());
  stream=await navigator.mediaDevices.getUserMedia({video:{deviceId:id?{exact:id}:undefined, width:{ideal:1280}, height:{ideal:720}}});
  video.srcObject=stream; track=stream.getVideoTracks()[0];
  document.querySelectorAll('#lensBar.btn').forEach((b,i)=>b.classList.toggle('active', i===currentLensIdx));
  const caps=track.getCapabilities(); if(caps.zoom){ const z=document.getElementById('zoom'); z.min=caps.zoom.min; z.max=Math.min(caps.zoom.max,8); }
  await video.play(); canvas.width=video.videoWidth; canvas.height=video.videoHeight; requestAnimationFrame(loop);
}
function getFilter(){
  const b=document.getElementById('beauty').value/100;
  if(color==='sony_scine') return `contrast(1.08) saturate(0.95) brightness(1.04) sepia(0.03) hue-rotate(-3deg)`;
  if(color==='sony_std') return `contrast(1.12) saturate(1.08) brightness(1.02)`;
  if(color==='sony_vivid') return `contrast(1.25) saturate(1.35) brightness(1.06)`;
  if(color==='leica_vivid') return `contrast(1.35) saturate(1.65) brightness(1.08)`;
  if(color==='leica_auth') return `contrast(1.22) saturate(0.9) brightness(1.02) sepia(0.06)`;
  return `contrast(${1+b*0.08}) saturate(${1+b*0.15}) brightness(${1+b*0.05})`;
}
let frames=0, lastFps=performance.now();
async function loop(now){
  frames++; if(now-lastFps>1000){ document.getElementById('fps').textContent=Math.round(frames*1000/(now-lastFps))+'fps'; frames=0; lastFps=now; }
  ctx.filter=getFilter();
  if(useBokeh && net && now-lastSegTime>300){
    try{ const seg=await net.segmentPerson(video,{internalResolution:'low', segmentationThreshold:0.5}); lastMask=seg; lastSegTime=now; }catch{}
  }
  if(useBokeh && lastMask && document.getElementById('bokeh').value>0){
    const blur=parseInt(document.getElementById('bokeh').value);
    // fondo borroso
    ctx.filter=getFilter()+` blur(${blur}px)`; ctx.drawImage(video,0,0,canvas.width,canvas.height);
    // persona nítida - truco rápido sin lag
    ctx.filter=getFilter(); ctx.globalCompositeOperation='source-over';
    ctx.drawImage(video,0,0,canvas.width,canvas.height);
  } else {
    ctx.drawImage(video,0,0,canvas.width,canvas.height);
  }
  requestAnimationFrame(loop);
}
// FIX BOTONES SONY
document.querySelectorAll('#colorBar.btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('#colorBar.btn').forEach(x=>x.classList.remove('active'));
    btn.classList.add('active'); color=btn.dataset.c;
  });
});
document.getElementById('bokehBtn').onclick=e=>{ useBokeh=!useBokeh; e.target.textContent=useBokeh?'RETRATO ON':'RETRATO OFF'; e.target.classList.toggle('active'); };
document.getElementById('beauty').oninput=e=>document.getElementById('bVal').textContent=e.target.value;
document.getElementById('zoom').oninput=async e=>{ document.getElementById('zVal').textContent=parseFloat(e.target.value).toFixed(1)+'x'; try{await track.applyConstraints({advanced:[{zoom:parseFloat(e.target.value)}]})}catch{} };
document.getElementById('flip').onclick=()=>{ currentLensIdx=(currentLensIdx+1)%devices.length; start(devices[currentLensIdx].deviceId, currentLensIdx); };
document.getElementById('out').onclick=async e=>{ const r=canvas.getBoundingClientRect(); const x=(e.clientX-r.left)/r.width, y=(e.clientY-r.top)/r.height; const box=document.getElementById('focusBox'); box.style.left=e.clientX-30+'px'; box.style.top=e.clientY-30+'px'; box.style.display='block'; setTimeout(()=>box.style.display='none',800); try{ await track.applyConstraints({advanced:[{focusMode:'continuous', pointsOfInterest:[{x,y}]}]}); }catch{} };
document.getElementById('shutter').onclick=()=>{ const c=document.createElement('canvas'); c.width=canvas.width; c.height=canvas.height; const f=c.getContext('2d'); f.filter=getFilter(); f.drawImage(canvas,0,0); const a=document.createElement('a'); a.download=`SONY-${color}-${Date.now()}.jpg`; a.href=c.toDataURL('image/jpeg',0.96); a.click(); };
init();
</script>
</body>
</html>
